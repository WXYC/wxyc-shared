name: CI

# Markdown is NOT ignored. `tests/codegen-output-paths.test.ts` asserts facts
# about CLAUDE.md and README.md — that neither tells a reader `generate:python`
# feeds a consuming service — and `paths-ignore: '**.md'` skipped this entire
# job for a docs-only PR, so those guards could never fire on the one change
# class they guard. The false claim they now pin got into both files exactly
# that way. GitHub's path filters have no negation, so the choice is ignore
# markdown and lose the guards, or run a ~1-minute job on docs PRs. Cheaper to
# run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Full history: the breaking-guard bats suite diffs api.yaml against
      # origin/main to prove the oasdiff whitelist still suppresses real
      # findings. At the default fetch-depth of 1 that ref does not exist and
      # those tests skip themselves, which would leave the suite green while
      # testing nothing — the failure mode the suite was written to close.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install oasdiff
        run: GOBIN=/usr/local/bin go install github.com/oasdiff/oasdiff@latest

      # scripts/generate-python-models.sh (#107) prefers `uv` so the pinned
      # datamodel-code-generator version in the script is authoritative rather
      # than whatever the runner happens to have on PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # setup-uv's cache is ~/.cache/uv -- exactly where `uvx` lands its
          # fetches of datamodel-code-generator/ruff (and any uv-managed
          # CPython), so there IS something worth caching here; the previous
          # comment on this step had the mechanism backwards. This repo has
          # no pyproject.toml/uv.lock/requirements*.txt for the default
          # cache-dependency-glob to key off, so point it at the one file
          # that should invalidate the cache: the pin itself. Bumping
          # DATAMODEL_CODEGEN_PIN (or the --python version) changes this
          # file's hash and busts the cache; nothing else in this repo needs
          # to.
          cache-dependency-glob: 'scripts/generate-python-models.sh'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate TypeScript types
        run: npm run generate:typescript

      # Proves the pinned generator + current api.yaml still produce output,
      # the same way the TypeScript step above does for openapi-typescript.
      # generated/python/ is gitignored and consumed by nobody (see CLAUDE.md's
      # Code Generation section) -- this is a "did it run" check, not a
      # diff-against-committed-output check.
      - name: Generate Python models
        run: npm run generate:python

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run lint

      # Typecheck the e2e/ suite too. It's excluded from `lint` (base tsconfig
      # excludes e2e/) and from `npm test` (vitest excludes e2e/**), so without
      # this step a broken e2e file merges green here and first surfaces as a
      # bs-lml-gate failure that blocks BS/LML prod promotion. See #266.
      - name: Type check (e2e)
        run: npm run lint:e2e

      - name: Test
        run: npm test

      # The bats suites guard shell scripts that vitest cannot reach. They were
      # runnable-but-unrun until now: a regression in check-breaking-changes.sh
      # merged green here and surfaced later as an unexplained red
      # breaking-changes job on someone else's PR.
      - name: Shell script guards
        run: |
          npm run test:breaking-guard
          npm run test:setup-script
          npm run test:drift-guard
          npm run test:python-codegen
          npm run test:spec-drift-guard
          npm run test:version-bump-guard

      # Cross-service contract suite (see INVARIANTS.md, src/contracts.ts).
      # When $E2E_BASE_URL is unset, every test in the file is `skipIf`-ed
      # or `skip`-ed so vitest never reaches `beforeAll` (no live stack
      # needed). When CI provides $E2E_BASE_URL + DJ credentials, the
      # ENFORCED contracts (BEARER_IS_JWT_NOT_SESSION, FLOWSHEET_DJ_NAME_NON_NULL)
      # run against the stack. The two NOT-YET-ENFORCED contracts
      # (PLAY_ORDER, ROTATION_DEDUP) stay `it.skip` at source until
      # WXYC/Backend-Service#693 + #694 land.
      - name: Contract suite (E2E)
        if: vars.E2E_BASE_URL != ''
        run: npm run test:e2e:contracts
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_AUTH_URL: ${{ vars.E2E_AUTH_URL }}
          E2E_TEST_DJ_EMAIL: ${{ secrets.E2E_TEST_DJ_EMAIL }}
          E2E_TEST_DJ_PASSWORD: ${{ secrets.E2E_TEST_DJ_PASSWORD }}
