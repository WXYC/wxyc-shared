name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wxyc'

      # Pinned: v1.34.0 flags added response-enum values as breaking and fails
      # tests/breaking-changes.test.ts. Unpin in #720.
      - name: Install oasdiff
        run: GOBIN=/usr/local/bin go install github.com/oasdiff/oasdiff@v1.33.0

      - name: Install dependencies (skip build)
        run: npm ci --ignore-scripts

      - name: Generate TypeScript types from OpenAPI
        run: npm run generate:typescript

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
