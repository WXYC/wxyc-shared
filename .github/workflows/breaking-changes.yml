name: Breaking Change Check

on:
  pull_request:
    paths:
      - 'api.yaml'
      # The whitelist is listed so a PR that touches only that file still runs
      # this job. oasdiff exits 121 on a missing --err-ignore path, and the file
      # invites its own deletion ("prune dead entries"). Without this line, the
      # PR that empties and removes it skips the job and merges green, and the
      # 121 detonates on an unrelated author's next api.yaml PR as a red
      # "breaking changes detected" comment about changes that don't exist.
      # scripts/check-breaking-changes.sh has a matching local preflight, but
      # this is a CI-only failure and the deleter may never run the script.
      - 'oasdiff-err-ignore.txt'

jobs:
  check-breaking:
    name: Check for Breaking API Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get base branch spec
        run: |
          git show origin/${{ github.base_ref }}:api.yaml > api-base.yaml 2>/dev/null || {
            echo "No api.yaml found in base branch, skipping comparison"
            echo "skip=true" >> $GITHUB_OUTPUT
          }
        id: base

      - name: Check for breaking changes
        if: steps.base.outputs.skip != 'true'
        id: diff
        uses: oasdiff/oasdiff-action/breaking@0ab8ad204b00d25acc5ae87106281433e288d0c1 # v0.1.10
        with:
          base: api-base.yaml
          revision: api.yaml
          fail-on: ERR
          # Findings whitelisted with a written justification. Each entry is
          # scoped to a main..PR diff and goes inert once merged; see the file's
          # header. scripts/check-breaking-changes.sh passes the same file, so a
          # local `npm run check:breaking` matches this job.
          err-ignore: oasdiff-err-ignore.txt

      - name: Comment on PR (Breaking Changes Found)
        if: failure() && steps.base.outputs.skip != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `${{ steps.diff.outputs.breaking }}`;

            const body = `## Breaking API Changes Detected

            This PR contains changes to \`api.yaml\` that may break existing clients.

            <details>
            <summary>Diff Output</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            ### Impact
            - Mobile apps (iOS/Android) using older app versions will be affected
            - Backend consumers using the current API contract may break

            ### Required Actions
            - [ ] Confirm breaking changes are intentional
            - [ ] Notify mobile team if applicable
            - [ ] Consider API versioning or deprecation strategy
            - [ ] Update CHANGELOG

            ---
            *This comment was auto-generated by the breaking change detection workflow.*`;

            // Check if there's already a comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Breaking API Changes Detected')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Comment on PR (No Breaking Changes)
        if: success() && steps.base.outputs.skip != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Breaking API Changes Detected')
            );

            if (botComment) {
              const body = `## ~~Breaking API Changes Detected~~

              Previously detected breaking changes have been resolved.

              ---
              *This comment was auto-generated by the breaking change detection workflow.*`;

              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
