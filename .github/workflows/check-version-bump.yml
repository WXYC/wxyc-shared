name: API Version Bump Check

# Fails any PR that changes api.yaml's CONTENT without also moving
# info.version. See CLAUDE.md's "Version bump gate" section and #347: four
# of the five most recent api.yaml-touching commits before this check landed
# at an unchanged info.version, including one that added a whole path and
# schema (363718c). scripts/check-version-bump.sh does the actual
# comparison; this workflow just wires it into pull_request the same way
# breaking-changes.yml wires up oasdiff.

on:
  pull_request:
    paths:
      - 'api.yaml'

permissions:
  contents: read

jobs:
  check-version-bump:
    name: Check api.yaml bumps info.version on content change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check info.version moved with api.yaml content
        run: bash scripts/check-version-bump.sh
