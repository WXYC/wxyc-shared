name: API Version Bump Check

# Fails any PR that changes api.yaml's CONTENT without also moving
# info.version forward. See CLAUDE.md's "Version bump gate" section and
# #347: all five of the most recent api.yaml-touching commits before this
# check landed at an unchanged info.version, including one that added a
# whole path and schema (363718c). scripts/check-version-bump.sh does the
# actual comparison; this workflow wires it into pull_request the same way
# breaking-changes.yml wires up oasdiff — including resolving the PR's own
# base ref rather than assuming origin/main, so a stacked PR is compared
# against the base it will actually merge into.

on:
  pull_request:
    paths:
      - 'api.yaml'

permissions:
  contents: read

jobs:
  check-version-bump:
    name: Check api.yaml bumps info.version on content change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check info.version moved with api.yaml content
        # BASE_REF goes through env, never inline into the script text —
        # branch names are caller-controlled (see the ${{ }} discipline in
        # CLAUDE.md's reusable-workflow section).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:api.yaml" > "${RUNNER_TEMP}/base-api.yaml"
          bash scripts/check-version-bump.sh "${RUNNER_TEMP}/base-api.yaml"
