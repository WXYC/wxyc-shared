    # ===================
    # Concerts / On Tour Types (Backend-Service#1603)
    # ===================

    Venue:
      type: object
      description: |
        A live-music venue whose calendar WXYC ingests (Backend-Service
        `venues` table). Embedded whole in `Concert` — the venue set is tiny
        (~21 rows), so clients get name/city in one call with no follow-up
        join.
      required:
        - id
        - slug
        - name
        - city
        - state
        - address
      properties:
        id:
          type: integer
        slug:
          type: string
          description: Stable scraper seed key (e.g. "cats-cradle").
        name:
          type: string
        city:
          type: string
        state:
          type: string
        address:
          type: string
          nullable: true

    ConcertStatus:
      type: string
      description: >-
        Lifecycle state of a concert as observed at the source. Listener
        surfaces read this to grey out / strike through cancelled or
        sold-out shows.
      enum:
        - on_sale
        - sold_out
        - cancelled
        - rescheduled

    SimilarArtist:
      type: object
      description: >-
        One affinity neighbor of a resolved concert headliner, drawn from
        the semantic-index graph. `artist_id` shares the WXYC catalog
        artist-id keyspace with `Concert.headlining_artist_id` (and
        `FlowsheetV2TrackEntry.artist_id`), so on-device For You
        matching can intersect it against liked-artist ids in one id space.
      required:
        - artist_id
        - weight
      properties:
        artist_id:
          type: integer
          description: >-
            WXYC catalog artist id, same keyspace as
            `Concert.headlining_artist_id`.
        weight:
          type: number
          description: >-
            semantic-index affinity score, used for client-side ranking and
            the similar-tier noise cap. Higher is closer.

    Concert:
      type: object
      description: |
        One upcoming (or recent) concert, as served by `GET /concerts`.

        Date semantics: `starts_on` is the venue-local (America/New_York)
        calendar date and is always present — clients should window and sort
        on it. `starts_at` is the exact start instant and is null for
        date-only events (many sources publish no start time; WXYC never
        fabricates one).

        Internal ingestion columns (`source`, `source_id`, `raw_data`,
        `scraped_at`, `first_scraped_at`) are deliberately not exposed.
      required:
        - id
        - venue
        - starts_on
        - starts_at
        - doors_at
        - headlining_artist_raw
        - headlining_artist_id
        - title
        - supporting_artists_raw
        - ticket_url
        - image_url
        - event_url
        - price_min
        - price_max
        - age_restriction
        - status
      properties:
        id:
          type: integer
        venue:
          $ref: '#/components/schemas/Venue'
        starts_on:
          type: string
          format: date
          description: Venue-local (America/New_York) calendar date.
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Exact start instant; null for date-only events.
        doors_at:
          type: string
          format: date-time
          nullable: true
          description: Doors-open instant, when the source publishes one.
        headlining_artist_raw:
          type: string
          description: Headliner billing string exactly as the source displays it.
        headlining_artist_id:
          type: integer
          nullable: true
          description: >-
            WXYC catalog artist id when the resolver matched the headliner;
            null otherwise. A non-null id is what `curated=true` filters on.
        title:
          type: string
          nullable: true
          description: >-
            Event name as the source displays it, when distinct from the
            artist billing.
        supporting_artists_raw:
          type: array
          items:
            type: string
          description: Supporting-act billing strings, in source order.
        ticket_url:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        event_url:
          type: string
          nullable: true
          description: >-
            The venue's own event-detail page, distinct from `ticket_url`
            (often a third-party seller like Etix/Ticketmaster). Null when no
            venue page is known; clients fall back to `ticket_url`.
        price_min:
          type: number
          nullable: true
          description: Dollars. Free events carry price_min = 0.
        price_max:
          type: number
          nullable: true
          description: Dollars.
        age_restriction:
          type: string
          nullable: true
          description: Source-displayed age restriction (e.g. "18+", "All Ages").
        status:
          $ref: '#/components/schemas/ConcertStatus'
        genres:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Discogs genre tags for the resolved headlining artist,
            aggregated across their releases (LML discogs-cache,
            majority-take). Null when the headliner is unresolved or
            enrichment has not run. Optional (not in `required`) so the
            field can land ahead of the Backend-Service emitter and older
            clients decode forward-compatibly — same discipline as
            `FlowsheetV2TrackEntry.upcoming_show`. Same taxonomy as
            `FlowsheetV2TrackEntry.genres`.
        similar_artists:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SimilarArtist'
          description: >-
            Top-K affinity neighbors of the resolved headliner, computed
            nightly from the semantic-index graph and ordered by `weight`
            descending. Null when the headliner is unresolved or enrichment
            has not run. Powers on-device For You matching (set intersection
            against liked-artist ids). Optional (not in `required`) so it can
            land ahead of the Backend-Service emitter and older clients
            decode forward-compatibly — same discipline as `Concert.genres`.
        station_plays:
          type: integer
          nullable: true
          deprecated: true
          description: >-
            Deprecated — use `station_recommended` instead. Play counts were
            rejected as the station-tier signal in the "WXYC recommends"
            redesign (WXYC/wxyc-ios-64#576); the tier now keys on rotation
            membership. All-time WXYC flowsheet play count of the resolved
            (in-library) headliner, computed nightly from the semantic-index
            graph; null when the headliner is not in the library or has no
            play count. Identical for every listener. Stays on the wire until
            the removal ticket (WXYC/Backend-Service#1732) clears its
            adoption gate; will be removed in a future major version.
        station_recommended:
          type: boolean
          description: >-
            True when the concert's resolved headliner
            (`headlining_artist_id`) has at least one WXYC library release
            that has been in rotation — any rotation row, past or present
            ("has been in rotation", not "currently in rotation"). Omitted or
            false for concerts with no library-resolved headliner, including
            Discogs-only resolutions (`headlining_discogs_artist_id` without
            `headlining_artist_id` in the Backend), which by construction
            have no library releases to hold rotation membership. The
            rotation-membership signal behind the On Tour "For You" station
            tier ("WXYC recommends", WXYC/wxyc-ios-64#576); replaces the
            deprecated `station_plays`. This is the GATE (rotation
            membership) — see `station_recommended_rank` for the
            plays-ordered selection rank within that gate. Identical for
            every listener; carries no listener data. Optional (not in
            `required`) so it can land ahead of the Backend-Service emitter
            and older clients decode forward-compatibly — same discipline as
            `Concert.similar_artists`.
        station_recommended_rank:
          type: integer
          nullable: true
          description: >-
            1-based rank of this concert within the station's "WXYC recommends"
            set — among upcoming concerts whose resolved headliner is in rotation
            (station_recommended = true), ordered by the station's ranking signal
            (all-time WXYC plays), rank 1 = strongest. Null when the concert is
            not in the set (headliner not rotation-gated). This is the field the
            client sorts the station tier by; station_recommended is the gate
            (rotation membership), this is the plays-ordered selection rank within
            that gate. Identical for every listener; carries no listener data.
            Optional (not in `required`) and nullable so it can land ahead of the
            Backend-Service emitter and older clients decode forward-compatibly —
            same discipline as `Concert.station_plays`.
        artist_bio:
          type: string
          nullable: true
          description: >-
            Artist biography from the resolved headliner's Discogs profile
            (raw Discogs markup, parsed client-side), keyed on the effective
            Discogs artist id and cached nightly on `artist_metadata`. Null
            when the headliner is unresolved, has no Discogs profile, or
            enrichment has not run. Identical for every listener; carries no
            listener data. Renders the On Tour concert-detail "About the
            Artist" card. Optional (not in `required`) so it can land ahead of
            the Backend-Service emitter and older clients decode
            forward-compatibly — same discipline as `Concert.similar_artists`.

    ConcertsResponse:
      type: object
      description: Paginated list of concerts, ordered by `starts_on` ascending.
      required:
        - concerts
        - pagination
      properties:
        concerts:
          type: array
          items:
            $ref: '#/components/schemas/Concert'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    # ===================
    # Song Like Tallies
    # ===================

    SongLikeDelta:
      type: object
      description: >-
        One increment or decrement to a song's public like tally. Carries
        the song's identity and nothing whatsoever about who liked it —
        see `POST /likes/tally` for why no listener key exists anywhere in
        this contract.
      required:
        - song_key
        - song_title
        - artist_name
        - delta
      properties:
        song_key:
          type: string
          description: >-
            The client's folded identity for the song: `SongKey.fold`
            applied to artist and title, joined with `|` (case-,
            diacritic-, and width-insensitive, whitespace collapsed). The
            server stores this verbatim as the tally's key and MUST NOT
            recompute it — the client's fold is authoritative for song
            identity. Album is deliberately excluded from the key, so a
            single, an LP cut, and a free-text replay all tally together.
        song_title:
          type: string
          description: Raw, unfolded song title, exactly as displayed on-device.
        artist_name:
          type: string
          description: >-
            Raw, unfolded artist name, exactly as displayed on-device —
            NOT the folded value baked into `song_key`. The server folds
            this itself with its own `fold_artist_name` (NFD, strip
            combining diacritics, lowercase — no width folding, no
            whitespace collapsing; the twin of the SQL
            `wxyc_schema.fold_artist_name`) to attempt a catalog match
            when `artist_id` is absent. The client's fold and the server's
            fold are deliberately different functions and are never
            required to agree: width-variant or multi-space artist names
            may match under one and miss under the other. This field
            exists for that best-effort match, not for identity —
            `song_key` alone owns that.
        release_title:
          type: string
          description: >-
            Album/release title, when the like has one. Optional:
            standalone tracks and some free-text plays carry no matched
            release.
        artist_id:
          type: integer
          description: >-
            WXYC catalog artist id, when already resolved on-device (e.g.
            healed from a V2 flowsheet play). Optional and absent for
            name-only likes sourced from the V1 API or free-text plays;
            the server then falls back to matching `artist_name` via its
            own fold, leaving the artist unresolved — never failing the
            write — on a miss.
        delta:
          type: integer
          enum:
            - -1
            - 1
          description: >-
            `1` when the listener liked the song, `-1` when they unliked
            it. The server clamps the resulting tally at zero: deltas are
            fire-and-forget and lossy by design, so a `-1` can arrive
            without its matching `1`.

    SongLikeTallyRequest:
      type: object
      description: >-
        Request body for `POST /likes/tally`. A batch of independent
        counter deltas — NOT a snapshot of anyone's library, and not an
        event log that could be reassembled into one.
      required:
        - deltas
      properties:
        deltas:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SongLikeDelta'
          description: >-
            One or more deltas, at most 1000. Order carries no meaning. A
            client normally sends a single delta per toggle; the array
            exists so a client adopting the feature can submit the likes
            already on the device in one request. A device holding more
            than 1000 likes chunks them across requests — there is no
            cross-request continuity to preserve, since each delta is
            independent and the endpoint holds no per-caller state.

    SongLikeTallyResponse:
      type: object
      description: Response body for `POST /likes/tally`.
      required:
        - applied
        - resolved
      properties:
        applied:
          type: integer
          description: Number of deltas applied to the tallies.
        resolved:
          type: integer
          description: >-
            Of `applied`, how many carried or matched a WXYC catalog
            artist id. Diagnostic only: it describes catalog coverage, not
            the caller.

    # ===================
    # Album Reviews (issue #229)
    # ===================

    AlbumReview:
      type: object
      description: |
        One archived DJ album review, sourced from the WXYC album-review
        Google Form (collected since March 2021) and synced nightly by
        Backend-Service's album-reviews ETL.

        Distinct from ADR 0006's in-app Review model (one-per-album,
        author-owned, `/reviews`): submissions here are append-only, may
        number several per album, and identify albums by free text with a
        best-effort `album_id` link. Reviewer identity is deliberately not
        exposed — the form promised reviewers their names would not be
        shared.
      required:
        - id
        - album_id
        - artist_name
        - album_title
        - record_label
        - artist_blurb
        - review
        - recommended_tracks
        - buzzwords
        - fcc_violations
        - review_purpose
        - rotated
        - released_within_six_months
        - social_consent
        - submitted_at
      properties:
        id:
          type: integer
        album_id:
          type: integer
          nullable: true
          description: >-
            WXYC library album id when the free-text artist/album resolved
            to exactly one catalog row; null otherwise.
        artist_name:
          type: string
          nullable: true
          description: Artist name exactly as the reviewer entered it.
        album_title:
          type: string
          nullable: true
          description: Album title exactly as the reviewer entered it.
        record_label:
          type: string
          nullable: true
        artist_blurb:
          type: string
          nullable: true
          description: Short reviewer-written background on the artist.
        review:
          type: string
          nullable: true
          description: The review body.
        recommended_tracks:
          type: string
          nullable: true
          description: >-
            Raw recommended-tracks text, including the form's `!`-rating
            notation (1–5 exclamation marks) and "Play All" shorthand.
        buzzwords:
          type: string
          nullable: true
          description: Comma-separated reviewer-chosen descriptors.
        fcc_violations:
          type: string
          nullable: true
          description: >-
            Verbatim reviewer answer listing FCC-violating track numbers.
            Blank (unanswered) is distinct from "None"/"N/A" (affirmatively
            clean); values are not normalized.
        review_purpose:
          type: string
          nullable: true
          description: >-
            Raw multi-select of "Rotation", "New DJ Assignment", "Album in
            the Library"; comma-joined when multiple were selected.
        rotated:
          type: boolean
          nullable: true
          description: >-
            Curator-maintained "was this album rotated" flag; null when the
            sheet cell is blank or unparseable.
        released_within_six_months:
          type: boolean
          nullable: true
          description: >-
            Whether the album was released within 6 months of the review;
            null when unanswered (question added mid-2024).
        social_consent:
          type: boolean
          nullable: true
          description: >-
            Whether the reviewer consented to the review being shared on
            station social media (always anonymously); null when unanswered.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Form submission instant. Null only for the rare row whose sheet
            timestamp is missing.

    AlbumReviewsResponse:
      type: object
      description: >-
        Paginated list of album-review submissions, ordered by
        `submitted_at` descending (nulls last).
      required:
        - album_reviews
        - pagination
      properties:
        album_reviews:
          type: array
          items:
            $ref: '#/components/schemas/AlbumReview'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    # ===================
    # Device Authorization (RFC 8628) — issue #195
    # Mirrors the better-auth device-authorization plugin (1.6.20 — the version
    # WXYC's auth-service runs, per Backend-Service#1495) PLUS WXYC's BS hooks.
    # Wire shapes verified against
    # node_modules/better-auth/dist/plugins/device-authorization/routes.mjs.
    # Error enums mirror RUNTIME behavior (a superset of the plugin's declared
    # zod enums). Casing is intentionally asymmetric: code/token/verify use
    # snake_case; approve/deny request bodies use camelCase `userCode`.
    # ===================

    DeviceAuthCodeRequest:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
          description: The client ID of the application requesting authorization.
        scope:
          type: string
          description: Optional space-separated list of OAuth scopes.
        user_id:
          type: string
          description: >
            Optional. The user ID to which the device code should be pre-bound
            (a better-auth 1.6.20+ plugin field). WXYC's shared-computer QR flow
            does not send this — the DJ is identified later at
            /auth/device/approve — but it is mirrored here for runtime fidelity.

    DeviceAuthCodeResponse:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          description: The device verification code, polled at /auth/device/token.
        user_code:
          type: string
          description: The short code shown to the user / encoded in the QR.
        verification_uri:
          type: string
          format: uri
          description: URL where the user verifies the code.
        verification_uri_complete:
          type: string
          format: uri
          description: verification_uri with user_code pre-filled as a query parameter.
        expires_in:
          type: integer
          description: 'Lifetime of the device/user code in seconds (WXYC config: 300 = 5min).'
        interval:
          type: integer
          description: 'Minimum polling interval in seconds (WXYC config: 5).'

    DeviceAuthTokenRequest:
      type: object
      required:
        - grant_type
        - device_code
        - client_id
      properties:
        grant_type:
          type: string
          enum:
            - 'urn:ietf:params:oauth:grant-type:device_code'
          description: RFC 8628 device-flow grant type (fixed value).
        device_code:
          type: string
          description: The device_code returned by /auth/device/code.
        client_id:
          type: string
          description: The client ID of the application.

    DeviceAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
          description: The session bearer token for the browser.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: >
            Token lifetime in seconds. WXYC's auth-service (Backend-Service#1495,
            hooks.after on /device/token) rewrites the plugin's session-derived
            value to a fixed 43200 (12h). The vanilla-plugin value would otherwise
            be the global ~7-day session TTL.
        scope:
          type: string
          description: Granted scopes (empty string when none were requested).

    DeviceAuthStatus:
      type: string
      description: Current status of a device authorization (GET /auth/device).
      enum:
        - pending
        - approved
        - denied

    DeviceAuthVerifyResponse:
      type: object
      required:
        - user_code
        - status
      properties:
        user_code:
          type: string
        status:
          $ref: '#/components/schemas/DeviceAuthStatus'

    DeviceAuthApproveRequest:
      type: object
      required:
        - userCode
      properties:
        userCode:
          type: string
          description: >
            The user code to approve. NOTE: camelCase on the wire — the plugin's
            approve/deny bodies differ from the snake_case code/token bodies.

    DeviceAuthDenyRequest:
      type: object
      required:
        - userCode
      properties:
        userCode:
          type: string
          description: >
            The user code to deny. NOTE: camelCase on the wire (see
            DeviceAuthApproveRequest).

    DeviceAuthActionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Always true on success. Shared by /approve and /deny.

    # --- Per-endpoint error envelopes. The shape { error, error_description } is
    # --- modeled once per endpoint; the `error` enum is constrained per path to
    # --- the RUNTIME superset — it includes codes the plugin emits but omits from
    # --- its declared zod (server_error, expired_token) and excludes a declared-
    # --- but-never-emitted code (device_code_already_processed). One enum per
    # --- endpoint, listing every code it can emit across all its HTTP statuses,
    # --- so a polling client switches over a single exhaustive type.

    DeviceAuthCodeErrorCode:
      type: string
      description: Error codes for POST /auth/device/code.
      enum:
        - invalid_request
        - invalid_client

    DeviceAuthCodeError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/DeviceAuthCodeErrorCode'
        error_description:
          type: string

    DeviceAuthTokenErrorCode:
      type: string
      description: >
        Error codes for POST /auth/device/token — the RFC 8628 polling vocabulary
        the browser switches on. `server_error` is emitted at runtime (HTTP 500)
        though it is absent from the plugin's declared zod enum.
      enum:
        - authorization_pending
        - slow_down
        - expired_token
        - access_denied
        - invalid_request
        - invalid_grant
        - server_error

    DeviceAuthTokenError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/DeviceAuthTokenErrorCode'
        error_description:
          type: string

    DeviceAuthVerifyErrorCode:
      type: string
      description: >
        Error codes for GET /auth/device. `expired_token` is emitted at runtime
        (HTTP 400) though the plugin's declared zod enum lists only invalid_request.
      enum:
        - invalid_request
        - expired_token

    DeviceAuthVerifyError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/DeviceAuthVerifyErrorCode'
        error_description:
          type: string

    DeviceAuthActionErrorCode:
      type: string
      description: >
        Error codes for POST /auth/device/approve and POST /auth/device/deny
        (shared — both routes emit the same set). `device_code_already_processed`
        is declared in the plugin's approve zod enum but is NEVER emitted on the
        wire — the already-processed branch throws `invalid_request` — so it is
        intentionally omitted here (mirror runtime).
      enum:
        - invalid_request
        - expired_token
        - unauthorized
        - access_denied

    DeviceAuthActionError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/DeviceAuthActionErrorCode'
        error_description:
          type: string

    # ===================
    # Auth — better-auth core surface (issue #379, wxyc-swift-auth Phase A).
    # Mirrors better-auth 1.6.26 (Backend-Service's node_modules-resolved
    # version; package.json ranges to ^1.6.30) plus one WXYC-custom route,
    # /auth/wxyc/lookup-email, which is marked below and sits outside the
    # pinned-mirror's scope. Wire shapes verified against
    # node_modules/better-auth/dist/{api/routes,plugins/{username,anonymous,
    # jwt,email-otp,bearer}}/*.mjs plus direct probes against api.wxyc.org
    # for status-code edge cases (the GET /auth/token 401-vs-404 split
    # below). $ref-closed within this subset: no schema here $refs the
    # shared ApiErrorResponse, whose `details` field (additionalProperties:
    # true) forces JSONValue codegen and would pull that into the auth
    # subset's public surface — see the wxyc-swift-auth plan's Phase A1
    # $ref-closure constraint.
    # ===================

    AuthUser:
      type: object
      description: >
        The better-auth user row as every sign-in / token-exchange response
        in this section embeds it — parseUserOutput's serialization of the
        `user` table plus the admin() plugin's fields plus WXYC's
        `user.additionalFields` (Backend-Service
        shared/authentication/src/auth.definition.ts). Shared across every
        sign-in response below: the row shape does not depend on which route
        created or found it. Verified field-for-field against a live
        POST /auth/sign-in/anonymous response.
      required:
        - id
        - email
        - emailVerified
        - name
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        name:
          type: string
        image:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
          description: >
            The admin() plugin's system role flag on `user.role` (default
            "user") — NOT a WXYC station role. Station role (member, dj,
            musicDirector, stationManager, admin) lives on
            `organization_member.role` and is resolved separately into the
            JWT's `role` claim (buildJwtPayload / selectMemberRole in
            auth.definition.ts); it is not this field. See that file's own
            comment: "auth_user.role ... carries no station role."
        banned:
          type: boolean
          nullable: true
        banReason:
          type: string
          nullable: true
        banExpires:
          type: string
          format: date-time
          nullable: true
        username:
          type: string
          nullable: true
        displayUsername:
          type: string
          nullable: true
        isAnonymous:
          type: boolean
          nullable: true
        hasCompletedOnboarding:
          type: boolean
          description: WXYC additionalField; defaults false at creation.
        realName:
          type: string
          nullable: true
        djName:
          type: string
          nullable: true
        appSkin:
          type: string
          description: WXYC additionalField; defaults "modern-light" at creation.
        capabilities:
          type: array
          items:
            type: string
          description: WXYC additionalField; defaults [] at creation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmailSignInRequest:
      type: object
      description: Body for POST /auth/sign-in/email.
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        callbackURL:
          type: string
          description: >
            Redirect target after sign-in / email verification. WXYC's
            native clients never send this — a callbackURL flips `redirect`
            true in the response and sets a Location header, both meant for
            a browser.
        rememberMe:
          type: boolean
          default: true
          description: When false, the session is not remembered (shorter-lived cookie).

    UsernameSignInRequest:
      type: object
      description: Body for POST /auth/sign-in/username.
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        callbackURL:
          type: string
        rememberMe:
          type: boolean

    AuthSignInResult:
      type: object
      description: >
        Response body for POST /auth/sign-in/email and POST
        /auth/sign-in/username — identical shape, since both routes end in
        the same session-create + setSessionCookie call (better-auth
        dist/api/routes/sign-in.mjs signInEmail; dist/plugins/username
        signInUsername). `token` also arrives on the `set-auth-token`
        response header (see the two paths below); the body is the
        documented fallback when a caller can't read response headers.
      required:
        - redirect
        - token
        - user
      properties:
        redirect:
          type: boolean
          description: True when callbackURL was supplied and the client should follow Location.
        token:
          type: string
          description: The session token.
        url:
          type: string
          nullable: true
          description: The callbackURL echoed back, or null when none was supplied.
        user:
          $ref: '#/components/schemas/AuthUser'

    OTPSignInRequest:
      type: object
      description: >
        Body for POST /auth/sign-in/email-otp. `name`/`image` are consulted
        only the first time this email signs in (the route auto-registers an
        unknown address on a correct code — disableSignUp gates
        send-verification-otp, not this route).
      required:
        - email
        - otp
      properties:
        email:
          type: string
        otp:
          type: string
        name:
          type: string
        image:
          type: string

    AuthTokenAndUserResult:
      type: object
      description: >
        Response body shared by POST /auth/sign-in/anonymous and POST
        /auth/sign-in/email-otp — both answer `{token, user}` with no
        redirect/url (better-auth dist/plugins/anonymous/index.mjs
        signInAnonymous; dist/plugins/email-otp/routes.mjs signInEmailOTP).
        One type for two endpoints, per the DeviceAuthActionResponse
        precedent above.
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthTokenResponse:
      type: object
      description: Response body for GET /auth/token — the short-lived JWT.
      required:
        - token
      properties:
        token:
          type: string
          description: A signed JWT, verifiable against the JWKS at GET /auth/jwks.

    AuthSignOutResult:
      type: object
      description: >
        Response body for POST /auth/sign-out. Always `{success: true}` on
        200 — a failure to delete the session server-side is logged, not
        surfaced (better-auth dist/api/routes/sign-out.mjs signOut).
      required:
        - success
      properties:
        success:
          type: boolean

    LookupEmailRequest:
      type: object
      description: >
        Body for POST /auth/wxyc/lookup-email — a WXYC-custom route (see the
        path's own comment), not a better-auth one.
      required:
        - identifier
      properties:
        identifier:
          type: string

    LookupEmailResponse:
      type: object
      description: >
        `email: null` means no account matches `identifier` — the one
        precise failure this route can report (apps/auth/lookup-email.ts).
        Everything downstream of a resolved email is deliberately vague
        (anti-enumeration): send-verification-otp answers success for an
        unknown address, and sign-in/email-otp answers the same INVALID_OTP
        for a wrong code as for no account.
      required:
        - email
      properties:
        email:
          type: string
          nullable: true

    SendLoginCodeRequest:
      type: object
      description: Body for POST /auth/email-otp/send-verification-otp.
      required:
        - email
        - type
      properties:
        email:
          type: string
        type:
          type: string
          enum:
            - sign-in
            - email-verification
            - forget-password
            - change-email
          description: >
            WXYC's OTP sign-in flow always sends "sign-in". "change-email"
            is declared by the plugin's own schema but always 400s here — a
            dedicated /email-otp/request-email-change route exists for it.

    AuthSendCodeResult:
      type: object
      description: >
        Response body for POST /auth/email-otp/send-verification-otp.
        Always `{success: true}` on 2xx — disableSignUp: true makes the
        server answer identically for an unknown address (anti-enumeration),
        so a 2xx here does not confirm the account exists.
      required:
        - success
      properties:
        success:
          type: boolean

    AuthErrorResponse:
      type: object
      description: >
        better-auth's uniform error body (@better-auth/core's
        `APIError.from`/`defineErrorCodes`: `{message, code}`). Purpose-built
        rather than a $ref to the shared ApiErrorResponse — see this
        section's header comment. Answers every non-2xx response from this
        section's better-auth-native operations except the 429s, which the
        Express rate limiter in front of them answers in a different shape
        (AuthPlainErrorResponse, below).
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          description: >
            A defineErrorCodes key, e.g. INVALID_EMAIL_OR_PASSWORD,
            INVALID_USERNAME_OR_PASSWORD, INVALID_EMAIL, EMAIL_NOT_VERIFIED,
            UNAUTHORIZED, INVALID_OTP, OTP_EXPIRED, TOO_MANY_ATTEMPTS,
            ANONYMOUS_USERS_CANNOT_SIGN_IN_AGAIN_ANONYMOUSLY,
            COULD_NOT_CREATE_SESSION, FAILED_TO_CREATE_USER,
            MISSING_OR_NULL_ORIGIN. Left open rather than enumerated —
            unlike DeviceAuth's closed, small RFC 8628 vocabulary,
            better-auth's general error surface is broad and not
            practically exhaustible per operation.

    AuthPlainErrorResponse:
      type: object
      description: >
        `{error: string}` — the shape Backend-Service's own Express layer
        answers with, distinct from better-auth's `{message, code}`. Two
        sources share it: the WXYC-custom /auth/wxyc/lookup-email route
        (apps/auth/app.ts lookupEmailHandler, `res.json({error: ...})`) and
        the express-rate-limit mutation limiter mounted in front of every
        rate-limited /auth/* route in this section (apps/auth/app.ts
        authMutationRateLimit — 10 requests / 15 min, keyed on
        X-Real-IP — `message: {error: ...}`).
      required:
        - error
      properties:
        error:
          type: string

    RateLimitInfo:
      type: object
      required:
        - remaining
        - reset_at
        - limit
      properties:
        remaining:
          type: integer
        reset_at:
          type: string
          format: date-time
        limit:
          type: integer

    RequestSubmissionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        request_id:
          type: integer
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        message:
          type: string

    # ===================
    # Metadata Types
    # ===================

    MetadataSource:
      type: string
      enum:
        - discogs
        - spotify
        - apple_music
        - cache
        - none

    MetadataStatus:
      type: string
      enum:
        - pending
        - enriching
        - enriched_match
        - enriched_no_match
        - failed_no_retry
      description: >
        Enrichment lifecycle for a track row in the V2 flowsheet response. Source-of-truth is
        the `metadata_status_enum` Postgres type in Backend-Service (see WXYC/Backend-Service#891).
        Set to `pending` on insert; the enrichment worker (WXYC/Backend-Service#892) flips it
        to `enriching` while a Discogs lookup is in flight, then to one of the three terminal
        states. iOS branches on this to decide whether to render inline metadata or fall back
        to the proxy-fetch path (WXYC/wxyc-ios-64#270). Only emitted on track entries.

        Two surfaces reference this schema and must move together: the V2 flowsheet track
        entry's `metadata_status`, and `AlbumMetadataResponse.metadataStatus` — the latter a
        local-first echo of the same column off the linked flowsheet row (wxyc-shared#318,
        WXYC/Backend-Service#1827), so a client can reconcile a proxy response against the
        feed row it came from. Add a value here, not in a copy of the list.

    AlbumMetadata:
