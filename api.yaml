  # ===================
  # Concerts Endpoints (Backend-Service#1603)
  # ===================

  /concerts:
    get:
      x-wxyc-service: backend-service
      summary: List upcoming concerts (On Tour feed)
      description: |
        Returns upcoming non-removed concerts, windowed on the venue-local
        calendar date `starts_on` (never on the nullable `starts_at` — range
        predicates on the instant would silently drop date-only events),
        ordered by `starts_on` ascending, paginated.

        `curated=true` narrows to concerts whose headliner resolved to a
        WXYC catalog artist. Requires anonymous session auth, matching the
        other iOS read surfaces.
      parameters:
        - name: curated
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            When true, return only concerts whose headliner resolved to a
            WXYC catalog artist (`headlining_artist_id` non-null).
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: >-
            Window start (inclusive) on `starts_on`. Defaults to today
            (venue-local calendar date).
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Window end (inclusive) on `starts_on`. Defaults to unbounded.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed, per PaginationParams).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size (per PaginationParams).
      responses:
        '200':
          description: Paginated list of upcoming concerts ordered by starts_on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcertsResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: >
            Forbidden — the session is banned or the bearer token carries no
            `sub` claim (auth middleware gate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /concerts/{id}:
    get:
      x-wxyc-service: backend-service
      summary: Get a single concert by id (public share/deep-link read)
      description: |
        Returns one concert by its serial `id`, regardless of date. Unlike
        `GET /concerts`, this endpoint is deliberately public and
        windowless — it exists to serve the `wxyc.org/shows/<id>` share
        page (a Cloudflare Worker with no sane path to minting anonymous
        sessions) and the iOS universal-link fallback, both of which may
        reference a show outside the list window, including one that
        already happened.

        Contract semantics (WXYC/wxyc-shared#236):
        - **No authentication.** `security: []` — anonymous-session auth
          is not required, matching the public flowsheet read.
        - **No date window.** Past concerts and concerts delisted at the
          source (tombstoned upstream via the internal `removed_at`
          column — never deleted, and not exposed on `Concert`) are
          served with whatever `status` they last carried; clients
          derive "this show has passed" from `starts_on`/`starts_at`.
        - **Publicly cacheable.** Responses carry no per-session data;
          servers should emit `Cache-Control: public` with an edge TTL of
          roughly five minutes.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The concert's serial `Concert.id`.
      responses:
        '200':
          description: The concert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '404':
          description: No concert with this id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ============================
  # Song Like Tallies
  # ============================

  /likes/tally:
    post:
      x-wxyc-service: backend-service
      summary: Add to the public song-like tallies
      description: |
        Applies a batch of `+1` / `-1` deltas to per-song like counters.

        **This endpoint stores no listener key of any kind.** There is no
        per-listener row, no snapshot, and no event log — only aggregate
        counters keyed by `song_key`. Nothing persisted here can be
        attributed back to a device, a session, or a person, by WXYC or by
        anyone who later obtains the data. That is a deliberate product
        constraint, not an implementation detail: WXYC wants to know which
        songs listeners like, and explicitly does not want to know who
        liked what, even pseudonymously.

        The consequences are accepted, not defects to be fixed later.
        Deltas are **not idempotent**: a retried request double-counts, and
        a dropped one is lost with no reconciliation path — reconciling
        would require remembering what each caller already sent, which is
        the very thing this design refuses to store. Counters therefore
        drift, and measure relative popularity rather than an exact
        headcount. A tally counts like *actions*, not distinct listeners;
        distinct-listener counts are not derivable from this data, by
        design. Clients MUST send deltas fire-and-forget and MUST NOT
        queue, persist, or retry them — a durable pending-delta queue is
        per-listener state by another name.

        Authenticated via the anonymous-session bearer (inherits the
        document-level `BearerAuth`) purely for rate limiting and abuse
        control. **The authenticated identity MUST NOT be persisted,
        logged alongside the deltas, or used to key anything this endpoint
        writes.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongLikeTallyRequest'
      responses:
        '200':
          description: Deltas applied. See `SongLikeTallyResponse`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongLikeTallyResponse'
        '400':
          description: >-
            Malformed payload (e.g. missing `song_key`, or a `delta` other
            than +1 / -1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ============================
  # Lookup Service
  # ============================

  /api/v1/lookup:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Look up library items and artwork for a parsed song request
      description: >
        Accepts a parsed song request (artist, song, album) and searches the
        WXYC library catalog, resolves album names via Discogs, fetches artwork,
        and returns matching results with metadata.


        Served by library-metadata-lookup, not Backend — see `x-wxyc-service`.
        LML mounts `lookup_router` with `prefix="/api/v1"` and
        `dependencies=[Depends(require_lml_key)]`, so this shares the bearer
        posture of its six `/api/v1/*` siblings.
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
      responses:
        '200':
          description: Lookup results with library matches and artwork
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/identity/resolve:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Mint or resolve a stable identity for a release
      description: >
        Resolves a `(kind, source, external_id)` triple to a stable
        `identity_id` on `entity.release_identity`. First call with a new
        triple mints the row and writes one reconciliation log entry;
        subsequent calls return the same `identity_id` with `minted:
        false` and write no log row. Idempotent and concurrency-safe —
        two simultaneous mints with the same input converge on one row
        via the per-source `UNIQUE` constraints on
        `entity.release_identity`.

        Validation runs before any DB write. Sentinel inputs — Discogs
        `external_id <= 0`, malformed or non-album Bandcamp URLs,
        unknown source — are rejected with 422 so no poisoned identity
        rows can land.

        v1 accepts only `kind: release`. The `kind: artist` symmetric
        extension is reserved for a follow-up; for the artist-name
        lookup case, `GET /identity/resolve?name=<artist>` remains the
        right endpoint.
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseIdentityResolveRequest'
      responses:
        '200':
          description: Identity resolved (minted or pre-existing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseIdentityResolveResponse'
        '401':
          description: Missing or invalid `LML_API_KEY` bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: >
            Validation error — sentinel input (e.g. Discogs id <= 0,
            malformed Bandcamp URL) or unknown source / kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: >
            Entity store unavailable — either `DATABASE_URL_DISCOGS` is
            unset or the `entity.release_identity` schema has not been
            applied to the discogs-cache PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/identity/bulk-resolve-libraries:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Bulk-resolve cross-cache identity for library rows
      description: >
        Per the cross-cache-identity architecture pivot
        (WXYC/Backend-Service#800, 2026-05-09), this is the HTTP-only
        seam between Backend and library-metadata-lookup (LML). LML is
        the sole composer of cross-cache identity. Backend POSTs a batch
        of library rows and receives one composed verdict per input —
        chosen external IDs, the method and confidence that produced it,
        and per-source provenance for audit. LML auto-detects V/A from
        the row and discriminates the response on `kind`. The §3.4.1.1
        composition rules (cross-source agreement boost, MIN-of-confidences,
        sub-floor demotion) execute inside LML's handler; Backend writes
        the response verbatim into `library_identity` and
        `library_identity_source`. `kind: unresolved` is a first-class
        outcome — Backend caches it (with TTL) so the same input is not
        re-asked.


        Per-track identity is opt-in: set `include_tracks: true` on the
        request to get `BulkResolveResult.tracks` on both
        `kind: single_artist` and `kind: compilation` results. The flag
        defaults to `false`, which keeps album-identity drains off the
        (measurably large) track payload — see the schema notes on
        `BulkResolveLibrariesRequest.include_tracks` and
        `BulkResolveResult.tracks`. Read whether the per-track matcher
        ran off `BulkResolveResult.tracks_attempted`, never off
        `tracks.length`: a row the matcher visited and resolved nothing
        for carries an empty array, indistinguishable from one it has
        not reached. `tracks_attempted: false` alongside a populated
        `tracks` is not a state producers may emit; a consumer that
        observes it anyway MUST read it as `true` rather than dropping
        the already-resolved entries or re-asking a row that already has
        an answer.


        During the rollout window before every producer implements this
        contract, `BulkResolveLibrariesResponse.tracks_contract_version`
        is the signal that separates "the producer understood
        `include_tracks` and this batch genuinely has nothing to report"
        from "the producer predates the flag" — both read identically on
        `tracks_attempted`/`tracks` alone (WXYC/wxyc-shared#303). The
        marker only speaks to a request that set `include_tracks: true`:
        it is equal to 1 only once the producer understands the flag AND
        emits `tracks_attempted` for both `kind: single_artist` and
        `kind: compilation` — the two producer arms ship independently
        (LML#1138, LML#1021), and setting the marker ahead of either one
        tells a consumer to trust `tracks_attempted` on rows where it is
        still meaningless. It is absent, and normally absent, on the
        ordinary request where `include_tracks` was false or omitted —
        that absence is the expected response from a fully-upgraded
        producer too, not evidence the producer predates the flag.


        LML does not set this field anywhere yet and serves this endpoint
        without `response_model_exclude_none`, so `tracks_contract_version`
        ships `null` — never an omitted key — on every response in
        production today (WXYC/wxyc-shared#310). A presence check
        therefore reads TRUE against the producer that implements none
        of this, the inverse of what the marker exists to signal. A
        consumer MUST test for the value `1` and
        must never test for key presence: absent, `null`, and a producer
        that predates this field must all read "not supported", and only
        the literal value `1` reads "supported".
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkResolveLibrariesRequest'
      responses:
        '200':
          description: Verdicts for every request input, in input order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResolveLibrariesResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid `LML_API_KEY` bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Batch exceeded the 1,000-input cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation error (per-input field validation failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/artists/search-aliases/bulk:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Bulk-fetch artist search aliases from all known sources.
      description: >
        Returns the union of alias variants LML can compose for each input
        artist name — Discogs name variations, aliases, and members from
        discogs-cache; future sources (MusicBrainz aliases, Wikidata labels,
        etc.) appended additively per artist-search-alias plan §Architecture.
        Source-of-truth for resolution is `entity.identity.library_name`
        (seeded from BS's `library.artist_name`), reached via the three-leg
        bulk fall-through (exact → LOWER → canonical). Cache-only on the
        Discogs leg — no Discogs API hits; names whose discogs_artist_id is
        unknown come back as `missing` (BS retries after the monthly cache
        rebuild + entity-resolution campaign warms `entity.identity`). The
        `sources_present` field on each result names the legs the composer
        actually ran for that artist; consumers scope their reconcile
        DELETE to that list so a leg that didn't run does not wipe its
        cached rows. Mirrors `bulk-resolve-libraries` for auth + 413
        semantics.
      operationId: artistSearchAliasesBulk
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistSearchAliasesBulkRequest'
      responses:
        '200':
          description: Per-input variants, plus names LML doesn't know.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistSearchAliasesBulkResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid `LML_API_KEY` bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Batch exceeded the 1,000-name cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation error (per-input field validation failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/artists/resolve/bulk:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Bulk-resolve bare artist names to Discogs artist identities.
      description: >
        Resolves bare artist names — typically touring artists absent from
        the WXYC library (consumer: WXYC/Backend-Service#1614 concerts
        pipeline) — to Discogs artist identities, minting `entity.identity`
        rows for verified matches. Verify-before-mint (LML#759): per name,
        (1) `entity.identity` read (true short-circuit), (2) discogs-cache
        candidate generation (corroboration only — the cache is a
        pair-wise-filtered sample of Discogs, so a cache hit is not
        evidence of global uniqueness), (3) a single-page live Discogs API
        artist search (per_page=100) filtered to results whose FIXED-POINT
        identity-match form equals the input's (single-pass normalization
        is a materially different algorithm: it would exclude
        multi-qualified family members like "Sault (2) (UK)" from the
        "sault" family). Exactly one exact-form API candidate — whose own
        title qualifier matches the input's — with no equality-leg cache
        conflict resolves and mints (`discogs_artist_id` only; keyed on
        the group's lexicographically-least sanitized spelling, or on the
        stored key of a Discogs-id-less row the identity read found — see
        `ArtistResolveBulkRequest.names`; the upsert never overwrites a
        populated column with NULL, and LML#766 tracks hardening the
        no-overwrite guarantee against concurrent writers).
        Qualifier-bearing inputs ("Popsicle (2)") resolve but never mint,
        and skip the cache-evidence tier (stripped-form evidence cannot
        distinguish family members). Two or more exact-form candidates,
        a winner-title qualifier mismatch, conflicting identity-store
        rows within one group, or an
        equality-leg cache conflict, return `ambiguous` and mint nothing —
        no guessing. The PG tiers run as a batched pre-pass for the whole
        request before the serial API leg. When a probe couldn't be
        answered (see `ArtistResolveUnresolvedReason`), that name returns
        the retryable `escalation_unavailable` instead of `not_found`;
        only an LML#755 breaker trip additionally short-circuits the
        REST of the batch's pending probes (a per-name 429/network
        failure does not — the batch continues). Identity-store
        resolutions and cache evidence are unaffected by a mid-batch
        trip, and shed positions need not be a contiguous suffix of
        `results`. The 25-name cap keeps a fully-escalating batch
        within the shared Discogs API budget (~25 live calls, ~30s at
        50/min); callers page. `dry_run: true` runs every tier identically
        but skips the write-back. Mirrors `bulk-resolve-libraries` /
        `search-aliases/bulk` for auth + 413 semantics.
      operationId: artistResolveBulk
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistResolveBulkRequest'
      responses:
        '200':
          description: One verdict per input name, in input order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResolveBulkResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing `Authorization` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: >
            Present but invalid or malformed `LML_API_KEY` bearer token
            (wrong token, non-Bearer scheme). Distinct from 401 so
            credential-rotation failures are distinguishable from a
            consumer that never attached auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Batch exceeded the 25-name cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: >
            Validation error — per-input field validation failed, or a
            name is semantically unresolvable (blank, contains U+0000 or
            unencodable code points, normalizes to an empty
            identity-match form, or its entire identity content is a
            bare parenthesized ASCII number like "(2)" or "(2)(3)").
            Garbage names are caller errors, never in-band verdicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: >
            The backing discogs-cache PostgreSQL is unavailable —
            `DATABASE_URL_DISCOGS` unset, connection failure, or a
            required probe (entity store or cache tables) failed. Never
            caused by Discogs API saturation, which sheds per-name as
            `escalation_unavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/artists/genres/bulk:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Bulk artist-level Discogs genre/style aggregation.
      description: >
        Aggregates per-artist Discogs *genres* (coarse, top 1-2) and *styles*
        (fine, full ranked list) from the discogs-cache `release_genre` /
        `release_style` rows, keyed on `discogs_artist_id` when supplied else
        a case-insensitive `artist_name` match. On a cache miss the Discogs
        API fallback discovers the artist's releases and fetches each through
        the cached write-back (persisting genre/style rows so the next call
        hits the cache), degrading a per-artist miss to `source: unavailable`
        — never a batch-level 503 — when the API can't be consulted. Server-
        to-server; consumed by Backend-Service's nightly concerts enrichment
        (WXYC/Backend-Service#1624) for the iOS On Tour genre filter
        (WXYC/wxyc-ios-64#474). WXYC's internal library genre taxonomy is
        deliberately never surfaced here. Mirrors `resolve/bulk` /
        `bulk-resolve-libraries` for auth + 413 semantics; the 25-artist cap
        keeps a fully-escalating batch within the shared Discogs API budget,
        and callers page.
      operationId: artistGenresBulk
      security:
        - LMLBearerAuth: []
      tags:
        - lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkArtistGenresRequest'
      responses:
        '200':
          description: Per-artist genre/style aggregations, in input order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkArtistGenresResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing `Authorization` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: >
            Present but invalid or malformed `LML_API_KEY` bearer token
            (wrong token, non-Bearer scheme). Distinct from 401 so
            credential-rotation failures are distinguishable from a
            consumer that never attached auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Batch exceeded the 25-artist cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation error — request body failed validation (e.g. an empty batch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: >
            The backing discogs-cache PostgreSQL is unavailable —
            `DATABASE_URL_DISCOGS` unset, connection failure, or a required
            probe failed. Never caused by Discogs API saturation, which sheds
            per-artist as `source: unavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/cache/refresh-for-identities:
    post:
      x-wxyc-service: library-metadata-lookup
      summary: Warm LML's cache for a batch of release identity_ids
      description: >
        Source-agnostic cache warmer (LML#525). For each `identity_id` in
        the request, resolves the per-source external IDs via
        `entity.release_identity` and fans out the per-source release-cache
        refresh. For each refreshed Discogs release, walks
        `release.artists[*].artist_id` (skipping `artist_id <= 0` — the LML#525
        sentinel guard) and refreshes the per-artist cache.

        Multiplexes onto LML's fallthrough seam (LML#503's `fetched_at`
        discriminator) — won't re-hit Discogs if the cache is already warm.
        "Refresh" means "ensure freshness," not "bypass cache." A future
        `force: true` flag could carry true-bypass semantics post-Discogs-
        reshuffle invalidation.

        Today only the Discogs release leg is wired. `discogs_master`,
        `musicbrainz_release`, `spotify_album`, `apple_music_album`, and
        `bandcamp` return `release_outcome = not_implemented`. See LML#525's
        out-of-scope list for the unblocking dependencies on each.
      security:
        - LMLBearerAuth: []
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCacheRefreshRequest'
      responses:
        '200':
          description: Per-identity verdicts in input order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCacheRefreshResponse'
        '400':
          description: Malformed body or batch above the 50-id cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid `LML_API_KEY` bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Empty `identity_ids` (Pydantic min_length=1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '499':
          description: Client closed connection before the batch finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Entity store or Discogs service not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

