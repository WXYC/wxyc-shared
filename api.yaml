          application/json:
            schema:
              type: object
              required:
                - dj_id
                - album_id
              properties:
                dj_id:
                  type: integer
                album_id:
                  type: integer
                track_title:
                  type: string
      responses:
        '200':
          description: Successfully removed from bin

  /djs/playlists:
    get:
      x-wxyc-service: backend-service
      summary: Get playlists for DJ
      responses:
        '200':
          description: List of DJ playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowPeek'

  /library:
    get:
      x-wxyc-service: backend-service
      summary: Search for album
      # routes enforce requirePermissions({ catalog: ['read'] }) (library.route.ts)
      security:
        - BearerAuth: []
      parameters:
        - name: artist_name
          in: query
          schema:
            type: string
        - name: album_title
          in: query
          schema:
            type: string
        - name: n
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of matching albums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumSearchResult'

    post:
      x-wxyc-service: backend-service
      summary: Add new album
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAlbumRequest'
      responses:
        '200':
          description: Successfully added album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'

  /library/query:
    get:
      x-wxyc-service: backend-service
      summary: Query the card catalog with a parsed query string and filters
      description: |
        Search the library by a query-builder-style expression (the same grammar
        as `/flowsheet/search`: `artist:foo AND album:"hello" NOT label:bar`,
        with exact-match via double quotes). Combines parsed conditions with
        optional catalog filters (`on_streaming`, `genre`, `format`) via `AND`.
        Returns a paginated envelope.
      # routes enforce requirePermissions({ catalog: ['read'] }) (library.route.ts)
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search query (supports AND, OR, NOT, exact phrases). Empty/omitted returns recent additions.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          description: |
            Sort field. `date` means the catalog-addition date — when the album was
            added to the WXYC library — not flowsheet play date.
          schema:
            type: string
            enum: [artist, album, plays, date]
            default: album
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: on_streaming
          in: query
          required: false
          schema:
            type: boolean
          description: |
            When omitted, all releases are returned regardless of streaming state.
            `on_streaming=true` returns only releases known to be on at least one
            streaming service (`AlbumSearchResult.on_streaming = true`); releases
            whose streaming state is unknown (`null`) are excluded.
            `on_streaming=false` returns the complement — releases known to be
            absent from streaming (`AlbumSearchResult.on_streaming = false`),
            again excluding unknowns.
        - name: genre
          in: query
          required: false
          schema:
            type: string
          description: Filter by genre name (matches `AlbumSearchResult.genre_name`).
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: Filter by format name (matches `AlbumSearchResult.format_name`).
      responses:
        '200':
          description: Paginated catalog search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryQueryResponse'

  /library/catalog:
    get:
      x-wxyc-service: backend-service
      summary: Bulk catalog export for offline cloning (gzipped NDJSON)
      description: |
        Stream the entire WXYC library catalog as one gzipped, newline-delimited
        JSON (NDJSON) body — one CatalogExportRow per line — so a client (the
        iOS Spotlight clone; BS#1468 / Epic F #1466) can mirror the catalog
        on-device in a single request instead of paging /library/query.

        Conditional GET: the response carries Last-Modified, set from the
        library_watermark (advanced by a DB statement trigger, so the discogs-etl
        daily sync moves it too). The client echoes it back via If-Modified-Since
        (or ?since=) and gets a cheap 304 until the catalog actually changes
        (~daily); otherwise a 200 with the full body. Same conditionalGet
        middleware as the flowsheet export (BS#902).

        CROSS-ENDPOINT CONSISTENCY: a producer that also reads GET
        /library/catalog/compilation-tracks (BS#1965 / discogs-etl#351) fetches
        the two exports as separate HTTP requests that share a library_watermark
        value but are not one transaction — they form a consistent snapshot only
        while the watermark stays stable across both fetches. If it advances
        between them, the producer can pair catalog@T with CTA@T+1 and observe a
        CTA legacy_release_id with no corresponding row in this body. Treat a
        Last-Modified change across the two GETs as "re-fetch both"; the pairing
        self-heals on the producer's next run regardless, so this is a
        transient-inconsistency rule, not a hard-error condition.

        Transport (not expressible in the element schema): the body is NDJSON —
        split on newlines and decode per line; it is NOT a JSON array. It is
        gzip-encoded (Content-Encoding: gzip; most HTTP clients, incl. URLSession,
        decompress transparently). See catalog-export.service.ts
        (serializeCatalogNdjson).
      security:
        - BearerAuth: []   # routes enforce requirePermissions({ catalog: ['read'] })
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
          description: >
            HTTP-date previously returned in Last-Modified. Yields 304 if the
            catalog has not changed since. Echo the server's string verbatim; do
            not round-trip it through a local date type.
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: Header-free alternative to If-Modified-Since (same semantics).
      responses:
        '200':
          description: Full catalog as gzipped NDJSON (one CatalogExportRow per line).
          headers:
            Last-Modified:
              schema:
                type: string
              description: Catalog watermark as an HTTP-date; echo back as If-Modified-Since.
            Content-Encoding:
              schema:
                type: string
              description: '"gzip" on the gzip-accepting path.'
          content:
            application/x-ndjson:
              # NOTE: the body is newline-delimited CatalogExportRow objects (one
              # per line), NOT a single object or a JSON array. OpenAPI can't
              # model NDJSON framing; this schema describes ONE line. See the
              # path description.
              schema:
                $ref: '#/components/schemas/CatalogExportRow'
        '304':
          description: >
            Not Modified — catalog unchanged since the client's
            If-Modified-Since / since watermark. No body.

  /library/catalog/compilation-tracks:
    get:
      x-wxyc-service: backend-service
      summary: Bulk compilation-track (CTA) export for the library.db producer (gzipped NDJSON)
      description: |
        Stream every compilation_track_artist (CTA) row as one gzipped,
        newline-delimited JSON (NDJSON) body — one CatalogCompilationTrackRow per
        line — so the Backend-sourced library.db producer (BS#1965 /
        discogs-etl#351) can build library.db's compilation_track_artist table
        over HTTP instead of a direct Postgres read. Sibling of GET
        /library/catalog: that endpoint feeds library.db's `library` table, this
        one feeds its `compilation_track_artist` table.

        Each row is keyed on legacy_release_id (the owning library row's
        surrogate key, which /library/catalog emits AS library.db's library.id),
        so the producer maps legacy_release_id ->
        compilation_track_artist.library_release_id. Rows are emitted ordered by
        legacy_release_id.

        ROW ELIGIBILITY — emit a CTA row only if its owning library row is
        eligible for GET /library/catalog. That export is not "every library
        row": it INNER JOINs artists, format, genres, and
        genre_artist_crossreference (on the artist_id + genre_id pair), so a row
        whose (artist, genre) pair has no genre_artist_crossreference entry — a
        shape the ETL preserves, per the schema comment on that table — is
        silently dropped. An unfiltered CTA export would then ship
        library_release_id values that join to nothing in library.db's `library`
        table, and LML's CTA UNION would surface a compilation track whose
        release row it cannot resolve. Apply the same predicate on both
        endpoints.

        CROSS-ENDPOINT CONSISTENCY: this endpoint and GET /library/catalog share
        a library_watermark value, but the producer (BS#1965 / discogs-etl#351)
        fetches them as two separate HTTP requests, not one transaction — a
        consistent snapshot only while the watermark stays stable across both
        fetches. If it advances between them, the producer can pair catalog@T
        with CTA@T+1 and observe a legacy_release_id here with no corresponding
        row in the catalog body — the same dangling-join failure ROW ELIGIBILITY
        above exists to prevent, arriving by a different route: that predicate
        guarantees the pairing within a snapshot, this rule is what keeps the
        producer looking at one. Treat a Last-Modified change across the two
        GETs as "re-fetch both"; the pairing self-heals on the producer's next
        run, so a dangling legacy_release_id is evidence to re-fetch, not a hard
        error.

        Conditional GET: same middleware and watermark as GET /library/catalog —
        Last-Modified is set from the library_watermark, echoed back via
        If-Modified-Since (or ?since=) for a cheap 304.

        FRESHNESS: this endpoint shares GET /library/catalog's conditional-GET
        middleware and library_watermark. The intuitive assumption — that a CTA
        write rides the library add it accompanies — is backwards: the real
        sequence is (1) POST /library bumps the watermark to T, (2) the
        per-watermark gzip cache builds for T, (3) POST
        /library/{id}/compilation-tracks lands rows after that, at T+delta. A
        CTA-specific trigger was therefore necessary, not merely nice to have:
        without one, step 3 would leave the cache already built at T unaware of
        its own rows, and this endpoint would 304 until an unrelated write on a
        covered table happened to bump the watermark — silent and unbounded, not
        a lag, and post-tubafrenzy-turndown (once the daily library sync that
        used to eventually supply that unrelated write goes away) a CTA-only
        cataloging session could have stayed invisible indefinitely. Migration
        0138 supplies that trigger:
        touch_library_watermark_from_compilation_track_artist (AFTER INSERT OR
        UPDATE OR DELETE OR TRUNCATE ... FOR EACH STATEMENT) on
        compilation_track_artist advances the watermark on step 3 itself, so the
        cache rebuilds and the producer's next fetch carries the new rows.

        IMPLEMENTATION NOTES (as-built, BS#1965):
          * Route registration order is load-bearing, permanently. This literal
            path is ambiguous with the templated GET
            /library/{id}/compilation-tracks (same method, same catalog:['read']
            permission), so it MUST stay registered before the /:id routes —
            next to the '/catalog' literal in library.route.ts, not next to the
            other compilation-tracks routes. This binds anyone editing
            library.route.ts going forward, not just the original
            implementation: move it after the /:id routes and Express matches
            /:id/compilation-tracks with id === 'catalog', Number('catalog') is
            NaN, and the producer gets a 4xx/5xx with no auth-layer signal to
            distinguish it from any other failure (both routes carry the
            identical permission). See the "REGISTRATION ORDER IS LOAD-BEARING"
            comment in library.route.ts.
          * Cache sizing (resolved). This endpoint holds a second full gzipped
            body resident per pod for the life of the watermark
            (createWatermarkCache<Buffer>), alongside the existing catalog
            export cache — so it was measured before shipping, against the
            2026-07-19 prod library.db snapshot's real artist/title strings at
            the prod CTA row count:

                                 rows      raw  gzipped resident
              catalog export     64,815  28.5 MB   2.6 MB   2.6 MB
              CTA export        144,778  13.1 MB   3.2 MB   3.2 MB

            Verdict: not material (~5.8 MB resident for both), so the sibling
            endpoint was kept rather than folding these rows into
            /library/catalog behind an opt-in ?include=compilation_tracks.
            Counterintuitively the CTA buffer is larger than the catalog one
            despite carrying 3 fields instead of 19 — 2.2x the rows outweighs
            the narrower shape. Revisit past roughly 1M CTA rows, or sooner if a
            future consumer needs a payload that can't be built streaming-free;
            ?include=compilation_tracks remains the documented fallback.

        Transport (not expressible in the element schema): the body is NDJSON —
        split on newlines and decode per line; it is NOT a JSON array. It is
        gzip-encoded (Content-Encoding: gzip). See catalog-export.service.ts
        (serializeCompilationTracksNdjson).
      security:
        - BearerAuth: []   # routes enforce requirePermissions({ catalog: ['read'] })
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
          description: >
            HTTP-date previously returned in Last-Modified. Yields 304 if the
            catalog has not changed since. Echo the server's string verbatim; do
            not round-trip it through a local date type.
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: Header-free alternative to If-Modified-Since (same semantics).
      responses:
        '200':
          description: All CTA rows as gzipped NDJSON (one CatalogCompilationTrackRow per line).
          headers:
            Last-Modified:
              schema:
                type: string
              description: Catalog watermark as an HTTP-date; echo back as If-Modified-Since.
            Content-Encoding:
              schema:
                type: string
              description: '"gzip" on the gzip-accepting path.'
          content:
            application/x-ndjson:
              # NOTE: the body is newline-delimited CatalogCompilationTrackRow
              # objects (one per line), NOT a single object or a JSON array.
              # OpenAPI can't model NDJSON framing; this schema describes ONE
              # line. See the path description.
              schema:
                $ref: '#/components/schemas/CatalogCompilationTrackRow'
        '304':
          description: >
            Not Modified — catalog unchanged since the client's
            If-Modified-Since / since watermark. No body.

