    # ============================
    # Shared Streaming Types
    # ============================

    StreamingLinks:
      type: object
      description: >
        Streaming service URLs for a release. Used across multiple schemas
        (DiscogsMatchResult, AlbumMetadata, etc.) to canonicalize the set of
        streaming fields.
      properties:
        spotify_url:
          type: string
          nullable: true
          description: Spotify album URL
        apple_music_url:
          type: string
          nullable: true
          description: Apple Music album URL
        youtube_music_url:
          type: string
          nullable: true
          description: YouTube Music search URL
        bandcamp_url:
          type: string
          nullable: true
          description: Bandcamp album URL
        soundcloud_url:
          type: string
          nullable: true
          description: SoundCloud search URL

    StreamingResolutionStatus:
      type: string
      enum:
        - verified
        - absent
        - unresolved
      description: >
        Per-service streaming resolution verdict for one release on a lookup
        result. `verified` — the service was consulted and a URL was found
        (accompanies a non-null sibling `*_url`). `absent` — the service was
        consulted and returned no match; the null `*_url` is terminal and must
        NOT be re-probed. `unresolved` — a probe was attempted but was
        inconclusive (timed out, the enrichment tail was shed, or the cache was
        a cold miss); the null `*_url` is transient and MAY resolve on a later
        retry. A service that was never consulted at all is represented by the
        ABSENCE of its key from `StreamingResolution` (never by `absent`), so a
        consumer never negative-caches a service that was simply never asked.
        Reuses the per-service verdict vocabulary of `/api/v1/streaming-check`
        (LML#376). See LML#1053 / BS#1819.

    StreamingResolution:
      type: object
      description: >
        Per-service streaming resolution status for one lookup result, keyed by
        streaming service (keys match the `*_url` prefixes on
        `DiscogsMatchResult`). A service's key is PRESENT only when that service
        was consulted during this lookup; an omitted service was never probed and
        must NOT be treated as `absent` (the never-consulted state — key omission
        is its sole encoding, so a consumer has one rule, not two).
        Additive and independent of the `*_url` fields: it annotates why a
        `*_url` is null (transient `unresolved` vs terminal `absent`) without
        changing the meaning of the url fields themselves. Mirrors the
        per-service shape of `StreamingCheckSources` (LML#376), except a
        consulted-but-absent service is the explicit `absent` verdict rather than
        a null, so these per-service fields are non-nullable. Covers the
        services with a genuine probe/absence distinction on the lookup path
        (`spotify`, `apple_music`, `bandcamp`); YouTube Music and SoundCloud are
        search-URL-only and carry no resolution verdict.
      properties:
        spotify:
          $ref: '#/components/schemas/StreamingResolutionStatus'
        apple_music:
          $ref: '#/components/schemas/StreamingResolutionStatus'
        bandcamp:
          $ref: '#/components/schemas/StreamingResolutionStatus'

    ReconciledIdentity:
      type: object
      description: >
        External identifiers for a real-world artist, suitable for joining
        records across services. All fields are bare platform IDs; URL
        construction is the consumer's responsibility (templates are stable
        for Spotify, Apple Music, and Bandcamp; YouTube Music and SoundCloud
        do not have stable per-ID URLs and are intentionally absent — those
        belong on `StreamingLinks`, which serves the playback/result layer).
      properties:
        discogs_artist_id:
          type: integer
          nullable: true
          description: Discogs artist ID
        musicbrainz_artist_id:
          type: string
          nullable: true
          description: MusicBrainz artist UUID
        wikidata_qid:
          type: string
          nullable: true
          description: Wikidata QID (e.g. "Q12345")
        spotify_artist_id:
          type: string
          nullable: true
          description: Spotify artist ID (the Spotify URI suffix)
        apple_music_artist_id:
          type: string
          nullable: true
          description: Apple Music artist ID
        bandcamp_id:
          type: string
          nullable: true
          description: Bandcamp slug (the subdomain in `<slug>.bandcamp.com`)

    # ============================
    # Lookup Service Types
    # ============================

    LookupRequest:
      type: object
      properties:
        artist:
          type: string
          description: Parsed artist name
        song:
          type: string
          description: Parsed song/track title
        album:
          type: string
          description: Parsed album name
        raw_message:
          type: string
          description: >
            Original request message (used for ambiguous format detection).
            Optional when structured fields (artist, album, song) are provided.
        include_identity:
          type: boolean
          default: false
          description: >
            Per cross-cache-identity plan §3.2.2 (E2-LML write contract).
            When true, the response is meant to carry an additional
            `identity` block (the §3.2.5 cascade's per-source resolution
            detail) with `api_version` set to 2 — see
            `LookupResponse.api_version` and `LookupResponse.identity`.
            Neither side of that is implemented yet: no
            `LookupResponse(...)` construction site in the producer ever
            sets `api_version` or `identity`, not even when this flag is
            true, so both fields ship `null` — never an omitted key — on
            every `/lookup` response in production today, regardless of
            what this flag is set to (WXYC/wxyc-shared#316). A consumer
            MUST test `api_version === 2` to detect support, never
            presence of either key: absent, `null`, and a producer that
            hasn't implemented this at all must all read "not supported".


            No current caller sets this to true. A source read of
            Backend-Service (re-verified for this fix at `67d6d7b`, the
            same SHA the original WXYC/wxyc-shared#309 read used —
            Backend-Service has not moved since) finds no
            `library-identity-writer.ts` file and no `include_identity`
            reference anywhere in its TypeScript; the only occurrence in
            that repo is prose in
            `plans/library-hook-canonicalization/architecture-pivot-2026-05-09.md`
            describing the planned E2-BS writer, which has not been
            built. request-o-matic constructs `LookupRequest` without
            setting this field, which serializes as the `false` default;
            dj-site and tubafrenzy do not call `/lookup` with this field
            at all.
        extended:
          type: boolean
          description: >
            When true, the top-1 result's `artwork` block is populated with
            additional fields LML already fetches during enrichment but
            normally discards: `discogs_artist_id`, `tracklist`, `genres`,
            `styles`, `label`, `full_release_date`, `artist_image_url`, and
            `profile_tokens` (cache-only deep parse of the artist's profile
            markup). Lets a caller obtain a full playcut metadata payload in
            a single `/lookup` call instead of following up with separate
            `/discogs/release/{id}` and `/discogs/artist/{id}` requests.
            Absent or false leaves the response shape unchanged.
        warm_cache:
          type: boolean
          description: >
            When true, LML schedules a fire-and-forget background task after
            the response is built that runs a *deep* async parse of the
            top-1 artist's bio. The task resolves all `[a…]`/`[r…]`/`[m…]`
            references against the Discogs API where the local cache misses,
            warming the PG cache so subsequent reads of the same artist
            render richer bio tokens. Intended for write-path callers (e.g.
            Backend-Service's flowsheet-linkage service committing a new DJ
            entry); read-path callers should leave this absent/false to
            avoid doubling the Discogs-API load per request.

    LibraryCatalogItem:
      type: object
      description: >
        A single item from the WXYC library catalog. Mirrors request-parser's
        LibraryItem with computed properties serialized as regular fields.

        Library identity is the `id` field alone — there is deliberately no
        `album_id`. An `id` of `0` is the "no catalog row" marker: the release
        is not shelved in the WXYC library, but the result may still carry a
        real Discogs identity in its `LookupResultItem.artwork`. See
        `LookupResultItem` for that row-less shape and its discriminator.
      required:
        - id
        - call_number
        - library_url
      properties:
        id:
          type: integer
          description: >
            Unique identifier in the library database. `0` means there is no
            WXYC catalog row for this result (a row-less / "(external)" item,
            e.g. a Discogs-only library miss); any positive value is a real
            shelved release.
        title:
          type: string
          description: Album/release title
        artist:
          type: string
          description: Artist name
        call_letters:
          type: string
          description: Library call letter code
        artist_call_number:
          type: integer
          description: Numeric part of artist classification
        release_call_number:
          type: integer
          description: Numeric part of release classification
        genre:
          type: string
          description: Genre classification
        format:
          type: string
          description: Physical format (vinyl, CD, etc.)
        label:
          type: string
          nullable: true
          description: Record label name from the library catalog
        call_number:
          type: string
          description: >
            Full call number for shelf lookup, e.g. "Rock CD ABC 123/45".
            Computed from genre, format, call_letters, artist_call_number,
            and release_call_number.
        library_url:
          type: string
          description: >
            Per-release dj.wxyc.org permalink for this release. Points at the dj-site
            legacy front door `/dashboard/album/legacy/{id}`, which resolves the legacy
            library `id` to the canonical release route server-side and 308-redirects.
            Empty string for a row-less result (`id == 0`).
        on_streaming:
          type: boolean
          description: True if this release is available on at least one streaming service. False means only available in the WXYC physical library. Null if unknown.

    DiscogsMatchResult:
      type: object
      description: >
        A processed Discogs search result with artwork and enriched metadata.
        Distinct from the raw DiscogsSearchResult which mirrors the Discogs
        API response directly. Streaming URL fields match the StreamingLinks
        schema and will be migrated to use $ref in a future version.

        Two distinct states share this shape, told apart by `release_id`:
        a real Discogs identity has `release_id > 0` with a non-empty
        `release_url`; the streaming-only sentinel (BS#1185) has
        `release_id == 0` and `release_url == ""`, signalling "I carry only
        streaming URLs, there is no Discogs release to link or to fetch album
        metadata from." A consumer keying "has Discogs identity" on
        `release_id != 0` therefore handles both states correctly, including
        the row-less identity described on `LookupResultItem`.
      required:
        - release_id
        - release_url
      properties:
        album:
          type: string
          description: Release title
        artist:
          type: string
          description: Release artist
        release_id:
          type: integer
          description: >
            Discogs release ID. `> 0` is a real release identity; `0` is the
            streaming-only sentinel (paired with `release_url == ""`, BS#1185)
            and is not a linkable Discogs release.
        master_id:
          type: integer
          nullable: true
          description: >
            Discogs master ID for the release, when the release belongs to a
            master. `null` when Discogs has no master for this release
            (one-offs, self-released) or for the streaming-only sentinel
            (`release_id == 0`). Lets a caller collapse multiple
            pressings/formats of one logical album into a single record keyed
            on the master. Populated from the resolved release's
            `master_id` field on `/lookup` (single and bulk).
        release_url:
          type: string
          description: >
            URL to the release on Discogs. Non-empty for a real release
            identity; the empty string accompanies the `release_id == 0`
            streaming-only sentinel.
        artwork_url:
          type: string
          description: Artwork image URL
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Match confidence score
        release_year:
          type: integer
          nullable: true
          description: Release year from Discogs
        artist_bio:
          type: string
          nullable: true
          description: Artist biography from Discogs profile
        wikipedia_url:
          type: string
          nullable: true
          description: Wikipedia URL for the artist
        spotify_url:
          type: string
          nullable: true
          description: Spotify album URL
        apple_music_url:
          type: string
          nullable: true
          description: Apple Music album URL
        youtube_music_url:
          type: string
          nullable: true
          description: YouTube Music search URL
        bandcamp_url:
          type: string
          nullable: true
          description: Bandcamp album URL
        soundcloud_url:
          type: string
          nullable: true
          description: SoundCloud search URL
        streaming_status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StreamingResolution'
          description: >
            Per-service streaming resolution status (verified / absent /
            unresolved) for this result, disambiguating WHY a sibling `*_url`
            field is null. A service marked `unresolved` timed out, had its
            enrichment tail shed, or was a cold cache miss — its null url is
            transient and MAY resolve on a later retry; `absent` means the
            service was consulted and genuinely has no match — its null url is
            terminal and must NOT be re-probed (re-asking `absent` is the
            per-play LML-call amplifier BS#1747 killed). A service whose key is
            OMITTED from this object was never consulted (e.g. Bandcamp on the
            `/lookup/bulk` path, or the library.db override skipped for a
            non-library row) and must not be treated as `absent`. Additive and
            optional: null/omitted on responses from an LML predating the
            producer rollout, or on paths that resolve no per-service status.
            Does not change the meaning of the `*_url` fields — it only
            annotates them. Emitted identically on `/lookup` and `/lookup/bulk`
            (the LML#681 parity rule). Mirrors the per-service verdict
            vocabulary of `/api/v1/streaming-check` (LML#376). See LML#1053 /
            BS#1819.
        discogs_artist_id:
          type: integer
          nullable: true
          description: >
            Discogs artist ID for this release. Populated only when the
            originating `LookupRequest.extended` is true. Lets a caller key
            an artist-metadata cache without a follow-up release fetch.
        tracklist:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DiscogsTrackItem'
          description: >
            Release tracklist with per-track artist credits where available.
            Populated only when `extended` is true.
        genres:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Discogs genre tags (e.g. "Rock", "Electronic"). Populated only
            when `extended` is true.
        styles:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Discogs style tags (finer-grained than genres; e.g. "Indie Rock",
            "Ambient"). Populated only when `extended` is true.
        label:
          type: string
          nullable: true
          description: >
            Primary record-label name from the Discogs release. Distinct
            from `LibraryCatalogItem.label` (which comes from the WXYC
            catalog's rotation-release join). Populated only when `extended`
            is true.
        full_release_date:
          type: string
          nullable: true
          description: >
            Release date as an ISO string (e.g. "1997-09-22"). May be
            year-only ("1997") or year-month ("1997-09") if Discogs lacks
            the full date. Populated only when `extended` is true.
        artist_image_url:
          type: string
          nullable: true
          description: >
            Primary artist image URL from Discogs (the artist's profile
            photo, not the release artwork). Populated only when `extended`
            is true.
        profile_tokens:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DiscogsResolvedToken'
          description: >
            Pre-parsed structured tokens from the artist's `profile` markup,
            using a cache-only resolver — references to entities not in the
            local PG cache fall through as plain-text tokens (no inline
            Discogs API calls on the read path). Populated only when
            `extended` is true. Field name matches `DiscogsArtistDetails.profile_tokens`
            so callers can share rendering code across the two payloads.
            Pair with `LookupRequest.warm_cache=true` on write-path calls
            to progressively populate the cache so subsequent reads render
            richer.
        writer_credits:
          $ref: '#/components/schemas/DiscogsWriterCredits'

    LookupResultItem:
      type: object
      description: >
        A single lookup result pairing a library item with optional artwork and
        reconciled identity.

        `artwork` is optional and independent of `library_item`. This makes the
        *row-less* shape valid and first-class: `library_item.id == 0` (no WXYC
        catalog row) paired with a present `artwork` carrying `release_id > 0`
        and a non-empty `release_url` is a "Discogs identity, no catalog row"
        result — the album isn't shelved in the library, but Discogs confidently
        identifies the release, so the link, artwork, and downstream streaming
        buttons still render. LML emits this shape both from a library-miss
        Discogs search and from a non-library track carry-through (a
        confidently-resolved release for a track whose album isn't shelved).

        This is distinct from the `artwork.release_id == 0` / `release_url == ""`
        streaming-only sentinel (BS#1185), which carries streaming URLs but no
        linkable Discogs release. The discriminator is
        `artwork.release_id > 0 && library_item.id == 0`: unambiguous against the
        sentinel and backward-compatible with any consumer keying "has Discogs
        identity" on `release_id != 0`.
      required:
        - library_item
      properties:
        library_item:
          $ref: '#/components/schemas/LibraryCatalogItem'
        artwork:
          $ref: '#/components/schemas/DiscogsMatchResult'
        reconciled_identity:
          $ref: '#/components/schemas/ReconciledIdentity'
        matched_via:
          type: array
          items:
            $ref: '#/components/schemas/TrackMatchHint'
          description: >
            Populated when a track-title match drove this release into the results.
            Two producers: LML's SONG_AS_TRACK strategy (per catalog-track-search
            plan §5.1) for the primary match, and the comprehensive multi-location
            union (LML#1018/#1019/#1022) for every other WXYC shelf location
            carrying the same track (V/A compilations, soundtracks) — those rows
            are folded directly into `results` alongside the primary, tagged with
            `source: discogs_release` since the recall index is
            Discogs-release-derived. Empty or absent when the release matched via
            artist/album strategies. Backward-compatible — existing consumers
            ignore the field.
        matched_via_alias:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMatchHint'
          description: >
            Sibling to `matched_via`. Reserved for the day LML composes
            artist-alias hits itself; not produced in v1 of the
            artist-search-alias plan (BS-local cache only). Optional and
            backward-compatible.

    CacheStats:
      type: object
      description: >
        Cache hit/miss statistics for a single lookup operation. Populated by
        LML's `core/telemetry.py:get_cache_stats()` and forwarded onto Sentry
        trace data by both the LML transaction (LML#213) and the BS-side
        client span wrapping `lookupMetadata` (BS#646).
      required:
        - memory_hits
        - pg_hits
        - pg_misses
        - api_calls
        - pg_time_ms
        - api_time_ms
      properties:
        memory_hits:
          type: integer
          minimum: 0
          description: Hits in LML's per-process in-memory TTL cache
        pg_hits:
          type: integer
          minimum: 0
          description: Hits in the discogs-cache PostgreSQL cache
        pg_misses:
          type: integer
          minimum: 0
          description: Misses in the discogs-cache PostgreSQL cache (forced an API call or fallback)
        api_calls:
          type: integer
          minimum: 0
          description: Number of Discogs API calls made during the lookup
        pg_time_ms:
          type: number
          minimum: 0
          description: Total milliseconds spent in PostgreSQL cache lookups
        api_time_ms:
          type: number
          minimum: 0
          description: Total milliseconds spent in Discogs API calls

    LookupResponse:
      type: object
      description: >
        Response from the lookup service containing library search results
        and metadata. When the request sets `include_identity: true` and
        the producer understands the flag, the response is meant to
        additionally carry `api_version: 2` and the `identity` block (per
        cross-cache-identity plan §3.2.2). Neither side is implemented in
        the producer yet, so in production today both fields ship `null`
        — never an omitted key — on every response, regardless of what
        the request set `include_identity` to (WXYC/wxyc-shared#316). A
        consumer MUST test `api_version === 2`, never key presence:
        absent, `null`, and a producer that hasn't implemented this at
        all must all read "not supported", and only the literal value `2`
        reads "supported". See `api_version` below for the full rule, and
        `LookupIdentityBlock` for `identity`'s.
      properties:
        api_version:
          type: integer
          enum:
            - 2
          nullable: true
          description: >
            Present and equal to 2 only when the request set
            `include_identity: true` and the producer understands the
            flag. No `LookupResponse(...)` construction site in the
            producer sets this field anywhere yet — not even when the
            request sets `include_identity: true` — and the endpoint is
            served through FastAPI's `response_model` without
            `response_model_exclude_none`, so it ships `null` — never an
            omitted key — on every `/lookup` response in production today
            (WXYC/wxyc-shared#316); `nullable: true` documents that wire
            instead of describing one nobody emits.


            Because of that, a consumer MUST test for the value `2` and
            must never test for key presence — `!== undefined` against
            the generated TypeScript reads TRUE for a producer that
            implements none of this, the inverse of what the marker
            exists to signal. Absent, `null`, and a producer that hasn't
            implemented `include_identity` at all must all read "not
            supported", and only the literal value `2` reads "supported"
            — which keeps the check immune to whether any given producer
            omits or nulls its unset optionals.
        results:
          type: array
          items:
            $ref: '#/components/schemas/LookupResultItem'
          default: []
        search_type:
          type: string
          description: >
            The search strategy that produced results: direct, fallback,
            alternative, compilation, song_as_artist, or none
          default: none
          enum:
            - direct
            - fallback
            - alternative
            - compilation
            - song_as_artist
            - none
        song_not_found:
          type: boolean
          default: false
          description: True if search fell back to artist-only (track not confirmed on results)
        found_on_compilation:
          type: boolean
          default: false
          description: True if the track was found on a compilation album
        context_message:
          type: string
          description: Human-readable context string for display
        corrected_artist:
          type: string
          description: Fuzzy-corrected artist name if different from the original
        cache_stats:
          $ref: '#/components/schemas/CacheStats'
        identity:
          $ref: '#/components/schemas/LookupIdentityBlock'
        timeout:
          type: boolean
          default: false
          description: >
            True when LML's server-side hard cap fired and the search pipeline
            was abandoned mid-execution (LML#370). `results` may be partial or
            empty in that case. Callers can use this to distinguish "no match"
            (empty `results`, `timeout: false`) from "ran out of time"
            (`results` may be empty, `timeout: true`). The hard cap is an
            internal LML safety floor independent of the caller's
            `X-Caller-Budget-Ms` header; see LML#338 / LML#340 / LML#370 for
            the cascade-budget design. Backend also forwards two sibling
            informal headers on the same `/lookup` and `/lookup/bulk`
            requests, both prose-referenced here rather than formal
            parameters (matching `X-Caller-Budget-Ms`'s own precedent):
            `X-Caller-Class` (the resolved BS→LML traffic class, an integer
            1-5 per Backend-Service's per-caller policy, BS#1826) and
            `X-Caller-Reason` (the `caller` label string itself, e.g.
            `proxy-library-search` or `catalog-popularity-freetext-resolve`).
            Both are sent only when Backend has a registered caller for the
            request and are otherwise omitted; sending them is inert until
            LML reads them (LML#928 for `X-Caller-Class`-driven lane
            routing, LML#931 for `X-Caller-Reason` caller telemetry) — see
            BS#1843.
        degraded:
          type: boolean
          default: false
          description: >
            True when LML returned partial or cache-only data because it
            intentionally shed the enrichment tail — under a caller deadline,
            admission-control pressure, or an unavailable upstream (LML#930).
            Distinguishes a degraded/cache-only result from a full success
            (`degraded: false`) and from a genuine no-match (empty `results`,
            `degraded: false`, `timeout: false`). Distinct from `timeout`,
            which signals the internal hard cap fired and the pipeline was
            abandoned mid-execution; `degraded` is a deliberate shed-the-tail
            outcome where the returned data is trustworthy but incomplete.
            Default false, so existing consumers see a byte-identical response.
        degraded_reason:
          type: string
          enum:
            - deadline_exceeded
            - cache_only
            - upstream_unavailable
          description: >
            Why the response was degraded. Present only when `degraded: true`;
            omitted otherwise. Non-exhaustive — LML may add reasons in a later
            minor version. The Swift and Kotlin codegen decode an unknown value
            into an `unknownDefault` case and TypeScript consumers see a widened
            string-literal union, but the Python (datamodel-codegen → pydantic)
            consumers use strict enums and must regenerate against the new
            `@wxyc/shared` minor before LML emits a newly added reason.
            `deadline_exceeded` — the caller's budget or
            LML's spine deadline elapsed and the enrichment tail was skipped;
            `cache_only` — LML served cached data without refreshing from
            upstream; `upstream_unavailable` — an upstream (Discogs, streaming
            providers) was rate limited or down and its contribution was
            omitted. Set by LML#930's caller-deadline / admission path; read by
            LML#931 (`degraded-mode-result` telemetry) and wxyc-canary#82.

    # ====================================
    # Identity Block (§3.2.2 / §3.2.5 cascade)
    # ====================================
    #
    # Meant to be returned only when LookupRequest.include_identity is true
    # and the producer understands the flag, carrying the per-source
    # resolution detail from the §3.2.5 cascade so a future Backend writer
    # can populate `library_identity_source` per-row without a second
    # round-trip. No such writer exists yet: a source read of
    # Backend-Service at `67d6d7b` finds no `library-identity-writer.ts`
    # file and no `include_identity` reference anywhere in its TypeScript —
    # the planned E2-BS writer described in
    # plans/library-hook-canonicalization/architecture-pivot-2026-05-09.md
    # has not been built (WXYC/wxyc-shared#316, WXYC/wxyc-shared#309). See
    # `LookupIdentityBlock` below for what actually ships today.

    IdentitySource:
      type: string
      description: >
        The metadata source whose external ID is being recorded. The set of
        sources matches the columns on `library_identity_source` per plan
        §3.2.0. Add new sources by appending to this enum and to the
        `library_identity_source` schema in lockstep.
      enum:
        - discogs
        - musicbrainz
        - wikidata
        - spotify
        - apple_music
        - bandcamp

    IdentityMethod:
      type: string
      description: >
        The matcher method that produced this resolution, drawn from plan
        §3.4.1's locked confidence-method enum. The order in this list also
        reflects descending confidence ceilings (manual = 1.00,
        cross_source_agreement up to 1.00, exact_match = 1.00,
        name_variation 0.90-0.99, member_group 0.80-0.89, alias_match
        0.75-0.84, trigram 0.70+, llm 0.60-0.79). Backend's writer rejects
        rows where confidence falls outside the method's locked range
        (§3.2.2 sanity check).
      enum:
        - manual
        - cross_source_agreement
        - exact_match
        - name_variation
        - member_group
        - alias_match
        - trigram
        - llm

    IdentitySkipReason:
      type: string
      description: >
        Why a source's leg of the cascade did not run. Set on
        `IdentityResolution.reason` when `attempted: false`. Order is
        irrelevant; values are mutually exclusive per leg.
      enum:
        - error
        - manual_override_protected
        - disabled
        - prerequisite_failed

    IdentityResolution:
      type: object
      description: >
        One source's leg of the §3.2.5 cascade for a single library row.
        Either resolved (`attempted: true` and `external_id` populated when
        a match was found, NULL when the source ran but found no match) or
        skipped (`attempted: false` with `reason` populated and the rest
        nullable). The full `LookupIdentityBlock.resolved` array is
        complete (one entry per known source), not sparse — consumers can
        tell apart "leg ran, no match" from "leg didn't run" without
        guessing.
      required:
        - source
        - attempted
      properties:
        source:
          $ref: '#/components/schemas/IdentitySource'
        attempted:
          type: boolean
          description: >
            True when this source's leg actually ran (whether or not it
            found a match). False when it was skipped — `reason` is
            populated, `external_id`/`method`/`confidence` are NULL.
        external_id:
          type: string
          nullable: true
          description: >
            The external identifier this leg resolved to (Discogs release
            ID, MusicBrainz MBID, Wikidata QID, Spotify URI suffix, Apple
            Music ID, Bandcamp slug). Stored as a string regardless of the
            source's native type so the API surface is uniform; Backend
            casts to the per-source column type when writing
            `library_identity_source`. NULL when `attempted: false`, or
            when the leg ran but found no match.
        method:
          allOf:
            - $ref: '#/components/schemas/IdentityMethod'
          nullable: true
          description: >
            The matcher method that produced the resolution. NULL when
            `attempted: false` or when the leg ran but found no match.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Confidence in [0, 1]. Must fall within the method's locked
            range from plan §3.4.1 — Backend's writer rejects rows where
            confidence is out of range. NULL when `attempted: false` or
            when the leg ran but found no match.
        reason:
          allOf:
            - $ref: '#/components/schemas/IdentitySkipReason'
          nullable: true
          description: >
            Required when `attempted: false`; absent or NULL otherwise.

    LookupIdentityBlock:
      type: object
      nullable: true
      description: >
        Per-source identity resolution detail for a single library row.
        Meant to be returned on `LookupResponse.identity` when the request
        set `include_identity: true` and the producer understands the
        flag. Per §3.2.2, the `resolved` array is complete (one entry per
        source LML knows about, including the sources whose legs didn't
        run with `attempted: false`) — consumers get a deterministic
        shape regardless of which legs were available, whenever this
        block is actually populated.


        No `LookupResponse(...)` construction site in the producer sets
        `LookupResponse.identity` anywhere yet — not even when the
        request sets `include_identity: true` — and the endpoint is
        served through FastAPI's `response_model` without
        `response_model_exclude_none`, so `identity` ships `null` — never
        an omitted key — on every `/lookup` response in production today
        (WXYC/wxyc-shared#316). `nullable: true` documents that wire
        instead of describing a shape nobody emits. A consumer
        distinguishes "identity resolution ran and found nothing" from
        "the producer hasn't implemented `include_identity`" the same way
        as `LookupResponse.api_version` — by reading `api_version`, not
        by probing `identity` for presence or nullness. `identity` alone
        cannot make that distinction: it is `null` in both cases.


        `nullable: true` lives here, on the schema, rather than as an
        `allOf`-wrapped sibling on `LookupResponse.identity` — the two
        are equivalent where oasdiff can see through the composition, but
        an `allOf`-wrapped nullable ref to an object schema with its own
        `required` list cascaded into a spurious
        `response-required-property-removed` finding that the direct
        schema-level `nullable: true` does not, and marking a bare `$ref`
        nullable by writing the keyword next to it does nothing at all
        (OpenAPI 3.0 ignores sibling keys next to a `$ref`). This is safe
        only because `LookupIdentityBlock` is referenced exactly once in
        this spec, from `LookupResponse.identity` — a second reference
        would inherit this nullability unconditionally, so re-examine
        whether `null` is correct there too before adding one.
      required:
        - resolved
      properties:
        resolved:
          type: array
          description: >
            One entry per known source. Order is stable (matches the
            `IdentitySource` enum order). Always populated even when no
            source resolved — the array carries `attempted: false` entries
            in that case.
          items:
            $ref: '#/components/schemas/IdentityResolution'

    # ====================================================================
    # Bulk-Resolve-Libraries (cross-cache-identity pivot)
    # ====================================================================
    #
    # The HTTP-only seam between Backend and LML after the 2026-05-09
    # architecture pivot (WXYC/Backend-Service#800): Backend stops
    # composing cross-cache identity from multiple PG schemas; LML becomes
    # the sole composer. Backend POSTs a batch of library rows and receives
    # a verdict per input — composed external IDs, the chosen method,
    # confidence, and per-source provenance.
    #
    # Request shape is uniform: `{library_id, artist_name, album_title}`,
    # plus the batch-level `include_tracks` flag. LML auto-detects V/A from
    # the row (per `library.code_volume_letters LIKE 'Z%'` or
    # `EXISTS compilation_track_artist`) and discriminates the response on
    # `kind`:
    #
    #     - `kind: "single_artist"` — resolved single-artist library row;
    #                                  `main` carries the composed identity.
    #                                  `tracks` carries per-track identity
    #                                  when the request asked for it, paired
    #                                  with `tracks_attempted`.
    #     - `kind: "compilation"`   — V/A row; `main` is null (no album-level
    #                                  artist anchor). `tracks` carries
    #                                  per-track identity when the request
    #                                  asked for it, paired with
    #                                  `tracks_attempted`.
    #     - `kind: "unresolved"`    — LML attempted resolution and found
    #                                  nothing actionable; first-class
    #                                  outcome so Backend can cache and
    #                                  not re-ask. `main` is null, and
    #                                  `tracks`/`tracks_attempted` are the
    #                                  absent-or-NULL state (LML spells both
    #                                  `null`). Audit detail lives in
    #                                  `provenance` (empty means LML tried
    #                                  and nothing resolved).
    #
    # ---- `tracks` is opt-in, and gated on BOTH resolved kinds (#297) ----
    #
    # Per-track identity is not free. WXYC/Backend-Service#1989 measured a
    # mean of 56 per-track credits per V/A release, p99 483, max 2,364 — a
    # 1,000-id page of V/A rows is ~11 MB of track identity that an
    # album-identity drain would parse and discard, on every future pass.
    # So the payload is gated behind `BulkResolveLibrariesRequest.include_tracks`
    # (default `false`), and the gate covers the V/A arm too: exempting the
    # arm with the worst payload pathology would be backwards.
    #
    # Omitting the flag reproduces the pre-`1.30.0` wire exactly, minus the
    # empty array the V/A arm used to ship — which the sole consumer's
    # compilation branch counts and skips without reading.
    #
    # Four states, read off the PAIR (`tracks_attempted`, `tracks`) — the
    # two-state ("present-array or absent") rule this contract carried
    # through `1.29.0` is retired, and so is the three-state rule that
    # tried to carry the meaning on `tracks` alone:
    #
    #     (absent, absent)   — the caller did not ask (`include_tracks`
    #                          false or omitted), or `kind: "unresolved"`.
    #                          LML spells this `null` on the wire for both
    #                          fields (it builds the result with `None` and
    #                          does not set `response_model_exclude_none`),
    #                          so the schema marks them nullable and
    #                          consumers accept both spellings.
    #     (false, [])        — the caller asked, and LML's per-track matcher
    #                          has not visited this row yet.
    #     (true, [])         — the matcher ran and resolved no tracks at all.
    #                          Ordinary, not exceptional: a `single_artist`
    #                          release LML holds no tracklist for lands here.
    #     (true, [entries])  — the matcher ran and produced entries. Ones
    #                          whose `resolved_artist_name` is NULL are
    #                          tracks it tried and failed on, the same "the
    #                          leg ran" convention as
    #                          `BulkResolveProvenanceEntry.external_id`.
    #
    # `false` alongside a populated `tracks` is not a fifth state;
    # producers must not emit it. A consumer that observes it anyway
    # MUST read it as `true` — the populated array is stronger evidence
    # of what happened than the flag that disagrees with it, and reading
    # the row as unattempted would either drop already-resolved tracks
    # or re-ask a row that already has an answer (WXYC/wxyc-shared#303).
    #
    # The resolved signal is `tracks_attempted`, not the array's length.
    # Those middle two states are byte-identical in `tracks`, so a consumer
    # reading emptiness as "not visited" re-asks every trackless row on
    # every pass, forever — the pathology `kind: "unresolved"` was made a
    # first-class outcome to prevent, reintroduced one grain down
    # (WXYC/Backend-Service#1991 / LML#1021).
    #
    # For the rollout window before every producer implements this contract,
    # the PAIR has a second ambiguity the four states above don't cover: a
    # producer that predates `include_tracks` entirely spells the
    # (absent, absent) state identically to a producer that understands the
    # flag and genuinely has nothing to report — both are `null` either way.
    # `BulkResolveLibrariesResponse.tracks_contract_version` is the
    # response-level marker that separates them, and it only speaks to a
    # request that set `include_tracks: true`: equal to 1 only once the
    # producer understands the flag AND emits `tracks_attempted` for both
    # `kind: single_artist` and `kind: compilation` — the two producer arms
    # ship independently (LML#1138, LML#1021), and setting the marker ahead
    # of either one tells a consumer to trust `tracks_attempted` on rows
    # where it is still meaningless. Absent or NULL otherwise — covering
    # the predates-the-flag case, the one-arm-only case, AND the ordinary,
    # expected response from a fully-upgraded producer to a request where
    # `include_tracks` was false or omitted.
    #
    # LML serves this endpoint without `response_model_exclude_none` and
    # sets this field nowhere yet, so `tracks_contract_version` ships
    # `null` — never an omitted key — on every production response today
    # (WXYC/wxyc-shared#310); `nullable: true` documents that wire instead
    # of describing one nobody emits, the same treatment as `tracks` above.
    # That also means a presence probe reads TRUE against the producer
    # that implements none of this — the inverse of what the marker exists
    # to signal. A consumer MUST test for the value `1` and
    # must never test for key presence: absent, `null`, and a producer
    # that predates this field must all read "not supported", and only
    # the literal value `1` reads "supported" — which keeps the check
    # immune to whether any given producer omits or nulls its unset
    # optionals. See that field, and WXYC/wxyc-shared#303 / #310 for the
    # two rollout-window defects this closes.

    BulkResolveLibrariesRequest:
      type: object
      description: >
        Bulk identity-resolution request. Order is preserved in the
        response. Up to 1,000 inputs per call (see endpoint cap).
      required:
        - inputs
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BulkResolveInput'
          description: >
            Inputs to resolve. Order preserved in `BulkResolveLibrariesResponse.results`.
        include_tracks:
          type: boolean
          description: >
            Opt in to per-track identity, for every input in the batch
            (the flag is batch-level, not per-input). Omitting the field
            means `false`; it carries no schema-level `default` on
            purpose, because `openapi-typescript` emits a
            default-bearing property as non-optional even when it is
            absent from `required`, which would force every TypeScript
            caller to pass the one field whose whole contract is that
            you need not. When `false` or
            omitted — the default, and what an un-upgraded caller sends —
            `BulkResolveResult.tracks` is absent from every result, so an
            album-identity drain pays nothing for track composition it
            would discard. When `true`, LML composes per-track identity
            for both `kind: single_artist` and `kind: compilation`
            results and sets `tracks_attempted` on each of them;
            `kind: unresolved` never carries either field. See
            `BulkResolveResult.tracks_attempted` for the four states the
            pair distinguishes, and why the array's length is not one of
            them.


            The flag is batch-level by design, and the payload it admits
            is not bounded by the schema — `inputs` still caps at 1,000
            either way. A caller that can classify its own rows should
            partition its drains rather than send a mixed page: Backend
            holds both signals LML auto-detects on
            (`library.code_volume_letters LIKE 'Z%'`, `EXISTS
            compilation_track_artist`), so WXYC/Backend-Service#1991 runs
            a small-paged V/A drain separately from a full-width non-V/A
            one. A per-input flag was considered and rejected as
            mechanism for a problem the one consumer can solve locally.
      example:
        include_tracks: true
        inputs:
          - library_id: 1234
            artist_name: "Juana Molina"
            album_title: "DOGA"
          - library_id: 5678
            artist_name: "Various Artists"
            album_title: "Edits"

    BulkResolveInput:
      type: object
      description: >
        One library row to resolve. Uniform shape — LML auto-detects V/A
        from the row and discriminates the response on `kind`. The
        denormalized hint fields (`artist_name`, `album_title`) are not
        required to be canonical; LML may use them as matcher hints or
        ignore them in favour of its own mirror of Backend's library data.
        They are present so LML doesn't need a Backend DB read to resolve.
      required:
        - library_id
        - artist_name
        - album_title
      properties:
        library_id:
          type: integer
          description: Backend `wxyc_schema.library.id` (FK target).
        legacy_release_id:
          type: integer
          nullable: true
          description: >
            The row's legacy MySQL `LIBRARY_RELEASE_ID` — Backend's
            `library.legacy_release_id` column, total and NOT NULL since
            the WXYC/Backend-Service#1963 mint + NULL-legacy backfill
            (migration 0137). This is the id space library.db (and
            therefore LML's per-track store,
            `lml_cache.compilation_track_identity`) is keyed by;
            `library_id` above is Backend's own serial and is NOT in this
            space, so without this field LML cannot join a row to its
            per-track data at all (WXYC/library-metadata-lookup#1021,
            WXYC/Backend-Service#1991). Optional and nullable for wire
            compatibility only: absent or NULL means the caller predates
            this field. Because Backend's column is total, an upgraded
            emitter always has a value to send — a NULL from an upgraded
            emitter is a projection defect worth surfacing, not routine
            data. LML answers bridge-less `include_tracks: true` rows of
            the resolved kinds with the not-yet-visited state
            (`tracks_attempted: false`, empty `tracks`) so consumers keep
            re-asking rather than mis-reading anything as resolved
            (`kind: unresolved` carries neither field, as ever).
            Meaningful only alongside `include_tracks: true`; harmless
            otherwise. Backend-authored catalog adds mint
            `legacy_release_id` from a sequence floored at 1,000,000
            (WXYC/Backend-Service#1963), which the Backend-sourced
            library.db producer (discogs-etl#351) will emit AS
            library.db's `id` — joining the spaces for post-tubafrenzy
            rows once that source cutover (discogs-etl#346) lands; until
            then a Backend-minted id matches no library.db row and simply
            reads as not-yet-visited.
        artist_name:
          type: string
          description: Hint — Backend's denormalized artist name for the row.
        album_title:
          type: string
          description: Hint — Backend's denormalized album title for the row.

    BulkResolveResultKind:
      type: string
      description: >
        Discriminator for `BulkResolveResult`. `single_artist` carries a
        composed `main` identity; `compilation` carries none (a V/A row has
        no album-level artist anchor). Either may carry `tracks` and
        `tracks_attempted` — per-track identity is gated by the request's
        `include_tracks` flag, not by `kind` (#297). `unresolved` is a
        first-class outcome — caching it (with TTL) prevents repeated
        re-asking for unresolvable rows — and never carries `main`,
        `tracks`, or `tracks_attempted`.
      enum:
        - single_artist
        - compilation
        - unresolved

    BulkResolveProvenanceEntry:
      type: object
      description: >
        One per-source row in LML's reconciliation log for a single
        result. Surfaces the (source, method, confidence, external_id)
        tuple that fed §3.4.1.1 composition. Always returned (empty
        provenance array on `BulkResolveResult` means LML attempted the
        cascade and no source produced a row).
      required:
        - source
        - method
        - confidence
      properties:
        source:
          $ref: '#/components/schemas/IdentitySource'
        method:
          $ref: '#/components/schemas/IdentityMethod'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Per-source confidence in [0, 1], within the source's locked
            method range from §3.4.1. NULL when `external_id` is NULL —
            the source ran but produced no candidate, so confidence is
            undefined (not zero). When non-null, equal to or greater than
            the `confidence` of the object this entry hangs off — the
            composition rules either MIN or boost, and never lower a
            per-source row. That referent is grain-relative, because this
            schema is reused at two grains: under
            `BulkResolveResult.provenance` it is the result's own
            `confidence`, and under `BulkResolveTrackIdentity.sources` it
            is that track's `confidence`, not the result's. The two are
            unrelated — a `kind: compilation` result has no result-level
            `confidence` at all, while its tracks each have their own.
        external_id:
          type: string
          nullable: true
          description: >
            The external identifier this source resolved to (Discogs
            release ID, MusicBrainz MBID, Wikidata QID, Spotify URI
            suffix, etc.). NULL when the source ran but found no match
            (the row is still surfaced so consumers see the leg ran);
            `confidence` is also NULL in that case.

    BulkResolveTrackIdentity:
      type: object
      description: >
        Per-track resolution for one library row — V/A or not. Returned
        only when the request set `include_tracks: true`; one entry per
        track LML's per-track matcher visited. `sources` reflects the
        per-source rows LML composed the track identity from — audit
        provenance, not a storage instruction: LML's per-track store is
        the per-source system of record, and consumers persist only the
        composed verdict fields on this entry. `1.29.0` said instead that
        Backend writes these rows verbatim into
        `library_track_identity_source`; that table was never built.
        WXYC/Backend-Service#792 — the Backend-side ticket that would
        have created it — closed as a design decision and the schema
        half never happened, confirmed against prod and all 136
        migrations in
        https://github.com/WXYC/Backend-Service/issues/801#issuecomment-5187348795.
        (`1.29.0` attributed that instruction to
        WXYC/library-metadata-lookup#271, which is open and scopes LML's
        own per-track identity work, not Backend storage.) The chosen
        identifiers are not lifted into a per-track `external_ids` block
        at this contract version.


        The entry is addressable without `track_position`: 78% of
        Backend's `compilation_track_artist` rows carry a NULL position
        (WXYC/Backend-Service#1989), so `artist_name` + `track_title` are
        the join-back key a consumer can actually use. `1.29.0` shipped
        `track_position` as the only row identifier plus per-source legs,
        with no composed verdict and no canonical artist — unconsumable
        for WXYC/Backend-Service#1991, which went unnoticed because the
        array has only ever shipped empty. The four added fields below
        close that gap.
      required:
        - track_position
        - artist_name
        - track_title
        - resolved_artist_name
        - confidence
        - method
        - sources
      properties:
        track_position:
          type: string
          nullable: true
          description: >
            Track position as the source has it ("A1", "3", …).
            Required-but-nullable: the key is always present, and NULL
            says "no position is recoverable for this track" rather than
            "not echoed". Not a usable row identifier on its own — most
            of Backend's compilation-track rows are position-NULL
            (WXYC/Backend-Service#1989); join on `artist_name` +
            `track_title` instead.
        artist_name:
          type: string
          minLength: 1
          description: >
            Join-back echo of the per-track credit, verbatim, and the
            load-bearing half of the join key — never NULL, and never the
            empty string (`minLength: 1`, matching
            `CatalogCompilationTrackRow.artist_name`, since an empty join
            key is indistinguishable from a missing one). No `maxLength`
            here, unlike the CTA read/write shapes: those bound one
            physical `varchar(255)` column, while this field is dual-mode
            and the `kind: single_artist` arm carries a source credit that
            no WXYC column bounds. A cap the sources don't respect would
            turn a long credit into a decode failure. Dual-mode:
            for `kind: compilation` it echoes the
            `compilation_track_artist` row as exported in library.db, so
            a consumer can match it to its own CTA row; for
            `kind: single_artist` there is no CTA row and it carries the
            credit as LML's source has it.
        track_title:
          type: string
          nullable: true
          description: >
            Join-back echo of the track title, completing the join key.
            Dual-mode in the same way as `artist_name` — the library.db
            CTA row's title for `kind: compilation`, the source's track
            title for `kind: single_artist`. NULL when that row or source
            carries no title (the underlying CTA column is nullable).
        resolved_artist_name:
          type: string
          nullable: true
          description: >
            The composed canonical artist for this track — the per-track
            analogue of `BulkResolveResult.main`, carried as a name
            because LML does not know Backend's artist ids; consumers map
            it to their own artist tables locally. NULL when the matcher
            visited this track and resolved nothing: the entry is still
            returned so consumers see the leg ran (same convention as
            `BulkResolveProvenanceEntry.external_id`), and `confidence`
            and `method` are NULL alongside it.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Composed track-level confidence in [0, 1] — where LML#1021's
            per-track composition lands (cross-source agreement boost,
            MIN-of-confidences fallback), applied at track grain exactly
            as `BulkResolveResult.confidence` applies at album grain.
            NULL when `resolved_artist_name` is NULL — the matcher ran
            and produced no verdict, so confidence is undefined (not
            zero).
        method:
          allOf:
            - $ref: '#/components/schemas/IdentityMethod'
          nullable: true
          description: >
            The composed track-level method — typically the strongest
            leg's method, or `cross_source_agreement` when LML#1021's
            boost fired. NULL when `resolved_artist_name` is NULL.
        sources:
          type: array
          description: >
            One per-source row per source LML composed the track from —
            audit detail, and the track-grain analogue of
            `BulkResolveResult.provenance`. Empty array means no source
            produced a row at track grain at all. That is a different
            statement from a populated array whose entries carry NULL
            `external_id`: there, the legs ran and reported no candidate.
            Read the verdict off `resolved_artist_name`, not off this
            array's length — an empty `sources` and a `sources` full of
            NULL-`external_id` legs both accompany a NULL
            `resolved_artist_name`.
          items:
            $ref: '#/components/schemas/BulkResolveProvenanceEntry'

    BulkResolveResult:
      type: object
      description: >
        One verdict per request input, in the same order as the request.
        `kind` discriminates the body shape. `library_id` echoes the
        request input so consumers can re-key the response without
        relying on positional ordering.
      required:
        - kind
        - library_id
        - provenance
      properties:
        kind:
          $ref: '#/components/schemas/BulkResolveResultKind'
        library_id:
          type: integer
          description: Backend `library.id` for this result.
        main:
          allOf:
            - $ref: '#/components/schemas/ReconciledIdentity'
          nullable: true
          description: >
            Composed external IDs for `kind: single_artist`. NULL for
            every other `kind`. URL construction is the consumer's job
            (see existing ReconciledIdentity contract).
        method:
          allOf:
            - $ref: '#/components/schemas/IdentityMethod'
          nullable: true
          description: >
            The composed top-level method LML's bulk-resolve handler
            picked per §3.4.1.1 (typically the strongest leg's method,
            or `cross_source_agreement` when Rule 2 boosted). NULL for
            `kind: unresolved`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Composed top-level confidence in [0, 1] — the MIN of resolved
            sources' confidences after composition (§3.4.1.1 Rule 4),
            unless boosted by cross-source agreement (Rule 2). NULL for
            `kind: unresolved`.
        provenance:
          type: array
          description: >
            Per-source rows feeding LML's composition. Always present;
            empty array means LML attempted the cascade and no source
            produced a row above the §3.4.1.1 Rule 6 floor.
          items:
            $ref: '#/components/schemas/BulkResolveProvenanceEntry'
        tracks_attempted:
          type: boolean
          nullable: true
          description: >
            Whether LML's per-track matcher has visited this row — `true`
            once it has run, **regardless of how many tracks it
            resolved**, including none. This is the resolved signal for
            per-track identity; `tracks.length` is not
            (WXYC/Backend-Service#1991).


            Read it with `tracks` as a pair, four states in total:
            **absent or NULL** — the caller did not ask (`include_tracks`
            false or omitted), or the result is `kind: unresolved`, and
            `tracks` is in the same state;
            **`false` with an empty `tracks`** — the caller asked and the
            matcher has not reached this row;
            **`true` with an empty `tracks`** — the matcher ran and
            resolved nothing;
            **`true` with a populated `tracks`** — the matcher ran and
            produced entries. `false` alongside a populated `tracks` is
            not a state; producers must not emit it. A consumer that
            observes `tracks_attempted: false` alongside a populated
            `tracks` anyway MUST read it as `true` — the populated array
            is stronger evidence of what happened than the flag that
            disagrees with it, and reading the row as unattempted would
            either drop already-resolved tracks or re-ask a row that
            already has an answer (WXYC/wxyc-shared#303).


            The middle two are what this field exists for. They are
            byte-identical in `tracks`, they are not rare — a
            `kind: single_artist` release LML holds no tracklist for is
            the ordinary case, and extending the gate to that kind is the
            whole point of #297 — and a consumer that reads emptiness as
            "not yet visited" re-asks every one of them on every pass,
            forever. That is the re-asking pathology `kind: unresolved`
            was made a first-class outcome to prevent, reintroduced at
            track grain. A consumer cannot repair it locally, because the
            two states are indistinguishable on the wire without this
            field.


            Absent and NULL are one state, for the same producer reason
            as `tracks` below.
        tracks:
          type: array
          nullable: true
          description: >
            Per-track identity, returned only when the request set
            `include_tracks: true`. That flag — not `kind` — gates the
            field, and it gates it on both `kind: single_artist` and
            `kind: compilation` (#297); `kind: unresolved` never carries
            tracks. The array carries the entries; **it does not carry
            the state** — an empty array means the matcher found nothing
            *or* has not run, and only `tracks_attempted` separates
            those. See that field for the four states of the pair.
            Entries whose `resolved_artist_name` is NULL are tracks the
            matcher tried and failed on ("the leg ran", the same
            convention as `BulkResolveProvenanceEntry.external_id`), so a
            populated array is per-track detail rather than a per-track
            guarantee.


            Absent and NULL are the same state, deliberately. LML builds
            every non-track result with `tracks=None` and serves the
            endpoint through FastAPI's `response_model` without
            `response_model_exclude_none`, so the wire has always carried
            `"tracks": null` rather than omitting the key. `nullable: true`
            documents the shipped producer instead of describing a wire
            nobody emits; consumers must accept both spellings.
          items:
            $ref: '#/components/schemas/BulkResolveTrackIdentity'

    BulkResolveLibrariesResponse:
      type: object
      description: >
        Response to `POST /api/v1/identity/bulk-resolve-libraries`. Order
        of `results` matches the order of the request's `inputs`. The
        example below is the `include_tracks: true` shape; with the flag
        false or omitted, every result's `tracks` and `tracks_attempted`
        are the absent/NULL state (LML spells both `null`). Per-source
        `method`/`confidence`
        pairs in the example sit inside `IdentityMethod`'s locked bands —
        Backend's writer rejects rows that don't, so an example that
        violated them would hand LML#1021 an unwritable row to copy. The
        example also carries `tracks_contract_version: 1`, echoing that the
        producer that emitted it understood `include_tracks`; see that
        field for the rollout-window ambiguity it exists to resolve.
      required:
        - results
      example:
        tracks_contract_version: 1
        results:
          - kind: single_artist
            library_id: 1234
            main:
              discogs_artist_id: 12345
              musicbrainz_artist_id: "abc-def-12345"
              wikidata_qid: "Q12345"
            method: cross_source_agreement
            confidence: 0.95
            provenance:
              - source: discogs
                method: exact_match
                confidence: 1.0
                external_id: "12345"
              - source: musicbrainz
                method: name_variation
                confidence: 0.95
                external_id: "abc-def-12345"
            tracks_attempted: true
            tracks:
              - track_position: "3"
                artist_name: "Juana Molina"
                track_title: "la paradoja"
                resolved_artist_name: "Juana Molina"
                confidence: 1.0
                method: exact_match
                sources:
                  - source: discogs
                    method: exact_match
                    confidence: 1.0
                    external_id: "release/456"
          - kind: compilation
            library_id: 5678
            provenance: []
            tracks_attempted: true
            tracks:
              - track_position: "A1"
                artist_name: "Chuquimamani-Condori"
                track_title: "Call Your Name"
                resolved_artist_name: "Chuquimamani-Condori"
                confidence: 0.90
                method: name_variation
                sources:
                  - source: discogs
                    method: name_variation
                    confidence: 0.90
                    external_id: "release/789"
              - track_position: null
                artist_name: "Csillagrablók"
                track_title: null
                resolved_artist_name: null
                confidence: null
                method: null
                sources:
                  - source: discogs
                    method: exact_match
                    confidence: null
                    external_id: null
          # The state `tracks` alone cannot express: the matcher ran and
          # resolved nothing. Distinguished from "not visited yet" only by
          # `tracks_attempted`, and ordinary for `kind: single_artist`.
          - kind: single_artist
            library_id: 4321
            main:
              discogs_artist_id: 77889
            method: exact_match
            confidence: 1.0
            provenance:
              - source: discogs
                method: exact_match
                confidence: 1.0
                external_id: "77889"
            tracks_attempted: true
            tracks: []
          # The state `tracks_attempted` exists to separate from `(true, [])`
          # above: the caller asked, and LML's per-track matcher has not
          # reached this row yet. Re-asking it later is correct; re-asking the
          # `(true, [])` row above is the loop the flag prevents.
          - kind: single_artist
            library_id: 5555
            main:
              discogs_artist_id: 33445
            method: exact_match
            confidence: 1.0
            provenance:
              - source: discogs
                method: exact_match
                confidence: 1.0
                external_id: "33445"
            tracks_attempted: false
            tracks: []
          # Nulls, not omitted keys: LML builds the result with `tracks=None`
          # and does not set `response_model_exclude_none`, so this is the
          # shape on the wire. The schema's nullability — and one of the two
          # oasdiff whitelist entries — rests on exactly that.
          - kind: unresolved
            library_id: 9999
            provenance:
              - source: discogs
                method: exact_match
                confidence: null
                external_id: null
            tracks_attempted: null
            tracks: null
      properties:
        tracks_contract_version:
          type: integer
          enum:
            - 1
          nullable: true
          description: >
            Present and equal to 1 only when the request set
            `include_tracks: true`, the producer understands the flag,
            AND the producer has emitted `tracks_attempted` for both
            `kind: single_artist` and `kind: compilation` results — see
            `BulkResolveResult.tracks_attempted`. The two producer arms
            ship independently (LML#1138, LML#1021); setting the marker
            with one arm unimplemented tells a consumer to trust
            `tracks_attempted` on rows where it is still meaningless.


            Absent or NULL otherwise: both when `include_tracks` was
            false or omitted, and when the producer predates this field
            entirely, or has implemented only one of the two arms above.
            LML does not set this field anywhere yet and serves this
            endpoint without `response_model_exclude_none`, so it ships
            `null` — never an omitted key — on every response in
            production today (WXYC/wxyc-shared#310); `nullable: true`
            documents that wire instead of describing one nobody emits,
            the same treatment as `tracks` / `tracks_attempted` above.


            Because of that, a consumer MUST test for the value `1` and
            must never test for key presence — `!== undefined` against
            the generated TypeScript reads TRUE for a producer that
            implements none of this, the inverse of what the marker
            exists to signal. Absent, `null`, and a producer that
            predates this field must all read "not supported", and only
            the literal value `1` reads "supported" — which keeps the
            check immune to whether any given producer omits or nulls
            its unset optionals. Same precedent as
            `LookupResponse.api_version`
            (`LookupRequest.include_identity`): a producer-echoed
            capability marker that lets a consumer distinguish "the
            producer understood my flag and the answer is genuinely
            nothing" from "the producer predates my flag" — a
            distinction `tracks_attempted`/`tracks` cannot make alone,
            because both are spelled `null` in either case
            (WXYC/wxyc-shared#303). No schema-level `default`, for the
            same `openapi-typescript` `defaultNonNullable` reason
            documented on `BulkResolveLibrariesRequest.include_tracks`.
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkResolveResult'
        cache_stats:
          $ref: '#/components/schemas/CacheStats'

    # ====================================
    # Release identity (LML#526)
    # ====================================
    # The `POST /api/v1/identity/resolve` endpoint mints (or returns) a
    # stable identity_id for a release-shaped (source, external_id) pair.
    # The wire shape is polymorphic on `kind` for forward compatibility —
    # `kind: artist` will be added in a follow-up — but v1 accepts only
    # `release`. Both first-mint and idempotent re-resolve return 200; the
    # `minted` field distinguishes them. Sentinel inputs (Discogs id <= 0,
    # malformed Bandcamp URL, etc.) are rejected with 422 before any DB
    # write, so no poisoned identity row can be created.

    IdentityKind:
      type: string
      description: >
        Discriminator for the identity being resolved. v1 of the
        `/api/v1/identity/resolve` endpoint accepts only `release`; the
        `artist` value is reserved for the planned symmetric extension.
      enum:
        - release

    ReleaseIdentitySource:
      type: string
      description: >
        Source whose external ID is being resolved into a release identity.
        Matches the v1 source list from LML#526; new sources land in
        lockstep with their column on `entity.release_identity` and a
        matching sentinel rule on the LML side.
      enum:
        - discogs_release
        - discogs_master
        - bandcamp
        - apple_music_album

    ReleaseIdentityResolveRequest:
      type: object
      description: >
        Request body for `POST /api/v1/identity/resolve`. The triple
        `(kind, source, external_id)` is the identity key — the same triple
        always returns the same identity_id.
      required:
        - kind
        - source
        - external_id
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        source:
          $ref: '#/components/schemas/ReleaseIdentitySource'
        external_id:
          type: string
          description: >
            Source-specific identifier. For `discogs_release` /
            `discogs_master` it is the positive integer ID as a string;
            zero and negative values are rejected with 422 (Discogs uses
            `0` for the unknown-release sentinel). For `bandcamp` it is
            the canonical album URL (e.g.
            `https://autechre.bandcamp.com/album/confield`); LML
            URL-canonicalises before mint so trailing-slash and
            equivalent variants converge on one identity row. Non-album
            Bandcamp URLs (track URLs, bare subdomain) are rejected with
            422. For `apple_music_album` it is the numeric Apple Music
            album ID as a string (e.g. `1234567890`); zero, negative,
            and non-numeric values are rejected with 422.
      example:
        kind: release
        source: discogs_release
        external_id: "12345"

    ReleaseIdentityResolveResponse:
      type: object
      description: >
        Response to `POST /api/v1/identity/resolve`. `identity_id` is
        stable across calls; `minted` distinguishes the first call (true)
        from subsequent lookups (false). Re-resolves do not write a new
        reconciliation log row — the resolver only logs the act of
        minting.
      required:
        - identity_id
        - kind
        - minted
      properties:
        identity_id:
          type: integer
          description: >
            `entity.release_identity.id` for the resolved row. Stable
            across calls with the same `(kind, source, external_id)`.
        kind:
          $ref: '#/components/schemas/IdentityKind'
        minted:
          type: boolean
          description: >
            `true` when this call inserted a new row, `false` when an
            existing row was returned. Useful for callers that want to
            observe whether they were the first to surface a given
            release.
      example:
        identity_id: 42
        kind: release
        minted: true

    # ====================================
    # Artist Search Alias (artist-search-alias plan)
    # ====================================

    ArtistSearchAliasSource:
      type: string
      description: >
        Origin of an artist search alias variant. Opaque to BS storage (just a
        tag); used by future read-path ranking and audit. Open enum — new
        sources can be added by LML without a wire-format break.
      enum:
        - discogs_name_variation
        - discogs_alias
        - discogs_member
        - wxyc_library_alt

    ArtistSearchAliasMethod:
      type: string
      description: >
        Semantic classification of how this variant relates to the subject
        artist. Distinct from source — multiple sources can emit the same
        method.
      enum:
        - name_variation
        - alias
        - member
        - alt_curated

    ArtistSearchAliasVariant:
      type: object
      description: >
        One alias variant for an artist. The `variant` string is what gets
        matched against search queries via trigram similarity. The `source`
        tag identifies where the row came from; `method` classifies the
        semantic relationship.
      required:
        - source
        - variant
        - method
        - confidence
      properties:
        source:
          $ref: '#/components/schemas/ArtistSearchAliasSource'
        variant:
          type: string
          description: The searchable string (e.g. "Thee Oh Sees").
        related_external_id:
          type: string
          nullable: true
          description: >
            For alias / member kinds, the namespaced source-side id of the
            related artist (e.g. "discogs:artist:67890",
            "musicbrainz:artist:<mbid>"). NULL for name_variation and
            alt_curated.
        related_name:
          type: string
          nullable: true
          description: >
            For alias / member kinds, the canonical name of the related
            artist as the source records it. NULL otherwise.
        active:
          type: boolean
          nullable: true
          description: >
            For member kind only — Discogs records active/inactive band
            membership. NULL for other kinds.
        method:
          $ref: '#/components/schemas/ArtistSearchAliasMethod'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >
            Per-source default confidence (e.g. 0.95 for
            discogs_name_variation, 0.85 for discogs_alias / wxyc_library_alt,
            0.70 for discogs_member). v1 search ignores this; stored for v2
            ranking calibration.

    ArtistSearchAliasesResult:
      type: object
      required:
        - name
        - variants
        - sources_present
      properties:
        name:
          type: string
          description: The WXYC canonical artist name from the request.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ArtistSearchAliasVariant'
        sources_present:
          type: array
          description: >
            Sources the composer actually queried for this artist. A source
            appears here iff the composer reached its fetch code path —
            independent of whether that path produced any variants. Consumers
            use this to scope reconciliation: only delete cached rows whose
            `source` is listed here. Sources skipped because of missing
            prerequisites (e.g., no `discogs_artist_id` in
            `entity.identity`) are ABSENT from this list, and the consumer
            must leave their cached rows alone — that source did not run, so
            its absence is not evidence of upstream deletion. Modeled on the
            empty-provenance semantic of `BulkResolveProvenanceEntry`.
          items:
            $ref: '#/components/schemas/ArtistSearchAliasSource'

    ArtistSearchAliasesBulkRequest:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: WXYC canonical artist names.
          minItems: 1
          maxItems: 1000
          items:
            type: string

    ArtistSearchAliasesBulkResponse:
      type: object
      required:
        - artists
        - missing
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistSearchAliasesResult'
        missing:
          type: array
          description: >
            Input names with no `entity.identity` row in LML — i.e., LML
            doesn't know any external IDs for these. BS can choose to retry
            later (after a discogs-cache rebuild and entity-resolution
            campaign) or leave them.
          items:
            type: string
        cache_stats:
          $ref: '#/components/schemas/CacheStats'

    # ====================================
    # Bulk bare-name artist resolution (LML#759)
    # ====================================
    # Schemas for `POST /api/v1/artists/resolve/bulk` (consumer:
    # WXYC/Backend-Service#1614 concerts pipeline). The verify-before-mint
    # resolution model is documented once, on the path description.

    ArtistResolveMethod:
      type: string
      description: >
        What decided a resolved verdict. `identity_store` — a pre-existing
        `entity.identity` row short-circuited resolution (unverified: the
        store's resolved-at-most-once promise). `api_search` — a
        single-page live Discogs API artist search returned exactly one
        artist whose fixed-point identity-match form equals the input's,
        whose own title qualifier matches the input's (a "(N)"-titled
        singleton answering a bare input — or vice versa — is family
        evidence, not a resolution), and with no equality-leg cache
        conflict. Cache legs never decide; their evidence appears in
        `cache_corroboration`.
      enum:
        - identity_store
        - api_search

    ArtistResolveCacheLeg:
      type: string
      description: >
        A discogs-cache candidate-generation leg that produced at least
        one candidate for the input name. Mirrors the entity-resolution
        reconciler cascade's legs (exact / member / alias / name-variation
        / trigram — the cascade subset of `IdentityMethod`), but as
        candidate sets used for corroboration and conflict detection —
        never as verdicts. The four equality legs can veto a mint into
        `ambiguous`; fuzzy `cache_trigram` neighbors never veto.
      enum:
        - cache_exact
        - cache_member
        - cache_alias
        - cache_name_variation
        - cache_trigram

    ArtistResolveUnresolvedReason:
      type: string
      description: >
        Why a name did not resolve. `not_found` — the API tier ran and
        observed zero exact-form candidates on its single search page
        (terminal in v1; a search observation, not proof no such artist
        exists — cache legs, including `cache_exact`, may still
        show yield in `cache_corroboration`). `ambiguous` — two or
        more exact-form Discogs artists (including "(N)" disambiguation
        families, which normalize to the same form); an equality-leg
        cache candidate (exact / member / alias / name-variation — never a
        fuzzy `cache_trigram` neighbor) pointing at a different artist id
        than the API's single candidate; a lone API candidate whose own
        title qualifier mismatches the input's; or conflicting
        identity-store rows across one deduplicated group's spellings
        (`candidate_count` null — nothing was measured); ambiguous names
        never mint (terminal). `escalation_unavailable` — the Discogs API
        tier couldn't answer: saturation breaker open, outage cool-down,
        429 or 5xx after retries, network errors, other non-2xx
        responses, a distrusted/unparseable page, or a deployment with no
        Discogs credentials configured. It means "couldn't ask," not
        "asked and missed" — consumers must not apply a no-match TTL.
        Retry with bounded attempts and backoff: most causes are
        transient, but a persistent `escalation_unavailable` across
        attempts indicates a configuration or upstream condition that
        retrying will not move.
      enum:
        - not_found
        - ambiguous
        - escalation_unavailable

    ArtistResolveResult:
      type: object
      description: >
        Verdict for one input name, index-aligned with
        `ArtistResolveBulkRequest.names`. Exactly one of
        `discogs_artist_id` (resolved, with `method`) or
        `unresolved_reason` is present.
      required:
        - name
        - cache_corroboration
      properties:
        name:
          type: string
          description: Verbatim echo of the input name at this index.
        discogs_artist_id:
          type: integer
          nullable: true
          description: >
            The resolved Discogs artist id. Non-null iff resolved
            (serialized as an explicit null on unresolved verdicts — the
            response never omits fields).
        canonical_name:
          type: string
          nullable: true
          description: >
            The raw Discogs artist title, disambiguation suffix included
            (e.g. `Popsicle (2)`) — the true Discogs string, kept for
            provenance; callers render their own input name. Present iff
            resolved via `api_search`: `entity.identity` rows store no
            Discogs title, so `identity_store` resolutions omit it.
        method:
          allOf:
            - $ref: '#/components/schemas/ArtistResolveMethod'
          nullable: true
          description: >
            What decided the resolution. Non-null iff resolved
            (serialized as an explicit null on unresolved verdicts).
        cache_corroboration:
          type: array
          uniqueItems: true
          description: >
            Cache legs that produced at least one candidate for this
            name's identity-match form, on BOTH verdict kinds — the
            per-leg yield telemetry sizing a possible v2 alias arm. On
            resolved verdicts, listed equality legs necessarily agreed
            with the deciding tier (a disagreeing equality leg forces
            `ambiguous`), while `cache_trigram` entries are fuzzy
            near-misses that never veto (`cache_trigram` is measured
            against the group's probe string — its lexicographically
            least sanitized spelling — where the equality legs bind the
            identity-match form). Empty when no leg produced candidates,
            and ALWAYS empty — the cache was never consulted, which is
            not a measured zero-yield — on (a) `identity_store`
            short-circuits (the store decides before cache evidence is
            consulted), (b) qualifier-bearing inputs (stripped-form
            evidence cannot distinguish family members, so the cache
            tier is skipped), and (c) store-conflict `ambiguous`
            verdicts.
          items:
            $ref: '#/components/schemas/ArtistResolveCacheLeg'
        unresolved_reason:
          allOf:
            - $ref: '#/components/schemas/ArtistResolveUnresolvedReason'
          nullable: true
          description: >
            Why the name did not resolve. Non-null iff unresolved
            (serialized as an explicit null on resolved verdicts). The
            response carries every field explicitly — consumers must
            treat null, not absence, as the "other kind" marker.
        # Not in `required`: datamodel-codegen's default flags (what LML
        # generates models with) type a required-plus-nullable field as
        # non-nullable, rejecting the null this field must carry. The
        # description pins the always-serialized wire promise instead.
        candidate_count:
          type: integer
          nullable: true
          description: >
            Exact-form candidates the API tier observed: 1 on resolved via
            `api_search`, 0 on not_found; on ambiguous, >= 2 for an
            overloaded family, or exactly 1 when the ambiguity is an
            equality-leg cache conflict or a qualifier mismatch between
            the lone candidate's own title and the input (a "(N)"-titled
            singleton answering a bare input, or vice versa, is family
            evidence — never a resolution).
            Always serialized — never omitted; null when the API tier did
            not run: identity_store short-circuit,
            escalation_unavailable, or an `ambiguous` verdict from
            conflicting identity-store rows within one deduplicated group
            (the store contradicting itself is doubt without a
            measurement; such verdicts also carry an empty
            `cache_corroboration` — the cache tier was never consulted)
            — null means "not measured," never zero.

    ArtistResolveBulkRequest:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: >
            Bare artist names to resolve, verbatim (Unicode format
            characters are dropped and whitespace trimmed for all
            internal work; responses echo the raw string). Inputs are
            deduplicated internally on their fixed-point identity-match
            form PLUS any trailing parenthesized/bracketed qualifier.
            Qualifier detection mirrors the normalizer: every balanced
            trailing ()/[] group peels off the NFKC-folded lowercase name
            (nested tails included), bare-number groups canonicalize
            across bracket/width/spacing spellings ("[2]", "( 2 )",
            "（２）" all key as "(2)"; zero-padded "(02)" stays distinct),
            and multi-group tails concatenate ("(2)(uk)"); non-numeric
            groups drop internal whitespace, so "(Chk Chk Chk)" and
            "(ChkChkChk)" share a key. Duplicate
            positions receive the shared verdict, but a qualified name is
            its own work unit — a Discogs-style disambiguator denotes a
            different artist than the bare name, so it never inherits (or
            supplies) the bare form's verdict, and it resolves only when
            the API candidate's own title carries the same qualifier. A
            name whose only content IS a bracketed group ("(Smog)") is a
            bare name, not a qualifier — the normalizer makes the same
            refusal. A verified mint is keyed on the group's
            lexicographically-least sanitized spelling (deterministic in
            batch content — the same representative the API probe uses;
            the store's read legs are case-insensitive, so any spelling
            stays findable), EXCEPT when the identity read found an
            existing row for the name that lacks `discogs_artist_id` —
            the mint then fills that row's stored key in place rather
            than inserting a near-duplicate key (deterministically, the
            lexicographically-least stored key when several id-less rows
            match); qualified names never mint. Names that are blank,
            contain U+0000 or unencodable code points, normalize to an
            empty identity-match form, or whose entire identity content
            is a bare parenthesized ASCII number ("(2)", "[2]", "(2)(3)"
            — a Discogs disambiguator whose artist name was lost
            upstream; a fully-bracketed NON-numeric name like "(Smog)"
            stays resolvable) are rejected with 422 — never given an
            in-band verdict (`not_found` means the API tier ran and
            measured zero).
          minItems: 1
          maxItems: 25
          # Codegen note: the item bounds make datamodel-codegen wrap
          # items in a `Name` RootModel (`names: list[Name]`, not
          # `list[str]`) — LML must unwrap `.root` at the route boundary;
          # a naive str() renders "root='...'" and would mint garbage
          # entity.identity keys.
          items:
            type: string
            minLength: 1
            maxLength: 255
        dry_run:
          type: boolean
          default: false
          description: >
            Run every tier identically — including live Discogs API
            verification — but skip the `entity.identity` write-back. No
            partial-write mode.

    ArtistResolveBulkResponse:
      type: object
      description: >
        Response to `POST /api/v1/artists/resolve/bulk`. `results` is
        index-aligned with the request's `names`.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ArtistResolveResult'

    # ====================================
    # Bulk artist-level genre/style aggregation (LML#781)
    # ====================================
    # Schemas for `POST /api/v1/artists/genres/bulk` (consumer:
    # WXYC/Backend-Service#1624 nightly concerts genre-enrichment). Aggregates
    # per-artist Discogs *genres* (coarse, top 1-2) and *styles* (fine, full
    # ranked list) from the discogs-cache `release_genre` / `release_style`
    # rows, with a self-healing Discogs API fallback on a cache miss. WXYC's
    # internal library genre taxonomy is deliberately never surfaced here.

    ArtistGenresSource:
      type: string
      description: >
        Where an artist's genre/style answer came from, so the caller can
        distinguish a genuine "Discogs has no genre data for this artist"
        (safe to negative-cache) from a transient "couldn't ask Discogs"
        (retry). `cache` — served from the discogs-cache `release_genre`
        rows. `discogs_api` — cache miss; the Discogs API fallback produced
        genres. `not_found` — cache miss; the API answered but the artist has
        no release/genre data (safe to negative-cache). `unavailable` — cache
        miss and the API could not be consulted (no Discogs token, saturation
        breaker open, or a transient fetch failure); retry, do NOT
        negative-cache.
      enum:
        - cache
        - discogs_api
        - not_found
        - unavailable

    ArtistGenresInput:
      type: object
      description: One artist to aggregate genres/styles for.
      required:
        - artist_name
      properties:
        artist_name:
          type: string
          minLength: 1
          description: Artist display name.
        discogs_artist_id:
          type: integer
          nullable: true
          description: >
            Discogs artist ID. Optional but strongly preferred: when present
            the cache aggregation keys on it (stable Discogs artist entity,
            homonym-safe); when absent it falls back to a case-insensitive
            exact `artist_name` match. Backend-Service resolves it via
            `POST /api/v1/artists/resolve/bulk` (LML#759) before calling this
            endpoint, so it is usually present.

    BulkArtistGenresRequest:
      type: object
      description: >
        Request body for `POST /api/v1/artists/genres/bulk`. The per-request
        artist cap is enforced at the router (413, before validation); an
        empty batch returns 422.
      required:
        - artists
      properties:
        artists:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/ArtistGenresInput'

    ArtistGenresResultItem:
      type: object
      description: >
        Per-artist aggregation, index-aligned with the request `artists` list.
      required:
        - artist_name
        - genres
        - styles
        - source
      properties:
        artist_name:
          type: string
          description: Echoed from the request for index alignment.
        discogs_artist_id:
          type: integer
          nullable: true
          description: >
            Echoed from the request (explicit null when not supplied). Kept
            out of `required` deliberately: datamodel-codegen (LML's
            generator) types a required-plus-nullable field as non-nullable
            and would reject the null this field must carry — the same
            treatment as `ArtistResolveResult.discogs_artist_id`.
        genres:
          type: array
          description: >
            Top coarse Discogs genres (majority-take, frequency-ranked,
            truncated to the top-K). Empty when unknown. The ~15-value Discogs
            genre taxonomy the iOS On Tour filter chips render.
          items:
            type: string
        styles:
          type: array
          description: >
            Frequency-ranked Discogs styles (full list, untruncated). Empty
            when unknown. The finer Discogs style taxonomy; the iOS filter
            ignores it — it is a detail-view treatment.
          items:
            type: string
        source:
          $ref: '#/components/schemas/ArtistGenresSource'

    BulkArtistGenresResponse:
      type: object
      description: >
        Response to `POST /api/v1/artists/genres/bulk`. `results` is
        index-aligned with the request's `artists`. No top-level counters —
        the caller derives them via `Counter(r.source for r in results)`.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ArtistGenresResultItem'

    # ====================================
    # Cache refresh for identities (LML#525)
    # ====================================
    # `POST /api/v1/cache/refresh-for-identities` is the source-agnostic
    # cache-warmer that Backend's rotation-artist-backfill cron consumes
    # (WXYC/Backend-Service#1381). The cron passes `entity.release_identity.id`
    # values; LML maps each to its per-source `(source, external_id)` pairs
    # and dispatches the per-source release-cache refresh. After each
    # refreshed Discogs release, LML walks the release's artist credits and
    # refreshes the per-artist cache too — applying the LML#525 sentinel
    # guard at the walk site so VA compilations with `artist_id = 0` don't
    # leak through. Today only the Discogs leg is wired; other sources
    # return `release_outcome = "not_implemented"`.

    CacheRefreshSourceOutcome:
      type: string
      description: >
        Per-source release-leg outcome. `success` covers both cache hits and
        fresh fetches AND tombstones (Discogs 404s — the cache state is
        still current). `error` is transport / 5xx / parse failure. The
        leg did not complete. `not_implemented` is for sources whose cache
        layer doesn't exist yet (discogs_master pre-`MasterRelease.artists`,
        musicbrainz_release pre-LML#217, etc.). Consumers that need to
        distinguish "warm-real" from "warm-tombstone" should read the cache
        row's `not_found` flag directly, not infer from this enum.
      enum:
        - success
        - error
        - not_implemented

    CacheRefreshItemStatus:
      type: string
      description: >
        Per-identity rollup of the per-source outcomes. Release-leg-gated:
        any source `success` → `warmed` (artist failures inside a release
        walk are partial value, not a retry trigger). Only `not_implemented`
        sources → `not_implemented`. All sources errored → `error`. Row
        absent in `entity.release_identity` → `not_found` (with `sources`
        as null). Only `error` is a retry signal.
      enum:
        - warmed
        - not_found
        - not_implemented
        - error

    CacheRefreshArtistOutcome:
      type: object
      description: >
        Per-artist outcome inside the walk-to-artists step of a per-source
        release refresh. `external_id` is string-typed for future
        source-agnosticism — Discogs IDs serialize as decimal strings.
      required:
        - external_id
        - outcome
      properties:
        external_id:
          type: string
        outcome:
          $ref: '#/components/schemas/CacheRefreshSourceOutcome'
        message:
          type: string
          nullable: true
          description: >
            Exception class name when `outcome != success`. Bare `str()` of
            the exception is intentionally NOT serialized — it may carry
            upstream error bodies, SQL fragments, or file paths. Full
            traceback lands in Sentry.

    CacheRefreshSourceResult:
      type: object
      description: >
        Per-source outcome for one identity. `artists` is the walk-to-artists
        fan-out result for the Discogs release leg — empty list on
        tombstone-success (no artists to walk) and on legs that don't do a
        walk (every non-Discogs source today).
      required:
        - release_outcome
      properties:
        release_outcome:
          $ref: '#/components/schemas/CacheRefreshSourceOutcome'
        artists:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CacheRefreshArtistOutcome'
        message:
          type: string
          nullable: true

    CacheRefreshResultItem:
      type: object
      description: >
        Per-identity verdict. `sources` is null when `status == not_found`
        (no row to dispatch against). Otherwise it is keyed by source
        vocabulary (`discogs_release`, `discogs_master`, …); see
        `RELEASE_SOURCE_COLUMN` on the LML side for the canonical set.
      required:
        - identity_id
        - status
      properties:
        identity_id:
          type: integer
        status:
          $ref: '#/components/schemas/CacheRefreshItemStatus'
        sources:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/CacheRefreshSourceResult'
        message:
          type: string
          nullable: true

    BulkCacheRefreshRequest:
      type: object
      description: >
        Request body. The 50-id batch cap is enforced server-side with
        HTTP 400 on overflow (not 422 — LML's `/api/v1/lookup/bulk`
        precedent). Downstream callers should encode 50 as a hard
        constant or assert at startup, not expose it as an env knob —
        the cap is bounded by Discogs rate-limit × cold-cache fan-out ≤
        Railway's request-timeout ceiling, and recalibration must land
        alongside any ingress change. Empty `identity_ids` returns 422
        (Pydantic `min_length=1`). Duplicate identity_ids are allowed;
        each runs independently and shows up as a separate result.
      required:
        - identity_ids
      properties:
        identity_ids:
          type: array
          minItems: 1
          items:
            type: integer
      example:
        identity_ids: [42, 99, 12345, 7]

    BulkCacheRefreshResponse:
      type: object
      description: >
        Per-identity verdicts in input order. No top-level counters —
        callers derive them via `Counter(r.status for r in results)`,
        matching the `BulkLookupResultItem` precedent.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CacheRefreshResultItem'
      example:
        results:
          - identity_id: 42
            status: warmed
            sources:
              discogs_release:
                release_outcome: success
                artists:
                  - external_id: "999"
                    outcome: success
                  - external_id: "1001"
                    outcome: success
          - identity_id: 99
            status: not_found
            sources: null
          - identity_id: 12345
            status: not_implemented
            sources:
              discogs_master:
                release_outcome: not_implemented
                artists: []
          - identity_id: 7
            status: error
            sources:
              discogs_release:
                release_outcome: error
                artists: []
                message: ConnectError

    # ====================================
    # LML Discogs & Metadata Service Types
    # ====================================

    DiscogsTrackItem:
      type: object
      description: A track on a release, with optional per-track artist credits (for compilations).
      required:
        - position
        - title
      properties:
        position:
          type: string
        title:
          type: string
        duration:
          type: string
          nullable: true
        artists:
          type: array
          items:
            type: string
          default: []

    DiscogsArtistCredit:
      type: object
      description: An artist credit on a release (performer, producer, etc.).
      required:
        - name
      properties:
        artist_id:
          type: integer
          nullable: true
        name:
          type: string
        join:
          type: string
          default: ""
          description: Join phrase (e.g. " & ", ", ")
        role:
          type: string
          nullable: true
          description: Role for extra artists (e.g. "Producer", "Mixed By")

    DiscogsWriterCredits:
      type: object
      description: >
        Songwriter/composer credits for the resolved playcut, derived from the
        Discogs writer-role credits already fetched at resolution time (the
        `extra=1` artist credits whose `role` is a writer role — e.g.
        "Written-By", "Composed By", "Music By", "Lyrics By", "Songwriter",
        "Words By", including hyphen/space, bracketed, and comma-compound
        variants). Surfaced on `DiscogsMatchResult.writer_credits` for BMI
        performance-list reporting; populated only when `extended` is true and
        a writer credit resolves, and omitted entirely when nothing resolves —
        names are never fabricated. A consumer with no resolved composer falls
        back to artist-as-proxy.
      required:
        - names
        - provenance
      properties:
        names:
          type: array
          items:
            type: string
          description: Distinct songwriter/composer names for the resolved track.
        roles:
          type: array
          nullable: true
          items:
            type: string
          description: >
            The verbatim Discogs role strings the names were drawn from (e.g.
            "Written-By", "Words By, Music By"), for auditability of the
            writer-role mapping.
        provenance:
          type: string
          enum:
            - track
            - release
          description: >
            `track` = scoped to the resolved track's per-track credits
            (precise); `release` = a release-level credit applied to the whole
            release (approximate for an individual track, mirroring tubafrenzy's
            auto-fill-from-artist fallback). Populated as `release` in the
            initial rollout; `track` is added when per-track resolution lands.
        track_position:
          type: string
          nullable: true
          description: >
            The resolved track's position (e.g. "A1", "5") when
            `provenance` is `track`; null for release-level credits.

    DiscogsLabelCredit:
      type: object
      required:
        - name
      properties:
        label_id:
          type: integer
          nullable: true
        name:
          type: string
        catno:
          type: string
          nullable: true
          description: Catalog number

    DiscogsReleaseVideo:
      type: object
      required:
        - src
      properties:
        src:
          type: string
        title:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
          description: Duration in seconds
        embed:
          type: boolean
          default: true

    DiscogsReleaseMetadata:
      type: object
      description: Full release metadata from LML, including tracklist and enriched credits.
      required:
        - release_id
        - title
        - artist
        - release_url
      properties:
        release_id:
          type: integer
        master_id:
          type: integer
          nullable: true
          description: >
            Discogs master ID for this release, when the release belongs to a
            master. `null` when Discogs has no master (one-offs,
            self-released). Lets a caller collapse multiple pressings/formats
            of one logical album into a single record keyed on the master.
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
          nullable: true
        label:
          type: string
          nullable: true
        artist_id:
          type: integer
          nullable: true
        label_id:
          type: integer
          nullable: true
        genres:
          type: array
          items:
            type: string
          default: []
        styles:
          type: array
          items:
            type: string
          default: []
        tracklist:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsTrackItem'
          default: []
        artwork_url:
          type: string
          nullable: true
        artwork_checked_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of the most recent live Discogs API call that resolved
            this release's artwork. `null` means LML's bulk loader populated
            the row but the live API has not been queried yet (the "never
            asked" state); a value means LML hit the live API and either
            populated `artwork_url` or confirmed Discogs has no cover. LML
            uses this to distinguish bulk-loader gaps (which it back-fills)
            from genuinely-imageless releases (which it does not refetch).
            See WXYC/discogs-etl#239 + WXYC/library-metadata-lookup#423.
        not_found:
          type: boolean
          default: false
          description: |
            Tombstone marker for Discogs 404s on `get_release`. `true` means
            LML hit the live Discogs API for this release id and Discogs
            returned 404; subsequent reads short-circuit on this flag rather
            than re-burning the rate-limit budget. The tombstone row carries
            `title = ""` and `artist = ""` as identifier sentinels;
            consumers must guard against rendering those empty strings as
            real values. `release_url` is identifier-derived
            (`https://www.discogs.com/release/{release_id}`) and remains
            valid even on a tombstone. LML's public boundary translates
            `not_found = true` back to `None` for direct callers; this flag
            is observable only by consumers that read the cache row
            directly (none of which exist in LML's public API today, but
            the contract is exposed here for future cross-service readers).
            See WXYC/library-metadata-lookup#510.
        release_url:
          type: string
        cached:
          type: boolean
          default: false
        artists:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsArtistCredit'
          default: []
        extra_artists:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsArtistCredit'
          default: []
        labels:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsLabelCredit'
          default: []
        released:
          type: string
          nullable: true
          description: Release date as ISO string
        videos:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsReleaseVideo'
          default: []

    DiscogsResolvedToken:
      type: object
      description: A single resolved token from Discogs markup parsing. Discriminated by the `type` field.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - plainText
            - artistLink
            - labelName
            - releaseLink
            - masterLink
            - bold
            - italic
            - underline
            - urlLink
        text:
          type: string
          description: Content for plainText tokens
        name:
          type: string
          description: Name for artistLink and labelName tokens
        display_name:
          type: string
          description: Display name for artistLink tokens (disambiguation suffix stripped)
        title:
          type: string
          description: Title for releaseLink and masterLink tokens
        url:
          type: string
          description: URL for artistLink, releaseLink, masterLink tokens
        href:
          type: string
          nullable: true
          description: URL for urlLink tokens (null if URL is invalid)
        content:
          type: string
          description: Content for bold, italic, underline, and urlLink tokens

    DiscogsArtistDetails:
      type: object
      description: Full artist details from Discogs, including bio, aliases, and group members.
      required:
        - artist_id
        - name
      properties:
        artist_id:
          type: integer
        name:
          type: string
        profile:
          type: string
          nullable: true
        profile_tokens:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DiscogsResolvedToken'
          description: Pre-parsed structured tokens from the Discogs profile markup
        image_url:
          type: string
          nullable: true
        name_variations:
          type: array
          items:
            type: string
          default: []
        aliases:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: integer
              name:
                type: string
          default: []
        members:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: integer
              name:
                type: string
              active:
                type: boolean
                default: true
          default: []
        urls:
          type: array
          items:
            type: string
          default: []
        cached:
          type: boolean
          default: false

    DiscogsReleaseInfo:
      type: object
      description: A single release from the track-releases search.
      required:
        - album
        - artist
        - release_id
        - release_url
      properties:
        album:
          type: string
        artist:
          type: string
        release_id:
          type: integer
        release_url:
          type: string
        is_compilation:
          type: boolean
          default: false

    DiscogsTrackReleasesResponse:
      type: object
      description: Response from LML's track-releases search endpoint.
      properties:
        track:
          type: string
        artist:
          type: string
          nullable: true
        releases:
          type: array
          items:
            $ref: '#/components/schemas/DiscogsReleaseInfo'
          default: []
        total:
          type: integer
          default: 0
        cached:
          type: boolean
          default: false

    # ============================
    # Library Search Types
    # ============================

    TrackMatchSource:
      type: string
      enum:
        - cta
        - discogs_release
        - discogs_master
        - library_identity
      description: >
        Provenance of a TrackMatchHint. `cta` indicates Backend's local
        `compilation_track_artist` lookup (Track 1, BS-local). `discogs_release` indicates
        LML matched via a Discogs release_id (Track 2; pre-cross-cache-identity, this is a
        direct CEI release-format hit; post-cross-cache-identity, it's a
        `library_identity.discogs_release_id` hit). `discogs_master` indicates LML matched
        via a Discogs master_id (Track 2; the more common pre-cross-cache-identity path,
        since ~90% of CEI rows are master-format). `library_identity` indicates an
        explicit substrate match — emitted post-cross-cache-identity when LML's pipeline
        exposes the distinction in its response.

    TrackMatchHint:
      type: object
      description: >
        Populated on library search / lookup result items when a track-title match drove
        the inclusion of this release into the results. The `source` field distinguishes
        the underlying match pathway so consumers can render appropriate UX (e.g.,
        qualitative "matched via Discogs (verified)" tooltips) and downstream audits can
        break coverage down by source.
      required:
        - title
        - source
      properties:
        title:
          type: string
          description: The track title as stored in the source.
        artist_credit:
          type: string
          nullable: true
          description: >
            Per-track artist credit (for compilations, where each track may credit a
            distinct artist). Null for non-comp tracks where the release-level artist
            applies.
        position:
          type: string
          nullable: true
          description: >
            Track position on the release as stored in the source (e.g., "A1", "B2", "5").
            String-typed to match Discogs's `release_track.position` shape, which uses
            vinyl-side notation for LP releases. Null when position is unknown or
            inapplicable (e.g., CTA-derived matches, since `compilation_track_artist` has
            no position column).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Confidence score for the underlying identity match. Sourced from
            `library_identity.confidence` post-cross-cache-identity, from
            `canonical_entity_confidence` pre-cross-cache-identity, or fixed at 1.0 for
            `cta`-source hits (the curated VA-disambiguation data is treated as
            authoritative). Used by the UI to render qualitative tooltips on the chip;
            consumers should not assume null for `cta` source.
        source:
          $ref: '#/components/schemas/TrackMatchSource'

    ArtistMatchHint:
      type: object
      description: >
        Populated on library search result items when an artist-alias match
        from the BS-local `artist_search_alias` cache drove the inclusion of
        this release into the results (artist-search-alias plan PR 5).
        Sibling to TrackMatchHint — track hints carry title + position +
        artist_credit which have no meaning for alias matches; alias hints
        carry the variant string that scored and its source tag for UX
        rendering and audit.
      required:
        - matched_variant
        - source
      properties:
        matched_variant:
          type: string
          description: The cached alias string that trigram-matched the query.
        source:
          $ref: '#/components/schemas/ArtistSearchAliasSource'

    LibrarySearchItem:
      type: object
      description: A single item from LML's library catalog search.
      required:
        - id
      properties:
        id:
          type: integer
          nullable: true
          description: >
            The release's Backend identifier — `wxyc_schema.library.id` —
            once the proxy id re-map (WXYC/Backend-Service#2168) ships.
            Until that deploy it still carries the library.db legacy id,
            the same value as `legacy_release_id` below, because library.db
            has no other id to give. The distinction is not cosmetic: the
            two spaces are numerically coextensive but unrelated, and an id
            read in the wrong one lands on a *different real release* 87.7%
            of the time (WXYC/dj-site#1179) — a silently wrong album link,
            not a miss.


            Required but nullable. A `null` here comes only from Backend's
            proxy rewrite path (`GET /proxy/library/search`), for a row
            whose legacy id has no Backend counterpart: 609 of 64,731
            library.db rows as measured 2026-08-14 (599 collapsed into a
            sibling sharing their `LIBRARY_CODE`, 10 absent outright), all
            of them already unreachable from the dj-site picker. LML's own
            `GET /library/search` never emits null here.
        legacy_release_id:
          type: integer
          nullable: true
          description: >
            The library.db producer key — upstream tubafrenzy
            `LIBRARY_RELEASE.ID`, or the Backend mint floored at 1,000,000
            for Backend-authored catalog rows (WXYC/Backend-Service#1963).
            This is the space LML's own per-release reads resolve against,
            and the id embedded in `library_url` below; Backend's serial
            `library.id` is not in it. Optional and nullable for wire
            compatibility only — absent means the producer predates
            WXYC/Backend-Service#2167, in which case `id` above still
            carries this value.
        title:
          type: string
          nullable: true
        artist:
          type: string
          nullable: true
        call_letters:
          type: string
          nullable: true
        artist_call_number:
          type: integer
          nullable: true
        release_call_number:
          type: integer
          nullable: true
        genre:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        alternate_artist_name:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        on_streaming:
          type: boolean
          nullable: true
        call_number:
          type: string
          description: Computed call number (e.g. "Rock CD S 1/1")
        library_url:
          type: string
          description: >
            Per-release dj.wxyc.org permalink for this release. Points at the dj-site
            legacy front door `/dashboard/album/legacy/{id}`, whose `{id}` segment is
            the `legacy_release_id` above — not this row's `id`, which the proxy
            re-map (WXYC/Backend-Service#2168) moves into Backend's serial space. The
            front door resolves that legacy id to the canonical release route
            server-side and 308-redirects. Null when unavailable.
        matched_via:
          type: array
          items:
            $ref: '#/components/schemas/TrackMatchHint'
          description: >
            Populated when a track-title match drove this release into the results
            (catalog-track-search plan §5.1). Empty or absent when the release matched
            on artist / title normally. Backward-compatible — existing consumers ignore
            the field.
        matched_via_alias:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMatchHint'
          description: >
            Sibling to `matched_via`. Reserved for the day LML composes
            artist-alias hits itself; not produced in v1 of the
            artist-search-alias plan (BS-local cache only). Optional and
            backward-compatible.

    LibrarySearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySearchItem'
        total:
          type: integer
        query:
          type: string
          nullable: true

    # ============================
    # Streaming Check Types
    # ============================

    StreamingCheckRequest:
      type: object
      required:
        - artist
        - title
      properties:
        artist:
          type: string
          description: Artist name to search for
        title:
          type: string
          description: Album title to search for

    StreamingSourceMatch:
      type: object
      description: A match found on a single streaming service.
      required:
        - url
        - confidence
      properties:
        url:
          type: string
          description: URL to the matched album on the service
        confidence:
          type: number
          description: Match confidence score (0-100)

    StreamingCheckSources:
      type: object
      description: Per-service streaming match results.
      properties:
        spotify:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StreamingSourceMatch'
        deezer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StreamingSourceMatch'
        apple_music:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StreamingSourceMatch'
        bandcamp:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StreamingSourceMatch'

    StreamingCheckResponse:
      type: object
      required:
        - on_streaming
        - sources
      properties:
        on_streaming:
          type: boolean
          nullable: true
          description: |
            True if found on any service, false if all services confirmed absent (no errors),
            null if inconclusive — either no services checked OR at least one service raised
            an error (see `errored_sources`). Treat null as "do not persist" / "retry later".
        sources:
          $ref: '#/components/schemas/StreamingCheckSources'
        errored_sources:
          type: array
          items:
            type: string
          description: |
            Names of services whose check raised an exception (transient network/rate-limit/
            scraping failure). Empty when every dispatched check completed without raising.
            When non-empty, callers should consider the listed services unchecked and may
            schedule a selective retry. Independent of `on_streaming`: a service can both
            match (populating `sources.<service>`) and other services can error.

    # ===================
    # Proxy / Config Types
    # ===================

    AppConfig:
      type: object
      required:
        - posthogApiKey
        - posthogHost
        - requestOMaticUrl
        - apiBaseUrl
      properties:
        posthogApiKey:
          type: string
          description: PostHog analytics write key (public by design)
        posthogHost:
          type: string
          description: PostHog ingestion host
        requestOMaticUrl:
          type: string
          description: Request-o-matic service URL for song requests
        apiBaseUrl:
          type: string
          description: Backend API base URL
        donateUrl:
          type: string
          description: >
            Canonical hosted donation page URL behind the "Support the
            station" entry point. Backend-Service serves `''` — never
            `null`, never an omitted key — whenever its `DONATE_URL`
            variable is unset (WXYC/Backend-Service#2111), so a client
            MUST treat an empty string exactly as it treats an absent
            field and fall through to its own fallback destination. That
            empty-string wire value is also why this carries no
            `format: uri`: `''` is a legitimate value here and would fail
            uri validation. An enabled entry point with an empty or
            otherwise unusable URL is a reachable server state, because
            `DONATE_URL` and `DONATE_ENABLED` are independent variables
            on one deploy — `donateEnabled` governs visibility alone and
            never implies this field is usable. A client that cannot
            resolve a usable destination from this field or from its own
            fallback MUST NOT render the entry point.
        donateEnabled:
          type: boolean
          description: >
            Whether clients should render the donate entry point. `false`
            hides it. The field carries no schema-level `default` on
            purpose, for the same reason as
            `BulkResolveLibrariesRequest.include_tracks`:
            `openapi-typescript` emits a default-bearing property as
            non-optional even when it is absent from `required`, which
            would arm the very decode-failure cascade both donate fields
            are kept optional to avoid. Absent therefore means "the
            producer predates this field", and each client applies its
            own bootstrap default — absence is NOT a kill switch and MUST
            NOT be read as one, so a client whose own default is "show"
            owns the validity of its fallback destination for that
            window. `false` is likewise a deploy-time switch rather than
            an instant one: `GET /config` is served
            `Cache-Control: public, max-age=3600` and clients may cache
            the decoded config for the life of a process, so an entry
            point can keep rendering for an hour or more after the
            variable flips. Anything needing a faster kill than that
            belongs at the destination, not here.

    AppSecrets:
      type: object
      required:
        - discogsApiKey
        - discogsApiSecret
      properties:
        discogsApiKey:
          type: string
          description: >
            Discogs API consumer key, for clients that call Discogs
            directly. Backend-Service serves an empty string (`''`) — never
            `null`, never an omitted key — whenever its `DISCOGS_API_KEY`
            variable is unset (WXYC/wxyc-shared#348 records the
            provenance; the Backend-Service handler falls back
            `process.env.DISCOGS_API_KEY || ''`), the same fallback shape
            `AppConfig.donateUrl` documents. Unlike `donateUrl`, there is
            no client-side substitute for a missing credential: a client
            that reads `''` here cannot call Discogs directly and must
            fall back to a server-proxied path instead. Both fields stay
            `required` because the handler always emits both keys via that
            fallback, so a spec-conformant producer never omits either;
            should a future producer ever omit one anyway, a strict
            consumer's decode of the whole `AppSecrets` object fails,
            which is the intended trade — a torn set of credentials (one
            present, one silently missing) is worse than a whole-object
            decode failure at the decode site. In practice that surfaces
            as a logged decode error and a degraded (server-proxied)
            Discogs path, not a crash — but it is still a diagnosable
            deploy misconfiguration, where half a credential pair would
            fail only at Discogs's door with an opaque 401.
        discogsApiSecret:
          type: string
          description: >
            Discogs API consumer secret, for clients that call Discogs
            directly. Same empty string (`''`) wire value when unset as
            `discogsApiKey` (`process.env.DISCOGS_API_SECRET || ''`) and
            the same required-together rationale: this field only carries
            meaning paired with `discogsApiKey`, so both are `required`
            and a producer omitting either arms a decode failure by
            design rather than a client silently attempting a call with
            half a credential pair.

    TrackListItem:
      type: object
      required:
        - position
        - title
      properties:
        position:
          type: string
          description: Track position (e.g. "1", "A1")
        title:
          type: string
          description: Track title
        duration:
          type: string
          description: Track duration (e.g. "5:23")

    CriticReviewItem:
      type: object
      required:
        - source
        - url
        - snippet
      properties:
        source:
          type: string
          description: Publication name (e.g. "The Quietus")
        url:
          type: string
          description: Link to the original review on the publisher's site (mandatory link-out)
        snippet:
          type: string
          description: Short attributed excerpt (<= ~300 chars); never the full review body
        author:
          type: string
          description: Review author, when available
        publishedDate:
          type: string
          description: Review publication date when available (e.g. "2024-03-15")
        rating:
          type: string
          description: Source-native rating string when available (e.g. "8.0")

    WxycReviewItem:
      type: object
      required:
        - review
      properties:
        review:
          type: string
          description: The DJ review body
        artistBlurb:
          type: string
          description: Reviewer-written artist background, when provided
        recommendedTracks:
          type: string
          description: Raw recommended-tracks text, including the form's "!"-rating notation
        buzzwords:
          type: string
          description: Comma-separated descriptors chosen by the reviewer
        submittedDate:
          type: string
          description: Form submission date when available (e.g. "2024-03-15")

    AlbumMetadataResponse:
      type: object
      description: >-
        Response body for `GET /proxy/metadata/album`. Two tiers of field share
        one flat wire shape, with no `base`/`enriched` wrapper to tell them
        apart.


        **Base** — durable Backend-Service state, never an upstream read
        (WXYC/Backend-Service#1827). Six fields in the handler. Three are
        declared here — `recordLabel`, `labelId`, `metadataStatus`, resolved
        from the linked flowsheet row. The other three are emitted but not yet
        declared: `artistName`, `releaseTitle` and `trackTitle`, echoed
        straight back from the request and therefore present on every
        response, including one where every upstream call failed
        (`artistName` unconditionally, the other two whenever the caller
        supplied them). Contracting those three is follow-up work on
        wxyc-shared#318 — read their absence from this schema as undeclared,
        not as unemitted.


        **Enriched** — `artworkUrl`, `discogsUrl`, `genres`, `label`, the
        streaming URLs and the rest, resolved from Discogs via
        library-metadata-lookup.


        The split is the guarantee: a library-metadata-lookup timeout can blank
        every enriched field but can never blank a base one.


        **Freshness caveat — the base fields are memoized, so they are not
        re-read per request.** The handler memoizes the assembled response for
        1h (WXYC/Backend-Service#988), keyed on the normalized
        `(artistName, releaseTitle, trackTitle)` plus the critic-reviews flag
        bit. Only the three request-echoed fields are excluded from the cached
        value; `recordLabel`, `labelId` and `metadataStatus` are part of it. A
        cache hit short-circuits the flowsheet read entirely, so these three
        describe the linked row as it was when the entry was written rather
        than as it is now. Two consequences worth designing around: for up to
        an hour after a DJ links a previously free-text play, the response can
        still omit all three even though a linked row now exists; and a
        librarian's label correction can be shadowed by the old `recordLabel`
        for the same window. `metadataStatus` is bounded more tightly than its
        two siblings — a `pending` or `enriching` snapshot is never memoized
        (WXYC/Backend-Service#1893), so a cached value is always one of the
        three terminal states. None of this weakens the tier guarantee above:
        an upstream failure still cannot blank a base field. It bounds a
        different property — recency, not presence-on-failure.
      properties:
        # ── Base fields (WXYC/Backend-Service#1827) ────────────────────────
        # Local-first: sourced from the linked flowsheet row via
        # selectLinkedFlowsheetRow, never from Discogs/LML. All three are
        # conditionally assigned in the handler, so all three are optional.
        recordLabel:
          type: string
          description: >-
            Local-first base field. The catalog record label Backend-Service
            wrote onto the flowsheet row at play time (`flowsheet.record_label`),
            read back off the linked flowsheet row — durable BS state, never a
            Discogs/LML read. Distinct from `label`, which is the Discogs
            *release* label; the two carry genuinely different values with
            different provenance and must not be merged, because collapsing
            them would make the catalog label blankable by an upstream timeout.
            Omitted in three cases: the key resolved to no linked flowsheet row
            (a free-text entry that never linked to an `album_id` has no local
            source for it); the resolved row's `record_label` was null or
            empty; or the response was served from the 1h memo and the entry
            was written under either of those conditions — see this schema's
            freshness caveat, which also covers the stale-value case where a
            memoized `recordLabel` outlives a librarian's correction.
        labelId:
          type: integer
          description: >-
            Local-first base field. Backend-Service's `label` table id for
            `recordLabel`, read off the same linked flowsheet row
            (`flowsheet.label_id`). Lets a client join to the catalog label
            record instead of string-matching the name. Omitted in the same
            three cases as `recordLabel`: no linked flowsheet row resolved, the
            resolved row's `label_id` was null, or the response came from the
            1h memo of a request where one of those held. Presence is
            independent of `recordLabel`'s — the handler tests the two columns
            separately, so a row can supply one without the other.
        metadataStatus:
          allOf:
            - $ref: '#/components/schemas/MetadataStatus'
          description: >-
            Local-first base field. A faithful echo of the linked flowsheet
            row's `metadata_status` column — the same enrichment-lifecycle
            value the V2 flowsheet feed reports for that row, which is why it
            shares the `MetadataStatus` schema rather than restating the
            literals (the two must move together). It reports the row's stored
            state; the terminal-vs-non-terminal interpretation belongs to the
            client (WXYC/wxyc-ios-64#685). Omitted only when the key resolved
            to no linked flowsheet row, or when the response came from the 1h
            memo of such a request. Unlike `recordLabel` and `labelId`, it is
            never omitted for an empty column: `flowsheet.metadata_status` is
            `NOT NULL DEFAULT 'pending'` in Backend-Service, so a linked row
            always carries a value. A memoized value is additionally always
            terminal — non-terminal snapshots are excluded from the memo
            (WXYC/Backend-Service#1893) — so a `pending` or `enriching` reading
            here is always freshly read, never a stale echo.
        # ── Enriched fields (Discogs via library-metadata-lookup) ──────────
        discogsReleaseId:
          type: integer
          description: Discogs release ID
        discogsUrl:
          type: string
          description: Discogs release page URL
        releaseYear:
          type: integer
          description: Release year from Discogs
        artworkUrl:
          type: string
          description: Album artwork image URL
        genres:
          type: array
          items:
            type: string
          description: Discogs genre classifications
        styles:
          type: array
          items:
            type: string
          description: Discogs style classifications (more specific than genres)
        label:
          type: string
          description: >-
            Primary label on the Discogs *release*, from the cached
            `album_metadata` row or an LML fallthrough. Enriched, not base:
            absent when the upstream lookup fails, and still null on
            `album_metadata` rows enriched before WXYC/Backend-Service#1336
            (see WXYC/Backend-Service#1442). Not the same field as
            `recordLabel`, which is the catalog label from the linked
            flowsheet row and survives an upstream failure.
        discogsArtistId:
          type: integer
          description: Discogs artist ID, for linking to artist metadata
        fullReleaseDate:
          type: string
          description: Full release date when available (e.g. "2024-03-15")
        tracklist:
          type: array
          items:
            $ref: '#/components/schemas/TrackListItem'
          description: Release tracklist
        criticReviews:
          type: array
          items:
            $ref: '#/components/schemas/CriticReviewItem'
          description: Attributed external critic-review snippets, each linking out to the original
        wxycReviews:
          type: array
          items:
            $ref: '#/components/schemas/WxycReviewItem'
          description: Consented WXYC DJ album reviews (social_consent = true) for this album. Reviewer identity is never included.
        spotifyUrl:
          type: string
          description: Spotify URL for the album or track
        appleMusicUrl:
          type: string
          description: Apple Music URL for the album or track
        youtubeMusicUrl:
          type: string
          description: YouTube Music search URL
        bandcampUrl:
          type: string
          description: Bandcamp search URL
        soundcloudUrl:
          type: string
          description: SoundCloud search URL
        discogsUnavailable:
          type: boolean
          description: >-
            True when a music director has marked this release as not on
            Discogs; downstream render surfaces should suppress
            Discogs-derived artwork/links/tracklist. Mirrors the `Album`
            schema's MD-set marker (WXYC/wiki plans/rotation-discogs-unavailable.md).
        discogsUnavailableNote:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text reason for `discogsUnavailable`.
        lastDiscogsRecheckAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Stamped on every recheck attempt by the
            `library-discogs-unavailable-recheck` cron. Read-only from the
            client side.

    ArtistMetadataResponse:
      type: object
      properties:
        discogsArtistId:
          type: integer
          description: Discogs artist ID
        bio:
          type: string
          description: Artist biography from Discogs
        wikipediaUrl:
          type: string
          description: Wikipedia URL for the artist
        imageUrl:
          type: string
          description: Artist image URL from Discogs
        bioTokens:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DiscogsResolvedToken'
          description: >
            Pre-parsed structured tokens from the artist's Discogs profile
            markup. Pass-through of DiscogsArtistDetails.profile_tokens, so
            clients can share token rendering across the two payloads.

    ArtworkSearchResponse:
      type: object
      properties:
        artworkUrl:
          type: string
          nullable: true
          description: Best-match artwork image URL
        source:
          type: string
          nullable: true
          description: Provider that supplied the artwork (e.g. "discogs")
        confidence:
          type: number
          format: double
          description: Confidence score of the match (0-1)

    EntityResolveResponse:
      type: object
      required:
        - name
        - type
        - id
      properties:
        name:
          type: string
          description: Entity name
        type:
          type: string
          enum:
            - artist
            - release
            - master
          description: Discogs entity type
        id:
          type: integer
          description: Discogs entity ID

    SpotifyTrackResponse:
      type: object
      required:
        - title
        - artist
        - album
      properties:
        title:
          type: string
          description: Track title
        artist:
          type: string
          description: Primary artist name
        album:
          type: string
          description: Album name
        artworkUrl:
          type: string
          nullable: true
          description: Album artwork URL from Spotify

    LiveFsUpdateEvent:
      description: >
        SSE event emitted on the `live-fs-topic` when an enrichment-worker (BS#892)
        finalizes the metadata for a flowsheet row. Payload carries the
        client-facing flowsheet row (the `FlowsheetEntryResponse` fields) so a
        newly-mounted client (e.g. a /live viewer that just opened the page) can
        surface the post-enrichment fields (`artwork_url`, `release_year`, ...)
        without a follow-up GET. The `live-fs-topic` is anonymous, so Backend
        projects the raw CDC row through its client-facing allow-list (BS#1534)
        — internal columns (`search_doc`, `composer`, `legacy_*`, ...) do not
        ride this stream. Provider:
        Backend-Service/apps/backend/services/metadata-broadcast/metadata-broadcast.ts
        (`filterMetadataUpdate`). Consumer: dj-site `live-updates-listener.ts`.
        Contract: `CONTRACTS.LIVE_FS_UPDATE_INCLUDES_FULL_ROW`.
      type: object
      required:
        - type
        - payload
        - timestamp
      properties:
        type:
          type: string
          enum: [update]
        payload:
          $ref: '#/components/schemas/FlowsheetEntryResponse'
        timestamp:
          type: string
          format: date-time

    LiveFsRefetchEvent:
      description: >
        SSE event emitted on the `live-fs-topic` when bulk state changes (ETL
        runs, schema migrations) make targeted patches impractical. Consumers
        respond with a coarse cache invalidation. `payload.source` is a free-text
        label for telemetry only (`etl`, `migration`, etc.) — clients must not
        branch on it.
      type: object
      required:
        - type
        - payload
        - timestamp
      properties:
        type:
          type: string
          enum: [refetch]
        payload:
          type: object
          required:
            - source
          properties:
            source:
              type: string
              description: Free-text label naming the upstream cause (telemetry only).
        timestamp:
          type: string
          format: date-time

    LiveFsInsertEvent:
      description: >
        SSE event emitted on the `live-fs-topic` the instant a new flowsheet row
        is created (BS#1888), before enrichment runs. Payload carries the same
        client-facing flowsheet row (`FlowsheetEntryResponse`) as
        `LiveFsUpdateEvent`, but at insert time the row is `metadata_status:
        'pending'` with the enrichment fields (`artwork_url`, `release_year`,
        `discogs_url`, ...) still null — all of which `FlowsheetEntryResponse`
        already models as nullable, so a not-yet-enriched row is valid. A
        subscriber appends the row immediately; the enrichment fields arrive
        seconds later as the existing `LiveFsUpdateEvent`. Same anonymous
        `live-fs-topic` allow-list projection as `update` (BS#1534) — internal
        columns (`search_doc`, `composer`, `legacy_*`, ...) do not ride this
        stream. Removes Epic C's ([WXYC/Backend-Service#877]) polling latency
        floor: consumers (WXYC/wxyc-ios-64#269, dj-site) learn of a new track on
        the SSE push instead of the next reconciliation poll.
      type: object
      required:
        - type
        - payload
        - timestamp
      properties:
        type:
          type: string
          enum: [insert]
        payload:
          $ref: '#/components/schemas/FlowsheetEntryResponse'
        timestamp:
          type: string
          format: date-time

    LiveFsEvent:
      description: >
        Discriminated union of events emitted on the `live-fs-topic`. Every
        event has the same `{ type, payload, timestamp }` envelope — pinned by
        `CONTRACTS.LIVE_FS_EVENT_ENVELOPE_SHAPE`.
      oneOf:
        - $ref: '#/components/schemas/LiveFsUpdateEvent'
        - $ref: '#/components/schemas/LiveFsRefetchEvent'
        - $ref: '#/components/schemas/LiveFsInsertEvent'
      discriminator:
        propertyName: type
        mapping:
          update: '#/components/schemas/LiveFsUpdateEvent'
          refetch: '#/components/schemas/LiveFsRefetchEvent'
          insert: '#/components/schemas/LiveFsInsertEvent'

    # ── Auto-DJ system ─────────────────────────────────────────────────────
    # Orchestrator <-> Arduino management channel, and the dj-site virtual
    # switch API. Source of truth: auto-dj-arduino-switch/docs/networking-spec.md
    # section 5.2. The `state` enum is reconciled to the re-architected
    # firmware's 4-state vocabulary (BOOTING/CONNECTING/CONNECTED/ERROR_STATE);
    # the Arduino is now a relay/button reporter, not a flowsheet writer.
    AutoDJState:
      type: string
      enum: [BOOTING, CONNECTING, CONNECTED, ERROR_STATE]
    AutoDJTransport:
      type: string
      enum: [ethernet, wifi]
    AutoDJCommandAction:
      type: string
      enum: [set_config, pause, resume, end_show, restart, ping]
    AutoDJErrorLevel:
      type: string
      enum: [warning, error, fatal]
    AutoDJErrorCode:
      type: string
      enum:
        - HTTP_TIMEOUT
        - JSON_PARSE
        - WIFI_DISCONNECT
        - WS_DISCONNECT
        - TLS_HANDSHAKE
        - NTP_FAIL
        - KVSTORE_WRITE
        - FLOWSHEET_POST
        - AZURACAST_POLL
    AutoDJActivationSourceType:
      type: string
      enum: [virtual_switch, button, relay]
    AutoDJRelayState:
      type: string
      enum: [auto_dj_active, dj_live]

    AutoDJLastTrack:
      type: object
      required: [artist, title, posted_at]
      properties:
        artist:
          type: string
        title:
          type: string
        posted_at:
          type: integer
          description: Unix timestamp

    AutoDJHeartbeat:
      type: object
      required:
        - type
        - state
        - transport
        - uptime_s
        - free_ram
        - firmware_version
        - config_hash
        - loop_max_ms
        - reconnect_count
        - tracks_detected
        - tracks_posted
        - errors_since_boot
      properties:
        type:
          type: string
          enum: [heartbeat]
        state:
          $ref: '#/components/schemas/AutoDJState'
        transport:
          $ref: '#/components/schemas/AutoDJTransport'
        uptime_s:
          type: integer
        wifi_rssi:
          type: integer
          nullable: true
        free_ram:
          type: integer
        radio_show_id:
          type: integer
          nullable: true
          description: Always null in the reporter model; retained for schema compatibility.
        last_track:
          $ref: '#/components/schemas/AutoDJLastTrack'
        last_error:
          type: string
          nullable: true
        firmware_version:
          type: string
        config_hash:
          type: string
        loop_max_ms:
          type: integer
        reconnect_count:
          type: integer
        tracks_detected:
          type: integer
        tracks_posted:
          type: integer
        errors_since_boot:
          type: integer
        button_press_count:
          type: integer
          description: Button presses since last heartbeat (HTTP/WiFi fallback; orchestrator toggles if odd). 0 if none.
        relay_auto_dj_active:
          type: boolean
          description: Current debounced relay level. true = relay reports auto-DJ-active (no live DJ); false = live DJ on air.

    AutoDJCommand:
      type: object
      required: [type, id, action]
      properties:
        type:
          type: string
          enum: [command]
        id:
          type: string
          description: Unique command ID for ack correlation
        action:
          $ref: '#/components/schemas/AutoDJCommandAction'
        key:
          type: string
          description: Config key (only for set_config)
        value:
          type: string
          description: Config value (only for set_config)

    AutoDJAck:
      type: object
      required: [type, id, status]
      properties:
        type:
          type: string
          enum: [ack]
        id:
          type: string
          description: The id from the command being acknowledged
        status:
          type: string
          enum: [ok, error, unknown_command]
        error:
          type: string
          description: Error message (only when status is error)
        result:
          type: object
          additionalProperties: true
          description: 'Optional result data (e.g. { active: boolean } for button_toggle acks)'

    AutoDJNowPlaying:
      type: object
      required: [type, sh_id, artist, title, album, is_live]
      properties:
        type:
          type: string
          enum: [now_playing]
        sh_id:
          type: integer
          description: AzuraCast song history ID
        artist:
          type: string
        title:
          type: string
        album:
          type: string
        is_live:
          type: boolean
          description: Whether a live DJ is streaming

    AutoDJErrorReport:
      type: object
      required: [type, level, module, code, message, state, uptime_s, free_ram, count]
      properties:
        type:
          type: string
          enum: [error]
        level:
          $ref: '#/components/schemas/AutoDJErrorLevel'
        module:
          type: string
          description: Source module (e.g. mgmt_client, relay_monitor)
        code:
          $ref: '#/components/schemas/AutoDJErrorCode'
        message:
          type: string
        state:
          $ref: '#/components/schemas/AutoDJState'
        uptime_s:
          type: integer
        free_ram:
          type: integer
        count:
          type: integer
          description: Occurrences since last report

    AutoDJButtonToggle:
      type: object
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum: [button_toggle]
        timestamp:
          type: integer
          description: Unix timestamp of the button press (from NTP)

    AutoDJWebSocketMessage:
      oneOf:
        - $ref: '#/components/schemas/AutoDJHeartbeat'
        - $ref: '#/components/schemas/AutoDJCommand'
        - $ref: '#/components/schemas/AutoDJAck'
        - $ref: '#/components/schemas/AutoDJNowPlaying'
        - $ref: '#/components/schemas/AutoDJErrorReport'
        - $ref: '#/components/schemas/AutoDJButtonToggle'
      discriminator:
        propertyName: type
        mapping:
          heartbeat: '#/components/schemas/AutoDJHeartbeat'
          command: '#/components/schemas/AutoDJCommand'
          ack: '#/components/schemas/AutoDJAck'
          now_playing: '#/components/schemas/AutoDJNowPlaying'
          error: '#/components/schemas/AutoDJErrorReport'
          button_toggle: '#/components/schemas/AutoDJButtonToggle'

    AutoDJDeviceStatus:
      type: object
      required: [connected, transport, last_heartbeat_at, firmware_version]
      properties:
        connected:
          type: boolean
        transport:
          type: string
          enum: [ethernet, wifi, none]
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        last_heartbeat:
          $ref: '#/components/schemas/AutoDJHeartbeat'
        pending_commands:
          type: integer
          description: Number of unacknowledged commands in the queue
        firmware_version:
          type: string
        device_id:
          type: string
          description: MAC address or other unique identifier

    # ── Virtual switch API (dj-site <-> orchestrator) ──────────────────────
    AutoDJActivationSource:
      type: object
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/AutoDJActivationSourceType'
        userId:
          type: string
          description: Better Auth user ID (only for virtual_switch source)
        userName:
          type: string
          description: Display name (only for virtual_switch source)
        detail:
          type: string
          description: Additional context (e.g. "Live DJ detected" for relay source)

    AutoDJCurrentTrack:
      type: object
      required: [artist, title, album, detectedAt]
      properties:
        artist:
          type: string
        title:
          type: string
        album:
          type: string
        detectedAt:
          type: string
          format: date-time

    AutoDJDeviceSummary:
      type: object
      required: [online, transport, lastHeartbeat, relayState]
      properties:
        online:
          type: boolean
        transport:
          $ref: '#/components/schemas/AutoDJTransport'
        lastHeartbeat:
          type: string
          format: date-time
        relayState:
          $ref: '#/components/schemas/AutoDJRelayState'

    AutoDJStatus:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        activatedBy:
          $ref: '#/components/schemas/AutoDJActivationSource'
        activatedAt:
          type: string
          format: date-time
        showId:
          type: integer
        currentTrack:
          allOf:
            - $ref: '#/components/schemas/AutoDJCurrentTrack'
          nullable: true
        lastDeactivatedAt:
          type: string
          format: date-time
        lastDeactivatedBy:
          $ref: '#/components/schemas/AutoDJActivationSource'
        device:
          allOf:
            - $ref: '#/components/schemas/AutoDJDeviceSummary'
          nullable: true

    AutoDJDeactivateResponse:
      type: object
      required: [active, deactivatedBy, deactivatedAt]
