  /library/info:
    get:
      x-wxyc-service: backend-service
      summary: Get album information
      description: >
        Takes exactly one release identifier, in either id space: `album_id`
        (Backend's serial `library.id`) or `legacy_release_id` (the tubafrenzy
        `LIBRARY_RELEASE.ID` that external callers hold). Neither is required
        on its own; the server returns 400 only when **both** are absent.


        `legacy_release_id` wins whenever it is *present* — the server branches
        on presence, before looking at `album_id`. That includes an empty
        `legacy_release_id=`, which takes the branch and 400s even alongside a
        valid `album_id`; a malformed value there is likewise a 400, never a
        fallback.


        The two branches now agree on a miss as well: either unmatched
        identifier is a 404. For `legacy_release_id` that means a library.db
        release not yet synced into Backend Postgres; for `album_id`, no such
        serial. Until WXYC/Backend-Service#2212 the `album_id` miss was a 200
        carrying an empty body — a shape that satisfied this operation's own
        declared 200 schema not at all, and that every consumer already routed
        to its error path.
      # Inherits the document-level BearerAuth. It used to declare `security: []`
      # while Backend served it behind `requirePermissions({ catalog: ['read'] })`
      # (library.route.ts), so a generated client omitted the Authorization
      # header and got the 401 the spec said was impossible — wxyc-shared#368.
      # Backend's own apps/backend/app.yaml already had this right: it declares
      # no operation-level security for this path.
      parameters:
        - name: album_id
          in: query
          required: false
          description: >
            Backend's serial `wxyc_schema.library.id`. Optional: supply this or
            `legacy_release_id`, not both. Parsed strictly, like the sibling
            below: a canonical positive int4. Trailing garbage (`65880xyz`),
            leading zeros, an explicit sign, whitespace, and a repeated param
            are each a 400 — never a truncated id silently resolving a
            *different real release*, which is what the bare `parseInt` here
            did before WXYC/Backend-Service#2212.
          schema:
            type: integer
        - name: legacy_release_id
          in: query
          required: false
          description: >
            The release's tubafrenzy `LIBRARY_RELEASE.ID` — Backend's
            `library.legacy_release_id` column, and the id space external
            callers hold (LML's `library_url`, the request line, the wxyc.info
            permalink). This is the inbound-compatibility front door: it is NOT
            Backend's serial `library.id`, and the two spaces are numerically
            coextensive, so passing one where the other belongs resolves a
            different real release rather than failing. Optional: supply this
            or `album_id`, not both.
          schema:
            type: integer
      responses:
        '200':
          description: Album details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetail'
        '400':
          description: >
            Both identifiers absent, or the supplied one is not a canonical
            positive int4 — trailing garbage, leading zeros, an explicit sign,
            surrounding whitespace, and a repeated param are each rejected on
            both branches.
        '404':
          description: The supplied identifier matched no catalog row

