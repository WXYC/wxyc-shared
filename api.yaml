openapi: 3.0.3
info:
  title: WXYC Backend API
  description: |
    API for managing WXYC radio station operations including flowsheets, library, DJs, and schedule.

    This is the single source of truth for all WXYC API types. Code is generated from this spec
    for TypeScript, Swift, and Kotlin consumers.

    This document spans two services. Every operation carries `x-wxyc-service`
    naming the one that serves it: `backend-service` (api.wxyc.org, including
    the `/auth/*` app on the same host) or `library-metadata-lookup` (a separate
    host, `POST /api/v1/lookup` plus the six other `/api/v1/*` operations). The
    `servers:` block below names only Backend, so without that marker
    reachability is not decidable from this document.
  version: 1.47.0
  contact:
    name: WXYC
    url: https://wxyc.org

servers:
  - url: http://localhost:{port}
    description: Local development server
    variables:
      port:
        default: '8080'
        description: Local API server port
  - url: https://api.wxyc.org
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token from Better Auth
    LMLBearerAuth:
      type: http
      scheme: bearer
      description: >
        Static bearer token for the library-metadata-lookup (LML) service.
        Configured via the `LML_API_KEY` env var on each consumer (Backend,
        request-o-matic, tubafrenzy). Distinct from `BearerAuth` (Better Auth
        JWTs); LML routes verify only this static key.

  schemas:
    # ===================
    # Common Types
    # ===================

    ApiErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100

    PaginationInfo:
      type: object
      required:
        - page
        - limit
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean

    DateTimeEntry:
      type: object
      required:
        - day
        - time
      properties:
        day:
          type: string
          description: Day string (e.g., "Monday")
        time:
          type: string
          description: Time string (e.g., "14:00")

    HealthCheckResponse:
      type: object
      description: |
        Liveness response shape for `GET /health` (and equivalent) endpoints.
        Cross-language contract owned by `wxyc-fastapi` (Python) and adopted
        by Backend-Service (Node) via generated TS types.

        `additionalProperties: true` lets services attach extra fields without
        breaking consumers; semantic-index, for example, returns `artist_count`
        alongside `status`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
          description: |
            Service-reported health. `healthy` = fully operational; `degraded`
            = serving but with reduced capability; `unhealthy` = should not
            receive traffic.
      additionalProperties: true

    ReadinessResponse:
      description: |
        Readiness response shape for `GET /ready` (and equivalent) endpoints.
        Extends `HealthCheckResponse` with a per-dependency status map.
        Each entry in `services` reports the live state of one external
        dependency (database, upstream HTTP service, queue, etc.).

        Status values:
          - `ok`          — dependency reachable and responsive
          - `unavailable` — dependency reachable but reporting an error,
                            or the connection itself failed
          - `timeout`     — dependency exceeded the readiness probe deadline
      allOf:
        - $ref: '#/components/schemas/HealthCheckResponse'
        - type: object
          required:
            - services
          properties:
            services:
              type: object
              description: Per-dependency readiness map keyed by dependency name.
              additionalProperties:
                type: string
                enum:
                  - ok
                  - unavailable
                  - timeout

    # `Genre` and `Format` used to live here as closed enums. Both were
    # transcribed from dj-site's own presentation-layer unions
    # (lib/features/catalog/types.ts, written 2025-01, a year before this file
    # existed) rather than from the database, and both carried dj-site's
    # `Unknown` UI fallback sentinel — a value neither the `genres` nor the
    # `format` table has ever held. `Genre` declared ten values while
    # production has fifteen; `Format` declared `Vinyl | CD | Unknown` while
    # the column holds `cd`, `vinyl`, `vinyl 12"`, `vinyl 7"`, `vinyl 10"`,
    # `cdr`. Neither set is closed at runtime — `POST /library/genres` and
    # `POST /library/formats` both append rows. `genre_name` is now
    # `type: string` at its three use sites and `GET /library/genres` is the
    # authoritative enumeration; a presentation-layer subset belongs in the
    # consumer, with its own fallback, not in this file. See #367.

    RotationBin:
      type: string
      enum:
        - H
        - M
        - L
        - S
      description: "Rotation bin levels: H=Heavy, M=Medium, L=Light, S=Single"

    # DayOfWeek was here (wxyc-shared#372): a closed enum of day names starting
    # Sunday, referenced only by ScheduleShift.day and
    # AddScheduleShiftRequest.day. It modelled the same `schedule.day` column as
    # the live `Schedule.day` and disagreed with it twice over — string vs
    # `{type: integer, minimum: 0, maximum: 6}`, and a week starting Sunday vs
    # one starting Monday. The database settles it: `schedule.day` is a
    # `smallint` and the schema comment reads `// days {0: mon, 1: tue, ... ,
    # 6: sun}`. Both referents now carry that integer inline, so there is one
    # model of the column and nothing left to reconcile.

    # ===================
    # Flowsheet Types
    # ===================

    FlowsheetEntryBase:
      type: object
      required:
        - id
        - play_order
        - show_id
      properties:
        id:
          type: integer
        play_order:
          type: integer
        show_id:
          type: integer

    FlowsheetEntryFields:
      description: >-
        Every non-identity field of a v1 flowsheet row. Factored out of
        `FlowsheetEntryResponse` so `FlowsheetRangeEntry` can carry the identical
        field set while relaxing `show_id` to nullable — the two response shapes
        must not drift, because iOS V2 decodes both with one decoder
        (tubafrenzy-decommissioning plan §2.5, consumer #3). Not referenced
        directly by any path; compose it with an identity block instead.
      type: object
      required:
        - request_flag
      properties:
        # Song entry fields
        album_id:
          type: integer
        track_title:
          type: string
        album_title:
          type: string
        artist_name:
          type: string
        record_label:
          type: string
        label_id:
          type: integer
        rotation_id:
          type: integer
        rotation_bin:
          $ref: '#/components/schemas/RotationBin'
        request_flag:
          type: boolean
        segue:
          type: boolean
        # Message/breakpoint fields
        message:
          type: string
        # Metadata fields (from cache)
        artwork_url:
          type: string
          nullable: true
        discogs_url:
          type: string
          nullable: true
        release_year:
          type: integer
          nullable: true
        discogsUnavailable:
          type: boolean
          description: >-
            Rides the same MD-set "not on Discogs" flag as the Album
            surfaces (see `Album.discogsUnavailable`), non-nullable to
            match them. Deliberately camelCase — unlike its snake_case
            siblings in this block — to match Backend's
            `withDiscogsUnavailableCamelCase` serializer. Contract-first:
            the V2 flowsheet album embed will carry this field once the
            BS-emit piece (WXYC/Backend-Service#1908) lands; it is not
            emitted there yet.
        discogsUnavailableNote:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text reason for `discogsUnavailable`.
        spotify_url:
          type: string
          nullable: true
        apple_music_url:
          type: string
          nullable: true
        youtube_music_url:
          type: string
          nullable: true
        bandcamp_url:
          type: string
          nullable: true
        soundcloud_url:
          type: string
          nullable: true
        artist_bio:
          type: string
          nullable: true
        artist_wikipedia_url:
          type: string
          nullable: true
        track_position:
          type: string
          nullable: true
          description: >
            Track position on the release (e.g., "A1", "B2", "5"). Populated when the
            flowsheet entry was created via the dj-site picker after release selection
            (catalog-track-search plan §5.3 / Track 3). String-typed to match Discogs's
            `release_track.position`. Null for free-text entries and legacy rows.
        metadata_status:
          $ref: '#/components/schemas/MetadataStatus'
        # Projection-parity fields (BS#1513 / BS#1534). These ride the
        # flowsheet mutation echoes and the liveFs:update SSE payload via
        # Backend's CLIENT_FACING_FLOWSHEET_COLUMNS allow-list, but were
        # previously undeclared here. Optional: absent/nullable on some rows.
        entry_type:
          $ref: '#/components/schemas/FlowsheetEntryType'
        add_time:
          type: string
          format: date-time
          description: The instant this row was logged (ISO 8601).
        radio_hour:
          type: string
          format: date-time
          nullable: true
          description: >-
            Top-of-hour a breakpoint row marks (ISO 8601), sourced from
            tubafrenzy's RADIO_HOUR. Null on non-breakpoint rows and rows
            predating the producer rollout. Mirrors the V2 breakpoint entry.
        dj_name:
          type: string
          nullable: true
          description: >-
            Resolved public display name of the DJ on the row's show. Nullable
            per the PII-safe resolution chain (BS#1371): user.djName ->
            shows.legacy_dj_name -> null; never the real-name PII column.

    FlowsheetEntryResponse:
      description: Flowsheet entry as returned by the API with all possible fields
      allOf:
        - $ref: '#/components/schemas/FlowsheetEntryBase'
        - $ref: '#/components/schemas/FlowsheetEntryFields'

    FlowsheetRangeEntryBase:
      description: >-
        Identity block for `GET /flowsheet/range`. Identical to
        `FlowsheetEntryBase` except that `show_id` is nullable — see that
        property's description. Kept separate rather than relaxing
        `FlowsheetEntryBase` in place so the other flowsheet paths' documented
        shapes are untouched by this endpoint.
      type: object
      required:
        - id
        - play_order
        - show_id
      properties:
        id:
          type: integer
        play_order:
          type: integer
        show_id:
          type: integer
          nullable: true
          description: >-
            The show this entry belongs to, or `null` for an **unattributed**
            entry — a row that exists with no linked show. 20 of 2,619,011 rows
            are in that state (2005-02-06 → 2026-04-21), and the Phase 0 audit
            for the tubafrenzy decommissioning decided against backfilling them,
            so this endpoint returns them rather than dropping them. Consumers
            that group entries by show must render an unattributed bucket; they
            must not assume every entry joins to a member of `shows`, and must
            not crash on the null. The key is always present.

    FlowsheetRangeEntry:
      description: >-
        A flowsheet row as returned by `GET /flowsheet/range`. Carries the exact
        field set of `FlowsheetEntryResponse` (both compose
        `FlowsheetEntryFields`) and differs from it in one respect: `show_id` is
        nullable. Field parity is a contract requirement, not a coincidence —
        iOS V2 decodes this endpoint and `GET /flowsheet` with a single decoder
        (tubafrenzy-decommissioning plan §2.5, consumer #3).
      allOf:
        - $ref: '#/components/schemas/FlowsheetRangeEntryBase'
        - $ref: '#/components/schemas/FlowsheetEntryFields'

    FlowsheetRangeShow:
      description: >-
        Show metadata for one show overlapping a `GET /flowsheet/range` window.
        A deliberately public-safe projection of the `shows` row: it carries the
        DJ's public handle but no user id and no real-name column. Distinct from
        `Show`, which exposes `primary_dj_id` and is used on authenticated
        surfaces.
      type: object
      required:
        - id
        - start_time
      properties:
        id:
          type: integer
          description: >-
            Matches `FlowsheetRangeEntry.show_id` for every entry belonging to
            this show.
        show_name:
          type: string
          nullable: true
          description: Specialty-show name, or `null` for a regular show.
        dj_name:
          type: string
          nullable: true
          description: >-
            Resolved public display name of the show's DJ. Same PII-safe
            resolution chain as `FlowsheetEntryFields.dj_name` (BS#1371):
            per-show override -> `user.djName` -> `shows.legacy_dj_name`
            (tubafrenzy's `DJ_HANDLE`) -> null. Never the real-name column.
        specialty_id:
          type: integer
          nullable: true
        start_time:
          type: string
          format: date-time
          description: When the DJ signed on (ISO 8601).
        end_time:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the DJ signed off (ISO 8601), or `null`. Null has **two**
            causes and they are not distinguishable from this field alone: the
            show is genuinely on the air, or its `show_end` delivery was
            dropped and the column stayed null permanently (nothing re-closes
            it on a schedule). Do not render a null `end_time` as "on air now";
            compare `start_time` against the present, or read the `show_end`
            marker row in `entries`, which is the second independent signal.

    FlowsheetRangeResponse:
      description: >-
        Response body of `GET /flowsheet/range`. `shows` is a deliberate
        superset: consumers that only need the entry stream (which carries
        inline `show_start` / `show_end` markers in `entry_type`) can ignore it.
      type: object
      required:
        - shows
        - entries
      properties:
        shows:
          type: array
          description: >-
            Every show overlapping the window, ordered by `start_time` ascending.
            Empty when the window contains no shows.
          items:
            $ref: '#/components/schemas/FlowsheetRangeShow'
        entries:
          type: array
          description: >-
            Every flowsheet row in the window, ordered by `add_time` ascending
            and tie-broken on `id` — NOT by `play_order`, which is per-show and
            interleaves a multi-show window (see the endpoint description).
            Includes the `show_start` / `show_end` marker rows. Those markers
            are a convenience, not a guarantee: a show whose `show_end`
            delivery was dropped has no closing marker (the same failure that
            leaves `FlowsheetRangeShow.end_time` null), so a consumer that
            segments purely on markers will run one show's entries into the
            next. Segment on `show_id` and treat the markers as labels.
          items:
            $ref: '#/components/schemas/FlowsheetRangeEntry'

    FlowsheetSongEntry:
      description: Song entry in the flowsheet
      allOf:
        - $ref: '#/components/schemas/FlowsheetEntryBase'
        - type: object
          required:
            - track_title
            - artist_name
            - album_title
            - record_label
            - request_flag
          properties:
            track_title:
              type: string
            artist_name:
              type: string
            album_title:
              type: string
            record_label:
              type: string
            label_id:
              type: integer
            request_flag:
              type: boolean
            segue:
              type: boolean
            album_id:
              type: integer
            rotation_id:
              type: integer
            rotation_bin:
              $ref: '#/components/schemas/RotationBin'
            track_position:
              type: string
              nullable: true
              description: >
                Track position on the release (e.g., "A1", "B2", "5"). Optional;
                populated by the dj-site picker when a release with a resolvable
                tracklist is chosen (catalog-track-search plan §5.3 / Track 3).
                Free-text `track_title` remains the source of truth; this field is
                additive metadata for future enrichment + analytics.

    FlowsheetShowBlockEntry:
      description: Show block entry (start or end of a DJ's show)
      allOf:
        - $ref: '#/components/schemas/FlowsheetEntryBase'
        - $ref: '#/components/schemas/DateTimeEntry'
        - type: object
          required:
            - dj_name
            - isStart
          properties:
            dj_name:
              type: string
            isStart:
              type: boolean

    FlowsheetMessageEntry:
      description: Message entry (talkset, etc.)
      allOf:
        - $ref: '#/components/schemas/FlowsheetEntryBase'
        - type: object
          required:
            - message
          properties:
            message:
              type: string

    FlowsheetBreakpointEntry:
      description: Breakpoint entry (marks time boundaries)
      allOf:
        - $ref: '#/components/schemas/FlowsheetMessageEntry'
        - $ref: '#/components/schemas/DateTimeEntry'

    FlowsheetCreateSongFromCatalog:
      type: object
      required:
        - album_id
        - track_title
        - request_flag
      properties:
        album_id:
          type: integer
        track_title:
          type: string
        track_position:
          type: string
          description: >
            Track position on the release (e.g., "A1", "B2", "5", "1-12"). Written
            by the dj-site flowsheet picker (catalog-track-search plan §5.3 / Track 3)
            when the DJ selects a track from the resolved release. Omitted when
            the DJ enters a free-text track_title without a tracklist lookup.
            String-typed to match Discogs's `release_track.position` (vinyl
            side notation, multi-disc prefixes).
        rotation_id:
          type: integer
        request_flag:
          type: boolean
        segue:
          type: boolean
        record_label:
          type: string

    FlowsheetCreateSongFreeform:
      type: object
      required:
        - artist_name
        - album_title
        - track_title
        - request_flag
      properties:
        artist_name:
          type: string
        album_title:
          type: string
        track_title:
          type: string
        request_flag:
          type: boolean
        segue:
          type: boolean
        record_label:
          type: string
        label_id:
          type: integer
        rotation_id:
          type: integer
          description: >
            Rotation linkage for a track on a rotation album that isn't in the
            WXYC library catalog (BS#1308). The Backend snapshot/else branch
            persists `rotation_id` alongside `album_id IS NULL` so the V2 read
            path can JOIN back to `rotation` for `rotation_bin` and the iOS
            rotation-artwork resolver can find the entry. `rotation_bin` is
            derived on read and intentionally not declared here.
        track_position:
          type: string
          description: >
            Track position on the release (e.g., "A1", "B2", "5", "1-12"), for
            an LML-only row with no library linkage (routed onto this
            album_id-less branch). Carries the Discogs `release_track.position`
            straight through — BS's `buildSnapshotFieldsEntry` already
            persists `body.track_position ?? null` on the same allowlist that
            sets `album_id: null`. String-typed to match Discogs's
            `release_track.position` (vinyl side notation, multi-disc
            prefixes).

    FlowsheetCreateMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        entry_type:
          type: string
          enum: [talkset, breakpoint, message]
          description: Explicit entry type. If omitted, the backend infers from message content.

    FlowsheetUpdateRequest:
      type: object
      properties:
        track_title:
          type: string
        track_position:
          type: string
          description: >
            Track position on the release (e.g., "A1", "B2", "5", "1-12"). Set
            when re-picking a track via the flowsheet picker; cleared (omitted)
            when a DJ edits the entry to a free-text track_title. String-typed
            to match Discogs's `release_track.position`.
        artist_name:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        label_id:
          type: integer
        request_flag:
          type: boolean
        segue:
          type: boolean

    FlowsheetQueryParams:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        start_id:
          type: integer
        end_id:
          type: integer
        shows_limit:
          type: integer

    PlaylistSearchParams:
      type: object
      properties:
        q:
          type: string
          description: Search query (supports AND, OR, NOT, "", *)
        page:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        sort:
          type: string
          enum:
            - date
            - artist
            - song
            - dj
          default: date
        order:
          type: string
          enum:
            - asc
            - desc
          default: desc

    PlaylistSearchResult:
      type: object
      required:
        - id
        - play_date
        - artist_name
        - track_title
        - album_title
        - record_label
        - dj_name
        - show_id
      properties:
        id:
          type: integer
        play_date:
          type: string
          format: date-time
        artist_name:
          type: string
        track_title:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        dj_name:
          type: string
        show_id:
          type: integer

    PlaylistSearchResponse:
      type: object
      required:
        - results
        - total
        - page
        - totalPages
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistSearchResult'
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer

    LibraryQueryResponse:
      type: object
      required:
        - results
        - total
        - page
        - totalPages
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AlbumSearchResult'
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer

    # ===================
    # Flowsheet V2 Types (Discriminated Union)
    # ===================

    FlowsheetEntryType:
      type: string
      enum:
        - track
        - show_start
        - show_end
        - dj_join
        - dj_leave
        - talkset
        - breakpoint
        - message
      description: Discriminator for V2 flowsheet entry types

    FlowsheetV2Base:
      type: object
      description: Base fields shared by all V2 flowsheet entries
      required:
        - id
        - show_id
        - play_order
        - add_time
        - entry_type
      properties:
        id:
          type: integer
        show_id:
          type: integer
          nullable: true
        play_order:
          type: integer
        add_time:
          type: string
          format: date-time

    FlowsheetV2TrackEntry:
      description: V2 track entry - a song that was played
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - request_flag
          properties:
            entry_type:
              type: string
              enum: [track]
            album_id:
              type: integer
              nullable: true
            rotation_id:
              type: integer
              nullable: true
            artist_id:
              type: integer
              nullable: true
              description: >
                The played release's resolved WXYC catalog artist id
                (`flowsheet.album_id → library.artist_id`), computed
                server-side on the same join that powers `upcoming_show`.
                Shares the catalog artist-id keyspace with
                `Concert.headlining_artist_id` and `SimilarArtist.artist_id`,
                so on-device features — the On Tour likes match — can
                intersect a liked playcut's artist against concert headliners
                and their affinity neighbors in one id space.


                Null for free-form entries (no `album_id`) and for library
                rows whose album has no linked artist. Additive and optional:
                older app builds that don't decode it are unaffected.
            artist_name:
              type: string
              nullable: true
            album_title:
              type: string
              nullable: true
            track_title:
              type: string
              nullable: true
            track_position:
              type: string
              nullable: true
              description: >
                Track position on the release (e.g., "A1", "B2", "5", "1-12"). Set
                by the dj-site flowsheet picker (catalog-track-search plan §5.3 /
                Track 3) when the DJ selected a track from the resolved release, or
                supplied directly on a freeform (LML-only) entry; null when the DJ
                entered a free-text track_title without a tracklist lookup.
                String-typed to match Discogs's `release_track.position`.
            record_label:
              type: string
              nullable: true
            request_flag:
              type: boolean
            segue:
              type: boolean
            rotation_bin:
              $ref: '#/components/schemas/RotationBin'
            artwork_url:
              type: string
              nullable: true
            discogs_url:
              type: string
              nullable: true
            release_year:
              type: integer
              nullable: true
            spotify_url:
              type: string
              nullable: true
            apple_music_url:
              type: string
              nullable: true
            youtube_music_url:
              type: string
              nullable: true
            bandcamp_url:
              type: string
              nullable: true
            soundcloud_url:
              type: string
              nullable: true
            artist_bio:
              type: string
              nullable: true
            artist_wikipedia_url:
              type: string
              nullable: true
            on_streaming:
              type: boolean
              nullable: true
              description: Whether this album is available on streaming platforms. False means WXYC library exclusive. Null if unknown.
            metadata_status:
              $ref: '#/components/schemas/MetadataStatus'
            genres:
              type: array
              nullable: true
              items:
                type: string
              description: Discogs genre tags surfaced on the Playcut Detail card.
            styles:
              type: array
              nullable: true
              items:
                type: string
              description: Discogs style tags (finer-grained than genres).
            upcoming_show:
              allOf:
                - $ref: '#/components/schemas/Concert'
              nullable: true
              description: >
                An optional embedded upcoming Triangle-area concert whose
                headliner is this track's resolved catalog artist, attached
                server-side at feed-assembly time so the iOS "On Tour"
                Box Office CTA renders inline with no second round-trip.


                Match rule (mirrors `GET /concerts?curated=true`): the track's
                resolved artist — `flowsheet.album_id → library.artist_id` — is
                matched against `concerts.headlining_artist_id` on curated,
                non-tombstoned, upcoming rows (`headlining_artist_id IS NOT
                NULL`, `removed_at IS NULL`, `starts_on >= today`
                America/New_York). When an artist has several upcoming dates
                the **soonest** wins (`ORDER BY starts_on ASC LIMIT 1`), so at
                most one concert rides each playcut.


                Absent/null when the track has no resolved artist (free-form
                entries with no `album_id`, or an `album_id` whose library row
                has no matched artist) or when that artist has no curated
                upcoming date. The field is additive and optional — older app
                builds that don't decode it are unaffected. Reuses the
                `Concert` schema verbatim so iOS decodes one type across the
                On Tour tab and the playcut CTA; the
                `BoxOfficeTicketPresenter` reads `id`, `title` /
                `headlining_artist_raw`, `venue` (name + city), `starts_on`,
                `doors_at`, `status`, `price_min` / `price_max`, `ticket_url`,
                and `image_url` off it.
            critic_reviews:
              type: array
              items:
                $ref: '#/components/schemas/CriticReviewItem'
              description: >
                An optional array of attributed external critic-review
                snippets for this track's resolved album, attached
                server-side at feed-assembly time so the iOS Reviews card can
                render inline for enriched playcuts with no second
                round-trip — iOS skips the `/proxy/metadata/album` fetch for
                terminal rows (wxyc-ios-64#685/#691).


                Populated only on `track` entries whose linked `album_id` has
                rows in Backend-Service's `album_critic_reviews` table;
                attached via one batched query per page (no per-row
                lookups). Capped at 5 items (`CRITIC_REVIEWS_LIMIT`), ordered
                `published_at DESC NULLS LAST`. Absent — never `null` or
                empty — when the track has no matching album, when the
                attach is skipped, or on servers where Backend's
                `CRITIC_REVIEWS_ENABLED` env flag (ADR 0012) is off,
                including older servers that predate this field. Reuses the
                `CriticReviewItem` schema verbatim — the same shape
                `AlbumMetadataResponse.criticReviews` already serves — so
                clients decode one type across both surfaces.

    FlowsheetV2ShowStartEntry:
      description: V2 show start event - when a show begins
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - dj_name
            - timestamp
          properties:
            entry_type:
              type: string
              enum: [show_start]
            dj_name:
              type: string
            timestamp:
              type: string
              format: date-time

    FlowsheetV2ShowEndEntry:
      description: V2 show end event - when a show ends
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - dj_name
            - timestamp
          properties:
            entry_type:
              type: string
              enum: [show_end]
            dj_name:
              type: string
            timestamp:
              type: string
              format: date-time

    FlowsheetV2DJJoinEntry:
      description: V2 DJ join event - when a DJ joins an active show
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - dj_name
          properties:
            entry_type:
              type: string
              enum: [dj_join]
            dj_name:
              type: string

    FlowsheetV2DJLeaveEntry:
      description: V2 DJ leave event - when a DJ leaves an active show
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - dj_name
          properties:
            entry_type:
              type: string
              enum: [dj_leave]
            dj_name:
              type: string

    FlowsheetV2TalksetEntry:
      description: V2 talkset entry - DJ talk segment
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - message
          properties:
            entry_type:
              type: string
              enum: [talkset]
            message:
              type: string

    FlowsheetV2BreakpointEntry:
      description: V2 breakpoint entry - hour marker
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
          properties:
            entry_type:
              type: string
              enum: [breakpoint]
            radio_hour:
              type: string
              format: date-time
              nullable: true
              description: >-
                Exact top-of-hour this breakpoint marks (ISO 8601), sourced from
                tubafrenzy's RADIO_HOUR. Distinct from `add_time`, which is the
                row's logging instant (~1 min before the hour). Optional and
                nullable: absent on servers predating the producer rollout, null
                for breakpoint rows not yet backfilled. Clients use `radio_hour`
                for the hour-marker label when present and fall back to `add_time`
                otherwise.
            message:
              type: string
              nullable: true

    FlowsheetV2MessageEntry:
      description: V2 message entry - custom/arbitrary message
      allOf:
        - $ref: '#/components/schemas/FlowsheetV2Base'
        - type: object
          required:
            - entry_type
            - message
          properties:
            entry_type:
              type: string
              enum: [message]
            message:
              type: string

    FlowsheetV2PaginatedResponse:
      type: object
      required:
        - entries
        - page
        - limit
        - total
        - totalPages
      properties:
        entries:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/FlowsheetV2TrackEntry'
              - $ref: '#/components/schemas/FlowsheetV2ShowStartEntry'
              - $ref: '#/components/schemas/FlowsheetV2ShowEndEntry'
              - $ref: '#/components/schemas/FlowsheetV2DJJoinEntry'
              - $ref: '#/components/schemas/FlowsheetV2DJLeaveEntry'
              - $ref: '#/components/schemas/FlowsheetV2TalksetEntry'
              - $ref: '#/components/schemas/FlowsheetV2BreakpointEntry'
              - $ref: '#/components/schemas/FlowsheetV2MessageEntry'
            discriminator:
              propertyName: entry_type
              mapping:
                track: '#/components/schemas/FlowsheetV2TrackEntry'
                show_start: '#/components/schemas/FlowsheetV2ShowStartEntry'
                show_end: '#/components/schemas/FlowsheetV2ShowEndEntry'
                dj_join: '#/components/schemas/FlowsheetV2DJJoinEntry'
                dj_leave: '#/components/schemas/FlowsheetV2DJLeaveEntry'
                talkset: '#/components/schemas/FlowsheetV2TalksetEntry'
                breakpoint: '#/components/schemas/FlowsheetV2BreakpointEntry'
                message: '#/components/schemas/FlowsheetV2MessageEntry'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Total number of entries
        totalPages:
          type: integer
          description: Total number of pages
        on_air:
          allOf:
            - $ref: '#/components/schemas/OnAirInfo'
          nullable: true
          description: >-
            The DJ currently on air, when known. An object with `dj_name` means a
            named DJ is live; JSON `null` means the station is confirmed on
            automation ("Auto DJ"); the field being absent entirely means the
            server does not report on-air status (older backends / non-default
            query branches) and clients should treat it as unknown rather than
            asserting automation. Not in `required` so absence stays distinct
            from an explicit `null`.


            Codegen note: this three-way distinction (object / null / absent)
            survives openapi-typescript (`on_air?: OnAirInfo | null`), but a
            *synthesized* decoder in Swift (Codable `decodeIfPresent`), Kotlin
            (kotlinx default value), or Python (pydantic `| None = None`) collapses
            JSON `null` and an absent key into the same value. A consumer that
            needs the third state must decode by key presence (e.g. Swift's
            `container.contains` + `decodeNil`), as the iOS app does — do not rely
            on a generated model to tell `null` from absent.

    OnAirInfo:
      type: object
      required:
        - dj_name
      description: >-
        Minimal, name-only on-air DJ shape for the `on_air` field. Deliberately
        separate from `OnAirDJ`, which additionally carries an `id` (a nullable
        `auth_user.id` string) that the `on_air` banner has no use for.
      properties:
        dj_name:
          type: string
          description: Display name of the DJ currently on air.

    OnAirDJ:
      type: object
      required:
        - id
        - dj_name
      properties:
        id:
          type: string
          nullable: true
          description: >-
            The DJ's better-auth `auth_user.id` (an opaque `varchar(255)`
            string), or `null` for a legacy/tubafrenzy-mirrored show whose on-air
            DJ has no Backend-Service account (their identity is `legacy_dj_name`,
            surfaced on `/flowsheet/djs-on-air` with a null id). Historically
            mistyped as `integer`; corrected to the nullable string it is at
            runtime (BS#1547).
        dj_name:
          type: string

    OnAirStatusResponse:
      type: object
      required:
        - djs
        - onAir
      properties:
        djs:
          type: array
          items:
            $ref: '#/components/schemas/OnAirDJ'
        onAir:
          type: string
          description: Status indicator - "on" or "off"

    Show:
      type: object
      properties:
        id:
          type: integer
        primary_dj_id:
          type: integer
        specialty_id:
          type: integer
        show_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true

    OpenShow:
      type: object
      description: >
        One open show as reported by `GET /flowsheet/open-shows`. Distinct from
        `Show`: it carries the derived `entry_count`, `is_current` and
        `likely_abandoned` fields, and omits `end_time`, which is NULL for
        every member of this collection by construction.
      required:
        - id
        - primary_dj_id
        - dj_name
        - show_name
        - start_time
        - legacy_show_id
        - entry_count
        - is_current
        - likely_abandoned
      properties:
        id:
          type: integer
        primary_dj_id:
          type: string
          nullable: true
          description: >
            NULL for legacy/tubafrenzy-originated shows and for any show whose
            DJ account was deleted (`ON DELETE SET NULL`). Such a show can
            still be closed via `force-end`.
        dj_name:
          type: string
          nullable: true
          description: >
            The public DJ handle, resolved through the standard chain
            (per-show override, then the linked account's handle, then the
            legacy tubafrenzy handle). Never a real name. NULL when
            unresolvable.
        show_name:
          type: string
          nullable: true
        start_time:
          type: string
          format: date-time
        legacy_show_id:
          type: integer
          nullable: true
          description: The tubafrenzy surrogate key, when this show was mirrored.
        entry_count:
          type: integer
          description: Flowsheet rows belonging to this show, all entry types included.
        is_current:
          type: boolean
          description: >
            True for the single show every on-air read resolves to. Present so a
            client can never offer to close the live broadcast.
        likely_abandoned:
          type: boolean
          description: >
            Advisory only — an operator hint, not a verdict. True when the show
            is not current and has fewer than four entries. A show with many
            entries can still be abandoned; check `start_time`.

    OpenShowsResponse:
      type: object
      required:
        - shows
        - total_in_window
        - older_open_show_count
      properties:
        shows:
          type: array
          description: Ordered oldest-first by `start_time`, tie-broken on `id`.
          items:
            $ref: '#/components/schemas/OpenShow'
        total_in_window:
          type: integer
          description: >
            How many open shows the window holds in total, before `limit`
            truncates. `shows.length < total_in_window` is the only way a
            caller can tell it is looking at a partial answer.
        older_open_show_count:
          type: integer
          description: >
            Open shows that started BEFORE the window, reported as a count and
            never listed. Almost all of these are legacy imports whose
            `show_end` never arrived; see the endpoint description. Widen
            `window_hours` to reach them.


            **Expected to go to zero and stay there.** This field and the
            30-year `window_hours` ceiling both exist for one finite cohort —
            the ~2,813 shows WXYC/Backend-Service#1543 repairs from the final
            tubafrenzy dump. Once that lands, both are vestigial and a later
            contract version should drop them rather than preserve them out of
            habit.

    ShowDJ:
      type: object
      properties:
        show_id:
          type: integer
        dj_id:
          type: integer
        active:
          type: boolean

    ShowPlaylist:
      type: object
      properties:
        show_name:
          type: string
        specialty_show:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        show_djs:
          type: array
          items:
            $ref: '#/components/schemas/OnAirDJ'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryResponse'

    ShowPeek:
      type: object
      properties:
        show:
          type: integer
        show_name:
          type: string
        date:
          type: string
          format: date-time
        djs:
          type: array
          items:
            type: object
            properties:
              dj_id:
                type: integer
              dj_name:
                type: string
                nullable: true
        specialty_show:
          type: string
        preview:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryResponse'

    # ===================
    # Catalog Types
    # ===================

    Artist:
      type: object
      required:
        - id
        - artist_name
        - code_letters
        - code_artist_number
        - genre_id
      properties:
        id:
          type: integer
        artist_name:
          type: string
        code_letters:
          type: string
        code_artist_number:
          type: integer
        genre_id:
          type: integer

    ArtistWithGenre:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          required:
            - genre_name
          properties:
            genre_name:
              type: string
              description: >
                Free-form: `genres.genre_name` is a `varchar(64)` in a lookup
                table `POST /library/genres` appends to. `GET /library/genres`
                is the authoritative enumeration (#367).

    Album:
      type: object
      required:
        - id
        - artist_id
        - album_title
        - code_number
        - genre_id
        - format_id
      properties:
        id:
          type: integer
        artist_id:
          type: integer
        album_title:
          type: string
        code_number:
          type: integer
        genre_id:
          type: integer
        format_id:
          type: integer
        label:
          type: string
        label_id:
          type: integer
        add_date:
          type: string
          format: date-time
        disc_quantity:
          type: integer
        alternate_artist_name:
          type: string
        album_artist:
          type: string
          description: Credited album artist for compilations (e.g., "Kruder & Dorfmeister" on a DJ-Kicks release filed under Various Artists).
        discogsUnavailable:
          type: boolean
          description: |
            MD-set marker indicating this release is intentionally not on
            Discogs (embargoed promo, audience-segment release, etc.). When
            true, the LML runtime-lookup chokepoint does not attempt Discogs
            resolution for this release. See WXYC/wiki plans/rotation-discogs-unavailable.md.
        discogsUnavailableNote:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text reason for `discogsUnavailable`.
        lastDiscogsRecheckAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Stamped on every recheck attempt by the
            `library-discogs-unavailable-recheck` cron. Read-only from the
            client side.

    UpdateAlbumRequest:
      type: object
      description: |
        Partial-update payload for `PATCH /library/{id}` (BS#1154). Mirrors
        Backend-Service's wire-level `UpdateAlbumRequest` type
        (apps/backend/controllers/library.controller.ts) exactly: only fields
        present in the body are validated and written. The 8 legacy fields
        are snake_case (matching AddAlbumRequest / the DB columns); the two
        BS#1281 discogs fields are camelCase, per the whitelist BS's
        `UPDATABLE_ALBUM_FIELDS` actually reads from `req.body`.
        `artist_name` and `code_number` are deliberately absent — they are
        server-derived (re-attribution side effects of an `artist_id`
        change), never read from the client body. `lastDiscogsRecheckAt` is
        also absent — it is server-write-only (the recheck cron writes it
        directly).
      properties:
        album_title:
          type: string
        label:
          type: string
        label_id:
          type: integer
          nullable: true
        genre_id:
          type: integer
        format_id:
          type: integer
        artist_id:
          type: integer
        alternate_artist_name:
          type: string
          nullable: true
        disc_quantity:
          type: integer
        discogsUnavailable:
          type: boolean
        discogsUnavailableNote:
          type: string
          nullable: true
          maxLength: 500

    AlbumSearchResult:
      type: object
      required:
        - id
        - add_date
        - album_title
        - artist_name
        - code_letters
        - code_number
        - code_artist_number
        - format_name
        - genre_name
        - label
      properties:
        id:
          type: integer
        add_date:
          type: string
          format: date-time
        album_title:
          type: string
        artist_name:
          type: string
        code_letters:
          type: string
        code_number:
          type: integer
        code_artist_number:
          type: integer
        format_name:
          type: string
        genre_name:
          type: string
        label:
          type: string
        label_id:
          type: integer
        artist_id:
          type: integer
          description: >
            The WXYC catalog artist id, sharing the `library.artist_id`
            keyspace. Optional here (never required): it lands ahead of the
            Backend-Service change that populates it (BS#2227), so a consumer
            compiled against this field must still tolerate its absence until
            that deploys.
        legacy_release_id:
          type: integer
          description: >
            The library row's surrogate key (BS#1963), NOT NULL in the
            database since migration 0137. Optional here (never required)
            because the column is emitted per-projection, not globally: NOT
            NULL is a claim about the column, while `required` is a promise
            that the key appears on the wire, and WXYC/Backend-Service#2167 is
            open precisely because the LML search-proxy rows do not emit it
            explicitly yet. Promoting this to required once every projection
            returning the schema provably emits it is worth doing, and needs a
            per-projection audit rather than a text edit. Matches the
            CatalogExportRow and BulkResolveInput precedent.
        # Optional fields from fuzzy search
        album_dist:
          type: number
        artist_dist:
          type: number
        # Optional rotation info
        rotation_bin:
          $ref: '#/components/schemas/RotationBin'
        rotation_id:
          type: integer
        plays:
          type: integer
        on_streaming:
          type: boolean
          description: True if this release is available on at least one streaming service. False means only available in the WXYC physical library. Null if unknown.
        album_artist:
          type: string
          description: Credited album artist for compilations.
        date_lost:
          type: string
          format: date-time
          description: When the release was marked missing from the physical library. Null if in library.
        date_found:
          type: string
          format: date-time
          description: When a previously missing release was found. Null if never lost.
        artwork_url:
          type: string
          nullable: true
          description: Album cover artwork URL from Discogs. Null if artwork has not been fetched yet or is unavailable.
        discogsUnavailable:
          type: boolean
          description: |
            MD-set marker indicating this release is intentionally not on
            Discogs (embargoed promo, audience-segment release, etc.). When
            true, the LML runtime-lookup chokepoint does not attempt Discogs
            resolution for this release. See WXYC/wiki plans/rotation-discogs-unavailable.md.
        discogsUnavailableNote:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text reason for `discogsUnavailable`.
        lastDiscogsRecheckAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Stamped on every recheck attempt by the
            `library-discogs-unavailable-recheck` cron. Read-only from the
            client side.
        matched_via:
          type: array
          items:
            $ref: '#/components/schemas/TrackMatchHint'
          description: >
            Populated by Backend's catalog `/library/` search when a track-title match
            (CTA or LML proxy fallback) drove this release into the results, per
            catalog-track-search plan §5.1. Empty or absent on normal artist/album hits.
            Backward-compatible — existing consumers ignore the field.
        matched_via_alias:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMatchHint'
          description: >
            Populated by Backend's catalog search when an artist-alias match
            (from `artist_search_alias`) drove this release into the results,
            per artist-search-alias plan PR 5. Sibling field to `matched_via`
            (which is track-title provenance). Empty or absent on normal
            artist/album hits. Backward-compatible — existing consumers
            ignore the field.

    CatalogExportRow:
      type: object
      description: >
        One row of the WXYC library catalog as served by GET /library/catalog
        for offline cloning (BS#1468, Epic F #1466). A query-independent snapshot
        of the core catalog row. Deliberately NOT AlbumSearchResult: it drops the
        search-only decoration (matched_via, matched_via_alias, album_dist,
        artist_dist) and the fields the export omits (add_date, label_id,
        rotation_id, date_lost, date_found), and instead ships
        rotation RAW (rotation_bin + rotation_kill_date) so the client evaluates
        rotation expiry against its own clock. See the rotation_bin description
        for the load-bearing semantic difference from AlbumSearchResult.

        BS#1965 adds the fields the Backend-sourced library.db producer
        (discogs-etl#351) needs to build a library.db over HTTP instead of a
        direct Postgres read: legacy_release_id (the producer emits it AS the
        library.db id, since BS serials collide with the tubafrenzy id space),
        album_artist, alternate_artist_name, and cross_reference_names.

        All four are producer-facing and OPTIONAL on the wire — none is in
        `required`, so the pre-BS#1965 15-field body still decodes cleanly
        against a client generated from this spec. That leniency is deliberate
        and load-bearing: this row is also the iOS Spotlight clone's shape, and
        wxyc-ios-64 regenerates from this SSOT on its own cadence. A required
        key the server does not yet emit would not degrade one field — it would
        fail EVERY NDJSON line and take the whole on-device clone with it. Same
        reasoning as `popularity` (BS#1486 Phase-2 Track 3). Note that oasdiff
        does NOT flag adding a required response property, so a green
        `check:breaking` is not evidence of safety here.
      required:
        - id
        - artist_name
        - album_title
        - code_letters
        - code_number
        - code_artist_number
        - genre_name
        - format_name
      properties:
        id:
          type: integer
          description: >
            BS serial library.id — the existing on-device clone key for the iOS
            Spotlight consumer. NOT the library.db id: the library.db producer
            uses legacy_release_id instead (see below), so BS serials never leak
            into the tubafrenzy id space.
        legacy_release_id:
          type: integer
          nullable: true
          description: >
            The library row's surrogate key (BS#1963), total in the database
            since the mint + NULL-legacy backfill. The Backend-sourced
            library.db producer (discogs-etl#351) emits this AS library.db's
            library.id.

            Server-side totality does NOT make it a required wire key: it is
            optional + nullable here so a client regenerated from this spec
            before BS#1965 ships still decodes the current 15-field body (see
            the schema description). The producer may treat a null/absent value
            as "this Backend does not implement BS#1965 yet" and fail loudly
            rather than emitting a library.db row with a null id.
        artist_name:
          type: string
          description: >
            Authoritative artist name. The server COALESCEs the denormalized
            library.artist_name to artists.artist_name (NOT NULL), so this never
            ships as null even before the denormalization backfill completes.
        alternate_artist_name:
          type: string
          nullable: true
          description: >
            Secondary artist name curated by the librarians
            (library.alternate_artist_name); null when unset. Maps to
            library.db's alternate_artist_name column.
        album_artist:
          type: string
          nullable: true
          description: >
            Album-level artist (library.album_artist), distinct from the
            shelf-filing artist_name; null when unset. Maps to library.db's
            album_artist column. (Previously omitted from this export; re-added
            for the library.db producer.)
        cross_reference_names:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Names of the artists cataloger-cross-referenced to this row's
            artist, in either FK direction, via artist_crossreference
            (discogs-etl#334) — e.g. a band filed under its name carries a
            member's personal name. Empty array when the artist has no
            cross-references.

            An ARRAY, not the pipe-joined string library.db stores: the
            producer does the `" | "` join when it writes the SQLite column.
            The wire must not carry the delimiter, because nothing constrains
            artists.artist_name from containing "|" or " | " — a joined string
            would silently split into phantom aliases on the consumer side
            (library-metadata-lookup splits this field on the pipe) with no
            escaping rule to recover from, and the legacy MySQL source has the
            same latent bug plus GROUP_CONCAT's silent group_concat_max_len
            truncation. Array-on-the-wire retires both.

            Derivation (pinned, because the legacy query it replaces is
            load-bearing for the producer — LIBRARY_CODE_CROSS_REFERENCE in
            discogs-etl/scripts/sync-library.sh):
              * BOTH FK directions — an artist_crossreference row matching on
                either source_artist_id or target_artist_id contributes its
                OTHER side.
              * EXCLUDES the row's own artist (the legacy query's
                `AND xlc.ID != lc.ID`). A self-referencing crossreference row
                must not produce a self-alias — LML would match the artist
                against itself.
              * Deduplicated.
              * Ordered by Unicode code point (Postgres `COLLATE "C"`), NOT the
                database's default collation. en_US.UTF-8 ignores punctuation
                and case at the primary level, so it orders the diacritic- and
                punctuation-bearing names most likely to carry aliases (Nilüfer
                Yanya, Csillagrablók, Hermanos Gutiérrez, "C. Spencer Yeh")
                unstably across locales. The legacy GROUP_CONCAT has no ORDER BY
                at all, so there is no legacy order to match — pick the
                deterministic one.

            FRESHNESS: this endpoint's conditional GET rides library_watermark.
            Migration 0105 fanned the watermark trigger out to library, artists,
            genres, format, genre_artist_crossreference, and rotation;
            artist_crossreference was left uncovered until migration 0138 added
            touch_library_watermark_from_artist_crossreference (AFTER INSERT OR
            UPDATE OR DELETE OR TRUNCATE ... FOR EACH STATEMENT). A
            cross-reference write now advances the watermark, the per-watermark
            gzip cache rebuilds, and the producer's next fetch carries the new
            alias. Before 0138 this was silent and unbounded rather than a
            bounded lag — a write to an uncovered source table changed nothing
            observable until an unrelated write on a covered table happened to
            bump the watermark, which is why every table a field on this row is
            derived from must carry the trigger.
        album_title:
          type: string
        code_letters:
          type: string
          description: Shelf call-number letters (e.g. "AU").
        code_number:
          type: integer
          description: Shelf call-number release number.
        code_artist_number:
          type: integer
          description: Shelf call-number artist number (genre-scoped).
        label:
          type: string
          nullable: true
          description: >
            Record label (library.label), projected as its real value — null
            only when the row genuinely has none. The library.db producer
            ignores it (the legacy MySQL export it must match has no label
            column), but every other consumer of this export should treat it as
            live data.
        genre_name:
          type: string
        format_name:
          type: string
        on_streaming:
          type: boolean
          nullable: true
          description: True if on >=1 streaming service; false if physical-only; null if unknown.
        plays:
          type: integer
          nullable: true
          description: >
            Per-pressing LINKED play count for THIS catalog row (from album_plays).
            The honest per-release number; to rank by real popularity across all
            pressings of a logical album, use `popularity` instead.
        popularity:
          type: integer
          nullable: true
          description: >
            Attribution-corrected popularity (BS#1486 Phase-2 Track 3): a play
            count for this row's LOGICAL album rather than this single pressing.
            Pressings that resolve to the same Discogs master (~90% of RESOLVED
            library rows) collapse into one count; release-only and unresolved
            rows keep a per-release or per-library key, with no cross-pressing
            collapse. It also adds the free-text/unlinked plays Track 1 has
            resolved to the same release/master (the ~43% free-text tail is the
            ceiling, not all of it — only the resolved subset counts), which the
            linked-only `plays` cannot see. Rank releases by `popularity`. null
            when the album_popularity signal has no row for this row's logical
            key. Distinct from `plays`, which stays the per-pressing linked count.
        artwork_url:
          type: string
          nullable: true
          description: Album cover URL from Discogs; null if not yet fetched.
        rotation_bin:
          type: string
          nullable: true
          description: >
            RAW current-rotation bin — the most-recently-ADDED rotation record
            for this album — NOT the CURRENT_DATE-filtered value AlbumSearchResult
            returns. The values are H/M/L/S (see RotationBin), typed here as a
            free string rather than that enum as a forward-compatibility hedge:
            a bin added server-side ahead of its clients then cannot break a
            strict-enum decoder mid-rollout. The hedge matters more on THIS
            endpoint than on the others that $ref RotationBin, because the body
            is NDJSON cloned in bulk — one unknown value would fail every line
            and take a client's whole on-device catalog with it, rather than
            one row.
            Evaluate live rotation client-side together with
            rotation_kill_date:
              in rotation  ==  rotation_bin != null
                              AND (rotation_kill_date == null
                                   OR rotation_kill_date > today-in-client-tz)
            The daily kill-date expiry is a clock event no DB trigger can observe,
            which is why this endpoint ships raw and defers expiry to the client.
        rotation_kill_date:
          type: string
          format: date
          nullable: true
          description: >
            Date (YYYY-MM-DD; server ::text cast) the current rotation record
            expires, or null if it has none. Used with rotation_bin to evaluate
            live rotation client-side. Absent from AlbumSearchResult — a client
            that reuses AlbumSearchResult for this endpoint silently loses it.

    CatalogCompilationTrackRow:
      type: object
      description: >
        One compilation_track_artist (CTA) row as served by
        GET /library/catalog/compilation-tracks for the Backend-sourced
        library.db producer (BS#1965 / discogs-etl#351). The sibling of
        CatalogExportRow: where that endpoint feeds library.db's `library` table,
        this feeds its `compilation_track_artist` table (3 columns:
        library_release_id, artist_name, track_title). Keyed on
        legacy_release_id — the library row's surrogate key that the producer
        also emits AS library.db's library.id — so the producer maps
        legacy_release_id -> compilation_track_artist.library_release_id.
        Deliberately drops the CTA row id and track_position: library.db's
        3-column CTA table carries neither, so shipping them would break parity.
        Distinct from CompilationTrack (the BS#1964 dj-site read shape, which
        keeps id + track_position and is keyed on the BS serial library_id).
      required:
        - legacy_release_id
        - artist_name
      properties:
        legacy_release_id:
          type: integer
          description: >
            The owning library row's legacy_release_id (BS#1963). Becomes
            library.db's compilation_track_artist.library_release_id, which joins
            to library.db's library.id.
        artist_name:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Per-track performing artist (CTA.artist_name). Bounds mirror
            CompilationTrackInput and the underlying varchar(255) NOT NULL — the
            read and write shapes over the same physical column must not
            disagree about their own constraints, and the producer needs the
            width to size its SQLite column.
        track_title:
          type: string
          maxLength: 255
          nullable: true
          description: Track title; nullable varchar(255), matching the CTA column.

