          type: boolean
          enum: [false]
        deactivatedBy:
          $ref: '#/components/schemas/AutoDJActivationSource'
        deactivatedAt:
          type: string
          format: date-time

security:
  - BearerAuth: []

paths:
  /flowsheet:
    get:
      x-wxyc-service: backend-service
      summary: Get flowsheet entries
      description: |
        This is also where the V2 projection ships: `projectEntriesV2` is called
        from the handler mounted here, not from a `/v2` prefix. No `/v2` router
        exists. The `FlowsheetV2*` schemas under `components.schemas` are that
        wire shape and are the DTOs consumers import.
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of entries to return
        - name: shows_limit
          in: query
          schema:
            type: integer
          description: Number of shows to return entries from
        - name: page
          in: query
          schema:
            type: integer
          description: Page number for pagination
        - name: start_id
          in: query
          schema:
            type: integer
          description: First play_order id in range (must be provided with end_id)
        - name: end_id
          in: query
          schema:
            type: integer
          description: Last play_order id in range (must be provided with start_id)
      responses:
        '200':
          description: List of flowsheet entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowsheetEntryResponse'

    post:
      x-wxyc-service: backend-service
      summary: Add entry to flowsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/FlowsheetCreateSongFromCatalog'
                - $ref: '#/components/schemas/FlowsheetCreateSongFreeform'
                - $ref: '#/components/schemas/FlowsheetCreateMessage'
      responses:
        '200':
          description: Successfully added entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetEntryResponse'

    patch:
      x-wxyc-service: backend-service
      summary: Update flowsheet entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowsheetUpdateRequest'
      responses:
        '200':
          description: Successfully updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetEntryResponse'

    delete:
      x-wxyc-service: backend-service
      summary: Delete flowsheet entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_id
              properties:
                entry_id:
                  type: integer
      responses:
        '200':
          description: Successfully deleted entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetEntryResponse'

  /flowsheet/latest:
    get:
      x-wxyc-service: backend-service
      summary: Get the most recent flowsheet entry
      security: []
      responses:
        '200':
          description: Latest flowsheet entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetEntryResponse'

  /flowsheet/join:
    post:
      x-wxyc-service: backend-service
      summary: Start or join a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dj_id
              properties:
                dj_id:
                  type: integer
                show_name:
                  type: string
                  description: Required only when starting a new show
                specialty_id:
                  type: integer
                  description: ID of specialty show entry
                dj_name_override:
                  type: string
                  maxLength: 255
                  description: >
                    Optional per-show override for the public DJ name. When
                    present and non-empty after trim, supersedes the caller's
                    `auth_user.dj_name`-derived name on the `show_start` marker
                    text, on the `flowsheet.dj_name` column of every entry in
                    this show, and on `shows.legacy_dj_name`. Empty or
                    whitespace-only values are treated as absent. Scoped to the
                    new-show (start-show) path; the co-host /join branch
                    intentionally ignores this field. Max length matches
                    `auth_user.dj_name varchar(255)`.
      responses:
        '200':
          description: Successfully joined/started show
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Show'
                  - $ref: '#/components/schemas/ShowDJ'

  /flowsheet/end:
    post:
      x-wxyc-service: backend-service
      summary: End or leave a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dj_id:
                  type: integer
      responses:
        '200':
          description: Successfully ended/left show
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Show'
                  - $ref: '#/components/schemas/ShowDJ'

  /flowsheet/open-shows:
    get:
      x-wxyc-service: backend-service
      summary: List open shows an operator may need to close
      description: >
        Every show with `end_time IS NULL` that started inside the lookback
        window, oldest first, with its flowsheet entry count. Replaces
        tubafrenzy's "Resume a Show" list, which retires with tubafrenzy on
        2026-08-31.


        Requires the `flowsheet: manage` permission — `musicDirector` or
        `stationManager`. A plain `dj` gets 403. This is narrower than the
        legacy capability it replaces, which had no ownership or role check.


        **The window is not cosmetic.** `end_time IS NULL` is not a reliable
        "still on the air" signal: a show whose `show_end` delivery was dropped
        keeps a NULL `end_time` permanently and nothing re-closes it on a
        schedule. Measured on production 2026-08-21, 2,814 shows were open and
        exactly one had started within 90 days — the rest are legacy ETL
        imports going back to 2006. An unwindowed list buries the actionable
        show, so the older cohort is reported as a count via
        `older_open_show_count` and reached by widening `window_hours`.
      parameters:
        - name: window_hours
          in: query
          required: false
          description: >
            Lookback in whole hours from now, applied to `start_time`. Defaults
            to 168 (7 days). A non-integer or out-of-range value is a 400,
            never a silent clamp.


            The ceiling is 262800 (30 years) so the window can actually REACH
            the cohort `older_open_show_count` reports — production's open
            shows start in 2006. What bounds the response is `limit`, not this.
          schema:
            type: integer
            minimum: 1
            maximum: 262800
            default: 168
        - name: limit
          in: query
          required: false
          description: >
            Rows returned. Compare `shows.length` against `total_in_window` to
            tell a truncated page from a complete one.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Open shows inside the window, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShowsResponse'
        '400':
          description: "window_hours or limit was not an integer in range"
        '403':
          description: "Caller lacks the `flowsheet: manage` permission"

  /flowsheet/shows/{id}/force-end:
    post:
      x-wxyc-service: backend-service
      summary: End a show the caller does not own
      description: >
        Closes an abandoned show. Writes the same `show_end` marker,
        deactivates the same `show_djs` memberships and mirrors the same
        tubafrenzy sign-off as `POST /flowsheet/end` — it reuses that
        implementation rather than duplicating it.


        Requires the `flowsheet: manage` permission, the same gate as
        `GET /flowsheet/open-shows`. No request body: the show is identified by
        the path, and the caller's own identity is irrelevant to which show is
        closed.


        A show whose `primary_dj_id` is NULL can be closed through this
        endpoint. That is deliberate — it is the shape of the entire legacy
        open-show backlog, and it is not reachable through
        `POST /flowsheet/end`.


        `end_time` and the `show_end` marker's `add_time` come from the show's
        last logged entry, NOT from the moment the request is made. A show from
        the legacy backlog stamped with `now()` would carry an interval
        overlapping every `GET /flowsheet/range` window since it started, and
        its marker would sort to the top of the public flowsheet.


        Ending an already-ended show is a 400, decided by a compare-and-set on
        `end_time IS NULL`, so two concurrent operators cannot both write a
        `show_end` marker.
      parameters:
        - name: id
          in: path
          required: true
          description: Backend-Service `shows.id`, not the tubafrenzy `legacy_show_id`.
          schema:
            type: integer
        - name: force
          in: query
          required: false
          description: >
            Send `true` to close the show that is currently on air. Without it,
            targeting the current show is a 409.


            The override exists because an abandoned show IS the current show
            until something closes it — the 2026-08-20 incident that motivated
            this endpoint hung for nine hours as `max(shows.id)`. The
            confirmation is aimed at a mistyped id, or at an operator acting on
            a list fetched before a new show signed on.
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: The finalized show, with `end_time` set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
        '400':
          description: The id was not a positive integer, or the show is already ended
        '403':
          description: "Caller lacks the `flowsheet: manage` permission"
        '404':
          description: No show with that id
        '409':
          description: The target is the current on-air show and `force=true` was not sent

  /flowsheet/djs-on-air:
    get:
      x-wxyc-service: backend-service
      summary: Get list of DJs currently on air
      security: []
      responses:
        '200':
          description: List of active DJs
          content:
