    GenreEntry:
      type: object
      description: >
        One row of `GET /library/genres` — the authoritative enumeration of
        the genres this station files under. Do not hardcode the set: it is a
        lookup table `POST /library/genres` appends to, and a closed enum here
        previously declared ten values while production held fifteen (#367).
        As of 2026-08 those fifteen are Africa, Asia, Blues, Classical,
        Comedy, Hiphop, Jazz, Latin, OCS, Reggae, Rock, Soundtracks, Spoken,
        Xmas, Electronic — listed to orient a reader, not as a contract.
      required:
