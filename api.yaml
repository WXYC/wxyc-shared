                $ref: '#/components/schemas/AppConfig'

  /config/secrets:
    get:
      x-wxyc-service: backend-service
      summary: Get third-party API credentials
      description: >
        Returns API credentials for third-party services (e.g. Discogs) that
        the app needs to call directly. Requires device session
        authentication — unlike `/config`, this is not public bootstrap
        config. Served `Cache-Control: private, max-age=3600` — private
        because the response carries per-deploy credentials that must not
        be stored by a shared/intermediate cache, unlike `/config`'s
        `public, max-age=3600`. The 1-hour bound governs HTTP-level cache
        freshness only — it is a floor on rotation latency, not a ceiling.
        Like `AppConfig`, clients may hold the decoded credentials for the
        life of a process (the iOS app fetches secrets once per launch and
        builds its Discogs client from them permanently), so a rotated-out
        credential can remain in use for an hour or more, until every
        client process relaunches or re-fetches. Rotation is therefore not
        contained by this TTL: treat the old credential as live until it
        is revoked at the provider, and pair any rotation with server-side
        revocation rather than waiting out the cache.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Third-party API credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecrets'

  /proxy/artwork/search:
    get:
      x-wxyc-service: backend-service
      summary: Search for album artwork
      description: Searches for album artwork via Discogs-backed ArtworkFinder. Requires anonymous session auth.
      parameters:
        - name: artistName
          in: query
          required: true
          schema:
            type: string
          description: Artist name to search for
        - name: releaseTitle
          in: query
          schema:
            type: string
          description: Release/album title
      responses:
        '200':
          description: Artwork search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkSearchResponse'
        '400':
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /proxy/metadata/album:
    get:
      x-wxyc-service: backend-service
      summary: Get album metadata
      description: Fetches album metadata from Discogs, Spotify, Apple Music, and search URL providers. Requires anonymous session auth.
      parameters:
        - name: artistName
          in: query
          required: true
          schema:
            type: string
          description: Artist name
        - name: releaseTitle
          in: query
          schema:
            type: string
          description: Release/album title
        - name: trackTitle
          in: query
          schema:
            type: string
          description: Track title (used as fallback if releaseTitle not provided)
      responses:
        '200':
          description: Album metadata from multiple providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumMetadataResponse'
        '400':
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /proxy/metadata/artist:
    get:
      x-wxyc-service: backend-service
      summary: Get artist metadata
      description: Fetches artist bio and Wikipedia URL from Discogs by artist ID. Requires anonymous session auth.
      parameters:
        - name: artistId
          in: query
          required: true
          schema:
            type: integer
          description: Discogs artist ID
      responses:
        '200':
          description: Artist metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistMetadataResponse'
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /proxy/entity/resolve:
    get:
      x-wxyc-service: backend-service
      summary: Resolve a Discogs entity
      description: Resolves a Discogs entity (artist, release, or master) by type and ID. Requires anonymous session auth.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - artist
              - release
              - master
          description: Entity type
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: Discogs entity ID
      responses:
        '200':
          description: Resolved entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResolveResponse'
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /proxy/spotify/track/{id}:
    get:
      x-wxyc-service: backend-service
      summary: Get Spotify track metadata
      description: Fetches track metadata from Spotify using backend credentials. Requires anonymous session auth.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify track ID
      responses:
        '200':
          description: Spotify track metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotifyTrackResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Track not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: Spotify API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Spotify integration not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/stream:
    get:
      x-wxyc-service: backend-service
      summary: Subscribe to server-sent events (EventSource-friendly)
      description: >
        EventSource-friendly counterpart to `POST /events/register`. Native
        browser EventSource is GET-only and can't attach an `Authorization`
        header — this route accepts topics as a comma-separated query string
        and applies authorization per-topic via `TopicAuthz`. Public topics
        (e.g. `live-fs-topic`) succeed anonymously; DJ-tier topics filter out
        unless the caller carries a JWT with a matching role.

        The response body is a `text/event-stream` of newline-delimited
        `data: {...}\n\n` frames. The first frame is always a
        `connection-established` event carrying the server-assigned `client_id`.
        Subsequent frames depend on the subscribed topics — for `live-fs-topic`
        the frames are `LiveFsEvent` instances: a `LiveFsInsertEvent` (`insert`)
        when a row is first created (pending, pre-enrichment), a
        `LiveFsUpdateEvent` (`update`) when its metadata is finalized, and a
        `LiveFsRefetchEvent` (`refetch`) on bulk state changes.

        Contract: `CONTRACTS.LIVE_FS_PUBLIC_TOPIC_NO_AUTH`.
      security: []
      parameters:
        - name: topics
          in: query
          required: false
          schema:
            type: string
            description: >
              Comma-separated topic strings (`live-fs-topic`, `test-topic`).
              Unknown topics are silently dropped. Repeated `?topics=&topics=`
              (which Express parses as an array) is ignored.
          example: live-fs-topic
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                description: >
                  Newline-delimited `data: <JSON>\n\n` frames. The frames
                  themselves carry shapes from `LiveFsEvent` (for
                  `live-fs-topic`) plus the implicit `connection-established`
                  and `subscription` envelope events.
                oneOf:
                  - $ref: '#/components/schemas/LiveFsEvent'

  # ===================
  # Device Authorization (RFC 8628) — issue #195. Schemas live under
  # components/schemas/DeviceAuth*. /device/code + /device/token are PUBLIC;
  # /device/approve + /device/deny require a Better Auth session (BearerAuth);
  # GET /device accepts an optional session (used only to claim the code).
  # Mirrors better-auth 1.6.20 + Backend-Service#1495. (Refreshed at issue
  # #379: Backend-Service's node_modules-resolved version is now 1.6.26 —
  # see the /auth core-surface section below, which mirrors that version.
  # The device-authorization plugin's wire shapes were not re-diffed against
  # 1.6.26; re-verify if a device-auth defect is ever suspected.)
  # ===================

  /auth/device/code:
    post:
      x-wxyc-service: backend-service
      summary: Request a device + user code (RFC 8628 §3.2)
      description: >
        Starts the QR sign-in flow. The browser POSTs this, renders
        verification_uri_complete as a QR plus the user_code, then polls
        /auth/device/token. Public (no session required).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthCodeRequest'
      responses:
        '200':
          description: Device and user codes issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthCodeResponse'
        '400':
          description: 'invalid_request (malformed body) or invalid_client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthCodeError'

  /auth/device/token:
    post:
      x-wxyc-service: backend-service
      summary: Exchange a device_code for a session token (RFC 8628 §3.4)
      description: >
        The browser polls this until the DJ approves. Public (no session
        required). RFC 8628 polling states (authorization_pending, slow_down)
        are returned as 400 errors, not 2xx. Deliberately not rate-limited by
        the auth-service — the plugin enforces the polling interval server-side.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthTokenRequest'
      responses:
        '200':
          description: Authorization granted; session token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthTokenResponse'
        '400':
          description: >
            RFC 8628 polling state or bad request: authorization_pending,
            slow_down, expired_token, access_denied, invalid_request, invalid_grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthTokenError'
        '500':
          description: 'server_error — user lookup or session creation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthTokenError'

  /auth/device:
    get:
      x-wxyc-service: backend-service
      summary: Look up a device authorization by user_code
      description: >
        Returns the current status of a device authorization. A session is
        optional: anonymous callers get the status; a signed-in DJ additionally
        claims a pending code for their account.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
          description: The user code to look up.
      responses:
        '200':
          description: Current device authorization status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthVerifyResponse'
        '400':
          description: 'invalid_request (unknown user_code) or expired_token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthVerifyError'

  /auth/device/approve:
    post:
      x-wxyc-service: backend-service
      summary: Approve a device authorization (iOS scanner)
      description: >
        Called by the iOS app carrying the DJ's session. Flips the device code
        to approved so the polling browser receives a session. The auth-service
        gates this to roles >= dj; a member is rejected with access_denied (403).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthApproveRequest'
      responses:
        '200':
          description: Device authorization approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionResponse'
        '400':
          description: >
            invalid_request (unknown / unclaimed / already-processed code) or
            expired_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'
        '401':
          description: 'unauthorized — no valid session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'
        '403':
          description: >
            access_denied — caller is not the claiming user, or lacks the dj
            role (auth-service gate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'

  /auth/device/deny:
    post:
      x-wxyc-service: backend-service
      summary: Deny a device authorization (iOS scanner)
      description: >
        Called by the iOS app carrying the DJ's session to reject a scanned QR.
        Requires a Better Auth session. Not role-gated by the auth-service — the
        plugin's own userId check already prevents denying someone else's code.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthDenyRequest'
      responses:
        '200':
          description: Device authorization denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionResponse'
        '400':
          description: >
            invalid_request (unknown / unclaimed / already-processed code) or
            expired_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'
        '401':
          description: 'unauthorized — no valid session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'
        '403':
          description: 'access_denied — caller is not the claiming user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthActionError'

  # ===================
  # Auth — better-auth core surface (issue #379, wxyc-swift-auth Phase A).
  # Mirrors better-auth 1.6.26 plus one WXYC-custom route
  # (/auth/wxyc/lookup-email, marked below). Schemas live under
  # components/schemas/Auth* — see that section's header comment for the
  # verification sources and the $ref-closure constraint. Every operation
  # here is x-wxyc-service: backend-service — the auth app is mounted on
  # the same host (api.wxyc.org) as the rest of Backend-Service, per this
  # document's info.description.
  # ===================

  /auth/sign-in/email:
    post:
      x-wxyc-service: backend-service
      summary: Sign in with email and password
      description: >
        The org-canonical DJ sign-in route. `requireEmailVerification: true`
        is set server-side, so an unverified account 403s here (it does not
        for /auth/sign-in/email-otp, which marks the account verified on a
        correct code instead — mailbox possession being the proof the
        verification email would have demanded).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            set-auth-token:
              schema:
                type: string
              description: >
                The bearer plugin's response-header mirror of the session
                token — the primary channel; `token` in the body is the
                documented fallback for a caller that can't read response
                headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignInResult'
        '401':
          description: 'INVALID_EMAIL_OR_PASSWORD — user not found, or the password did not verify.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: >
            EMAIL_NOT_VERIFIED, or MISSING_OR_NULL_ORIGIN — better-auth's
            global originCheckMiddleware refuses a cookie-bearing request
            with no Origin header before any credential check. Reachable
            when a stale better-auth session cookie survives on the client
            from a prior sign-in (native clients suppress cookies to avoid
            this — see wxyc-dj-ios CLAUDE.md's CookielessSession).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: >
            Rate limited — 10 requests / 15 min per X-Real-IP
            (authMutationRateLimit covers every /auth/sign-in/* path).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'

  /auth/sign-in/username:
    post:
      x-wxyc-service: backend-service
      summary: Sign in with username and password
      description: >
        Validates the identifier's *shape* before any lookup — better-auth's
        default username pattern is `/^[a-zA-Z0-9_.]+$/` (Backend-Service
        registers `username({ minUsernameLength: 2 })` with no
        usernameValidator override), so an email-shaped identifier posted
        here 422s on shape alone. Route selection (email vs. username) is a
        client responsibility — see wxyc-dj-ios's SignInIdentifier for the
        `@`-based router this document does not encode.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameSignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            set-auth-token:
              schema:
                type: string
              description: Same contract as POST /auth/sign-in/email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignInResult'
        '401':
          description: 'INVALID_USERNAME_OR_PASSWORD — user not found, or the password did not verify.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: 'EMAIL_NOT_VERIFIED, or MISSING_OR_NULL_ORIGIN (see POST /auth/sign-in/email).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: >
            USERNAME_TOO_SHORT, USERNAME_TOO_LONG, or INVALID_USERNAME — the
            identifier failed shape validation before any credential check
            (e.g. an email-shaped identifier posted to this route).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: 'Rate limited — see POST /auth/sign-in/email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'

  /auth/wxyc/lookup-email:
    post:
      x-wxyc-service: backend-service
      summary: Resolve a login identifier to its verification email
      description: >
        WXYC-CUSTOM ROUTE — lookupEmailHandler in Backend-Service
        apps/auth/app.ts, not a better-auth endpoint, and NOT covered by
        this file's better-auth pinned-mirror comment above. Backend-Service
        owns its declared-vs-handler fidelity directly, so this is also the
        one operation in this section upstream declared-response-vs-handler
        verification (wxyc-shared#328) can fully cover once that lands. The
        OTP sign-in flow's leg 1: resolves a username to the address
        /auth/email-otp/send-verification-otp mails a code to. An identifier
        already containing '@' is echoed back unchanged by the handler
        without a lookup (email-shaped identifiers skip this route
        entirely). A mild enumeration vector (confirms whether a username
        exists) that the response never displays and the rate limiter
        bounds — see AuthPlainErrorResponse and LookupEmailResponse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupEmailRequest'
      responses:
        '200':
          description: >
            Resolved (or not — see LookupEmailResponse's `email: null`
            case).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupEmailResponse'
        '400':
          description: '"identifier required" — identifier missing or not a string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'
        '429':
          description: 'Rate limited — see POST /auth/sign-in/email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'
        '500':
          description: '"Internal server error" — unexpected failure resolving the identifier.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'

  /auth/email-otp/send-verification-otp:
    post:
      x-wxyc-service: backend-service
      summary: Mail a one-time sign-in code
      description: >
        The OTP sign-in flow's leg 2. `disableSignUp: true` makes this
        answer `{success: true}` for an unknown address too (the code is
        generated and immediately discarded server-side) — anti-enumeration
        by design, so a 200 here never confirms the account exists. Paired
        with POST /auth/sign-in/email-otp, which redeems the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLoginCodeRequest'
      responses:
        '200':
          description: Code sent (or silently discarded for an unknown address — see above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSendCodeResult'
        '400':
          description: >
            INVALID_EMAIL (malformed address — the one leg of this flow
            that CAN report a bad email, since an '@'-containing identifier
            skips the /auth/wxyc/lookup-email leg entirely), or "Invalid OTP
            type" (type: change-email — see SendLoginCodeRequest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: >
            Rate limited — 10 requests / 15 min per X-Real-IP
            (authMutationRateLimit covers this path by exact match).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'

  /auth/sign-in/email-otp:
    post:
      x-wxyc-service: backend-service
      summary: Redeem a mailed one-time code to sign in
      description: >
        A peer of the two password routes, not a variant of them — same
        setSessionCookie call, same globally-mounted bearer() plugin, so the
        same set-auth-token contract. One asymmetry: this route marks an
        unverified account's email verified and proceeds (mailbox
        possession is the proof the verification email would have
        demanded), where the password routes 403 EMAIL_NOT_VERIFIED
        instead. OTP verification is atomic and single-use (better-auth's
        atomicVerifyOTP): a correct code can be consumed by only one
        concurrent caller.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSignInRequest'
      responses:
        '200':
          description: Signed in (or registered, for an email signing in for the first time).
          headers:
            set-auth-token:
              schema:
                type: string
              description: Same contract as POST /auth/sign-in/email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenAndUserResult'
        '400':
          description: >
            INVALID_OTP (wrong code, already-consumed code, or no
            outstanding code for this email) or OTP_EXPIRED (past the 5
            minute TTL — the expired record is deleted, so a retry also
            reads as INVALID_OTP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: >
            TOO_MANY_ATTEMPTS — 5 wrong tries against one outstanding code
            (allowedAttempts: 5) locks that code out; the DJ must request a
            new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: 'Rate limited — see POST /auth/sign-in/email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'

  /auth/sign-in/anonymous:
    post:
      x-wxyc-service: backend-service
      summary: Create a throwaway anonymous session
      description: >
        The mechanism wxyc-ios-64 and WXYC-Android use for endpoints gated
        on any session rather than a DJ login (e.g. `/proxy/*`, `/concerts`
        after a /auth/token exchange). No request body. An anonymous session
        cannot sign in anonymously a second time (ANONYMOUS_USERS_CANNOT_SIGN_IN_AGAIN_ANONYMOUSLY)
        — a client must persist and reuse the session token rather than
        re-calling this on every launch.
      security: []
      parameters:
        - name: X-Device-Fingerprint
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Stable per-device identifier for BS's audit trail, associated
            with the newly-minted user.id at sign-in time. Optional —
            omitting it only means the audit trail is missing that
            association; the request still succeeds. See
            apps/auth/check-request-ban-handler.ts for the header's other,
            better-established consumer (POST /auth/check-request-ban).
      responses:
        '200':
          description: Anonymous session created.
          headers:
            set-auth-token:
              schema:
                type: string
              description: Same contract as POST /auth/sign-in/email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenAndUserResult'
        '400':
          description: >
            ANONYMOUS_USERS_CANNOT_SIGN_IN_AGAIN_ANONYMOUSLY (the caller's
            current session, if any, is already anonymous) or
            COULD_NOT_CREATE_SESSION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: 'Rate limited — /auth/sign-in/* is a prefix match, so this path is covered too (see POST /auth/sign-in/email).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPlainErrorResponse'
        '500':
          description: 'FAILED_TO_CREATE_USER — unexpected failure creating the anonymous user row.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/token:
    get:
      x-wxyc-service: backend-service
      summary: Exchange a session bearer for a short-lived JWT
      description: >
        `Authorization: Bearer <session token>` in, a signed JWT out —
        verifiable by Backend-Service's regular routes against the JWKS at
        GET /auth/jwks without a database round-trip. Only GET is
        registered for this path: any other method 404s (better-call has no
        route to match, not a 405 — verified against production). A missing,
        malformed, or expired/revoked session bearer 401s (UNAUTHORIZED);
        that is the only failure mode this path itself produces for a
        GET — there is no 404 for "wrong bearer," only for "wrong method or
        unknown path." `set-auth-token` on the 200 is conditional: better-auth
        re-issues the session cookie (and the bearer plugin mirrors it to this
        header) only on a rolling renewal, once per `session.updateAge`
        (Backend-Service: 1 day) — an ordinary call inside that window omits
        the header entirely. See INVARIANTS.md's set-auth-token rotation
        contract.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Device-Fingerprint
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Same audit-trail header as POST /auth/sign-in/anonymous — sent
            on every JWT mint, not only the first, so BS's audit trail can
            correlate a device across renewals.
      responses:
        '200':
          description: JWT minted.
          headers:
            set-auth-token:
              schema:
                type: string
              description: >
                Present only when this call triggered a rolling session
                renewal — see the operation description. Absent on a
                typical call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: 'UNAUTHORIZED — missing, malformed, or expired/revoked session bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/sign-out:
    post:
      x-wxyc-service: backend-service
      summary: Invalidate the current session
      description: >
        `Authorization: Bearer <session token>` in; deletes the session
        server-side (best-effort — a DB failure is logged, not surfaced) and
        clears the session cookie. Always 200 `{success: true}` — there is
        no distinct "already signed out" response, and a garbage or absent
        bearer still 200s (deleteSession is a no-op when no session token is
        found). After this call the session token 401s on GET /auth/token
        (see INVARIANTS.md).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Signed out (unconditionally — see above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignOutResult'
