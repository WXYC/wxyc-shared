          type: integer
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'

    BinLibraryDetails:
      type: object
      properties:
        album_id:
          type: integer
        album_title:
          type: string
        artist_name:
          type: string
        label:
          type: string
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        format_name:
          type: string
        genre_name:
          type: string
        legacy_release_id:
          type: integer
          description: >
            The library row's surrogate key (BS#1963), NOT NULL in the
            database since migration 0137. Optional here (never required)
            because the column is emitted per-projection, not globally: NOT
            NULL is a claim about the column, while `required` is a promise
            that the key appears on the wire, and WXYC/Backend-Service#2167 is
            open precisely because the LML search-proxy rows do not emit it
            explicitly yet. Promoting this to required once every projection
            returning the schema provably emits it is worth doing, and needs a
            per-projection audit rather than a text edit. Matches the
            CatalogExportRow and BulkResolveInput precedent.

    # ===================
    # Schedule Types
    # ===================

    # `day` on both shapes below is the integer the `smallint` column holds,
    # matching `Schedule.day` in type and in week-start (0 = Monday). It was a
    # string enum of day names starting Sunday until the two models were
    # reconciled.
    #
    # These shapes are reachable from `POST /schedule`, a live route, as its
    # request body and response — not only from a phantom path.
    #
    # The declared field set does not match the table the handler inserts into,
    # and the handler returns 201 against the 200 declared below. Tracked in
    # WXYC/Backend-Service#2224; do not fix it piecemeal here.
    ScheduleShift:
      type: object
      required:
        - id
        - dj_id
        - dj_name
        - day
        - start_time
        - end_time
      properties:
        id:
          type: integer
        dj_id:
          type: integer
        dj_name:
          type: string
        day:
          type: integer
          description: Day of the week 0 = Monday, 6 = Sunday
          minimum: 0
          maximum: 6
        start_time:
          type: string
          description: Time in HH:MM format
        end_time:
          type: string
          description: Time in HH:MM format
        show_name:
          type: string
        specialty_id:
          type: integer

    AddScheduleShiftRequest:
      type: object
      required:
        - dj_id
        - day
        - start_time
        - end_time
      properties:
        dj_id:
          type: integer
        day:
          type: integer
          description: Day of the week 0 = Monday, 6 = Sunday
          minimum: 0
          maximum: 6
        start_time:
          type: string
        end_time:
          type: string
        show_name:
          type: string
        specialty_id:
          type: integer

    SpecialtyShow:
      type: object
      required:
        - id
        - specialty_name
      properties:
        id:
          type: integer
        specialty_name:
          type: string
        description:
          type: string

    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: Primary key
        day:
          type: integer
          description: Day of the week 0 = Monday, 6 = Sunday
          minimum: 0
          maximum: 6
        start_time:
          type: string
          format: time
          description: Show start time
        show_duration:
          type: integer
          description: Duration in minutes
          minimum: 1
        specialty_id:
          type: integer
          nullable: true
          description: Reference to specialty show, null for regular shows
        assigned_dj_id:
          type: integer
          nullable: true
          description: Reference to primary DJ
        assigned_dj_id2:
          type: integer
          nullable: true
          description: Reference to secondary DJ

    # ===================
    # Request Line Types
    # ===================

    RequestStatus:
      type: string
